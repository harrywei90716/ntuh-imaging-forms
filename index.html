係（請圈選）：本人、配偶、父、母、兒、女、其他：_________\n住址：\n電話：\n日期：西元年月日時間：時分\n------------------------------------------------------------------------------------------------------------------------\n(1.如由病人、親屬或關係人簽署本同意書，則無需見證，見證人部分得免填。2.若意識清楚，但無法親自簽具\n者且無親屬或關係人在場，得以按指印代替簽名，惟應有二名見證人。3.若病人意識不清且無親屬或關係人在\n場，醫療緊急情況得由二名合格醫師在病歷上證明需檢查或治療即可。)\n見證人1：（簽章）見證人2：（簽章）\n見證人1 身分證字號：見證人2 身分證字號：\n日期：西元年月日時間：時分"}, {"code": "899", "title": "磁振導引高強度聚焦超音波(神波刀)治療 骨轉移手術說明暨同意書", "nature": "介入治療／手術", "modality": "神波刀 (MRgFUS)", "body_raw": "骨骼肌肉", "body_group": "骨骼肌肉", "unit": "東址一樓磁振造影室", "campuses": ["東址"], "audience": ["中文一般/成人"], "prep": ["需禁食／空腹", "使用顯影／造影劑", "含麻醉或鎮靜"], "phone": "262540", "rel_path": "pdfs/899_磁振導引高強度聚焦超音波(神波刀)治療 骨轉移手術說明暨同意書.pdf", "pdf_url": "https://www.ntuh.gov.tw/ckfinder_file/OPD/files/DOCEMENT/inst899.pdf", "pages": 4, "text": "國立臺灣大學醫學院附設醫院\nNational Taiwan University Hospital\n磁振導引高強度聚焦超音波(神波刀)治療\n骨轉移手術說明暨同意書\n病歷號：\n姓名：\n生日：西元年月日\n請詳細閱讀內容，待醫師向您說明後，再簽署同意書\n第 1 頁\n西元2023 年12 月15 日病歷委員會修正通過電子病歷版本 MR 19-1038\n西元2022 年11 月28 日品質暨病人安全委員會審核通過\n文件編號\n01400-4-602791\n版次\n02 \n磁振導引高強度聚焦超音波(神波刀)治療骨轉移手術說明書\n編號:899\n這份說明書是有關您即將接受的手術的效益、風險及替代方案的書面說明，可做為您與醫師討\n論時的補充資料，更重要的是我們希望您能充分瞭解資料的內容，所以請仔細閱讀，如果經醫\n師說明後您還有對這個手術的任何疑問，請在簽名前再與您的醫師充分討論，醫師會很樂意為\n您解答，讓我們一起為了您的健康努力。\n適應症及作法：（簡述）\n高強度聚焦超音波(HIFU, High-intensity focused ultrasound)又稱神波刀，以非侵入性(免開刀)無\n創治療方式治療骨轉移，利用磁振導航(MRI-guided)系統，精確定位轉移性骨腫瘤及受侵犯的\n感覺神經，且能監測溫度的變化，搭配非侵入性超音波聚焦技術，將超音波集中在骨頭疼痛處\n的區域內，加熱至60℃以上，以熱消融破壞骨頭表面引發疼痛的神經和目標腫瘤，同時達到疼\n痛緩解與局部腫瘤控制的目的，兼顧癌症疼痛控制與治療兩個面向。\n適應症：癌症骨轉移疼痛病人。\n作法：\n1.首先，進入磁振造影室後會採集一系列的磁振造影影像，以進行精準定位並規劃治療方式。\n2.治療過程不需全身麻醉，但需使用鎮靜鎮痛類麻醉藥物，以減緩治療中的不舒服症狀。但鎮\n靜鎮痛藥可能出現藥物不良反應及麻醉相關的風險，例如:頭暈、噁心、嘔吐及呼吸抑制等，通\n常經由適當的治療及休息會獲得緩解。\n3.開始治療後，為了確保手術的安全性，會先由低能量開始治療，再逐漸增強聚焦超音波之能\n量；醫師會在現場即時觀察影像上之溫度及組織形變並配合您的臨床表徵，決定並調整適合您\n的能量強度與間隔時間，整個療程大約需要1-2 個小時。\n4.在接受較高能量的治療時，可能會有些許疼痛，如果您在術中感到不適或疼痛，可以隨時按\n下手中的按鈕，此時您的醫療團隊會即時協助處理您的症狀後再評估是否繼續治療。\n手術前後需注意事項：\n1.術前四小時需絕對禁食同時停用糖尿病藥物，但其它必要的藥物：如抗高血壓、抗氣喘、抗\n癲癇……等必須藥物，請依照醫師指示服用。\n2.須有家屬陪伴且填妥同意書。\n3.治療結束後，預期您會返回一般病房，觀察病情並等待恢復。\n效益：\n由於神波刀是非侵入性治療，不必推延化療治療，保證化療的劑量強度，並可減少腫瘤醫源性\n散播和種植的機會，保持骨原有的型態和連續性。對殘留病灶或局部復發者亦能進行重複治\n療。神波刀可同時對原發病灶，跳躍病灶和（或）其他部位的骨轉移灶進行治療。治療結束後\n大約三天可明顯感受到疼痛的情況逐漸緩解。\n風險：\n（經由手術，您極可能獲得以下所列的效益，但醫師並不能保證您獲得任何一項，且手術效益\n與風險性間的取捨，應由您決定。）\n只有少數的病人可能因磁振導航熱治療引起危險及副作用，不過這些情況在治療過程中即可發\n現，且立即處理。以下所列的風險已被認定，但是仍然可能有一些醫師無法預期的風險未被列\n國立臺灣大學醫學院附設醫院\nNational Taiwan University Hospital\n磁振導引高強度聚焦超音波(神波刀)治療\n骨轉移手術說明暨同意書\n病歷號：\n姓名：\n生日：西元年月日\n請詳細閱讀內容，待醫師向您說明後，再簽署同意書\n第 2 頁\n西元2023 年12 月15 日病歷委員會修正通過電子病歷版本 MR 19-1038\n西元2022 年11 月28 日品質暨病人安全委員會審核通過\n文件編號\n01400-4-602791\n版次\n02 \n出:\n(1)治療過程中定位或加熱引起之疼痛\n(2)皮膚燒傷：在治療中會將超音波探頭和皮膚之間的間隙用水袋填充以預防皮膚燒傷的風險。\n(3)其他罕見風險包含次發性骨折、鄰近組織壞死、鄰近關節功能受損、神經損傷造成之神經\n麻木及腿部深層靜脈血栓。\n(4)對顯影劑或止痛藥物過敏者，須先與主治醫師討論。\n替代方案：\n（這個手術的替代方案如下，如果您決定不接受此手術，其對病情演變的影響，請與您的主治\n醫師討論您的決定。）\n癌症疼痛的治療可分為兩個方向：\n(1)針對疾病本身，使用化學/放射治療或外科手術等處置達到腫瘤控制的效果。\n(2)針對疼痛發生，利用止痛/鎮靜藥物或神經手術等治療方式來達到疼痛緩解的效果。\n醫師充說明/病人提出之疑問及解釋：（如無，請填寫無）\n目前以磁振導引神波刀治療骨轉移未納入健保給付，檢查與治療儀器、相關耗材以及技術費用，\n將完全依照衛生局核可通過之自費項目。詳情請參閱全民健康保險病人使用自費醫材說明書。\n說明醫師：（簽章）\n日期：西元年月日時間：時分\n磁振導引高強度聚焦超音波(神波刀)治療骨轉移手術同意書\n病人：，出生於西元年月日，需接受磁振導引高強度聚\n焦超音波治療骨轉移手術。立同意書人已經與醫師討論過接受這個醫療處置的效益、風險、及\n替代方案，對醫師的說明都已充分了解且同意由貴院施行本項醫療處置。\n立同意書人姓名：（簽章）\n身分證字號/居留證或護照號碼：\n與病人之關係（請圈選）：本人、配偶、父、母、兒、女、其他：_________\n住址：\n電話：\n日期：西元年月日時間：時分\n國立臺灣大學醫學院附設醫院\nNational Taiwan University Hospital\n磁振導引高強度聚焦超音波(神波刀)治療\n骨轉移手術說明暨同意書\n病歷號：\n姓名：\n生日：西元年月日\n請詳細閱讀內容，待醫師向您說明後，再簽署同意書\n第 3 頁\n西元2023 年12 月15 日病歷委員會修正通過電子病歷版本 MR 19-1038\n西元2022 年11 月28 日品質暨病人安全委員會審核通過\n文件編號\n01400-4-602791\n版次\n02 \n(1.如由病人、親屬或關係人簽署本同意書，則無需見證，見證人部分得免填。2.若意識清楚，但無法親自簽具者\n且無親屬或關係人在場，得以按指印代替簽名，惟應有二名見證人。3.若病人意識不清且無親屬或關係人在場，\n醫療緊急情況得由二名合格醫師在病歷上證明需檢查或治療即可。)\n見證人1：（簽章）見證人2：（簽章）\n見證人1 身分證字號：見證人2 身分證字號：\n日期：西元年月日時間：時分\n磁振導引高強度聚焦超音波(神波刀)治療骨轉移手術\n東\n址\n1F"}, {"code": "901", "title": "影像導引微創介入診療說明暨同意書", "nature": "介入治療／手術", "modality": "消融冷凍與微創介入", "body_raw": "其他", "body_group": "其他", "unit": "影像醫學部", "campuses": ["未指明特定大樓"], "audience": ["中文一般/成人"], "prep": ["使用顯影／造影劑"], "phone": "253834", "rel_path": "pdfs/901_影像導引微創介入診療說明暨同意書.pdf", "pdf_url": "https://www.ntuh.gov.tw/ckfinder_file/OPD/files/DOCEMENT/inst901.pdf", "pages": 2, "text": "國立臺灣大學醫學院附設醫院\nNational Taiwan University Hospital\n影像導引微創介入診療\n說明暨同意書\n西元2023 年06 月19 日病歷委員會審核通過 MR 19-1080\n西元2023 年05 月31 日品質暨病人安全委員審核通過\n文件編號\n01400-4-602839\n版次\n01 \n病歷號：\n姓名：\n生日：西元年月日\n第 1 頁\n編號：901 影像導引微創介入診療說明書\n這份說明書是有關您即將接受的介入診療處置的效益、風險及替代方案的書面說\n明，可做為您與醫師討論時的補充資料。最重要的是我們希望您能充分瞭解資料的內\n容，所以請仔細閱讀；如果經醫師說明後您還有對這個介入診療處置的任何疑問，請在\n簽名前再與您的醫師充分討論，醫師會很樂意為您解答，讓我們一起為了您的健康努力。\n一、醫療處置之適應症及作法：\n1.適應症：\n2.使用影像導引方式為：□超音波 □電腦斷層 □磁振造影 □即時X 光透視\n□其他：\n3.進行之影像導引微創介入診療：□射頻燒灼術 □微波消融術 □冷凍治療術 □栓塞\n□切片 □導管置換 □其他：\n二、醫療處置之效益：\n因應適應症之不同，接受此醫療處置可幫助病人之處置效益為:\n□腫瘤控制\n□感染控制\n□疼痛控制\n□其他：\n補充本醫療處置成功之可能性機率:\n三、醫療處置之風險：\n本處置之風險為\n□顯影劑過敏反應\n□傷口之出血及感染\n□鄰近器官及血管神經傷害\n□其他：\n補充本醫療處置之風險實證相關機率:\n四、替代方案：\n若不執行本檢查，其他的替代選擇包含:外科治療。\n補充其他替代方案：\n國立臺灣大學醫學院附設醫院\nNational Taiwan University Hospital\n影像導引微創介入診療\n說明暨同意書\n西元2023 年06 月19 日病歷委員會審核通過 MR 19-1080\n西元2023 年05 月31 日品質暨病人安全委員審核通過\n文件編號\n01400-4-602839\n版次\n01 \n病歷號：\n姓名：\n生日：西元年月日\n第 2 頁\n(影像導引微創介入診療說明書承上頁)\n五、醫師補充說明/病人提出之疑問及解釋：（如無，請填寫無）\n1.您因________ ____(疾病名稱)，於________ 部位進行影像導引微創介入診療術。\n2.我已經盡量以病人所能了解之方式解釋相關資訊，特別是下列事項：\n□ 須實施介入診療之原因、步驟與範圍、風險及成功率、輸血之可能性。\n□ 併發症及可能處理方式。\n□ 不實施介入診療可能之後果及其他可替之治療方式\n□ 預期介入診療後，可能出現之暫時或永久症狀。\n□ 其他與介入診療相關說明資料，已交付病人。\n3.補充說明：（如無，請填寫無）\n介入診療負責醫師：（簽章）\n日期：西元年月日\n影像導引微創介入診療同意書\n病人：，出生於西元年月日，因患，\n需接受。立同意書人已經與醫師討論過接受這個介入診療處置的效益、\n風險及替代方案，對醫師的說明都已充分了解且同意由貴院施行該項介入診療處置。\n立同意書人：（簽章）身分證字號：\n與病人之關係（請圈選）：本人、配偶、父、母、兒、女、其他：_________\n住址：電話：\n日期：西元年月日\n-----------------------------------------------------------------------------------------------------------------------\n(1.如由病人、親屬或關係人簽署本同意書，則無需見證，見證人部分得免填。2.若意識清楚，但無法親自簽具者\n且無親屬或關係人在場，得以按指印代替簽名，惟應有二名見證人。3.若病人意識不清且無親屬或關係人在場，\n醫療緊急情況得由2 名合格醫師在病歷上證明需檢查或治療即可。)\n見證人1：（簽章）見證人2：（簽章）\n見證人1 身分證字號：見證人2 身分證字號：\n日期：西元年月日"}, {"code": "921", "title": "含碘離子顯影劑滲漏照護注意事項說明書", "nature": "照護須知／切結書", "modality": "照護須知與切結書", "body_raw": "全身", "body_group": "全身", "unit": "影像醫學部各電腦斷層室", "campuses": ["未指明特定大樓"], "audience": ["中文一般/成人"], "prep": [], "phone": "265136、270322", "rel_path": "pdfs/921_含碘離子顯影劑滲漏照護注意事項說明書.pdf", "pdf_url": "https://www.ntuh.gov.tw/ckfinder_file/OPD/files/DOCEMENT/inst921.pdf", "pages": 1, "text": "921 號說明書\n台大醫院含碘離子顯影劑滲漏照護注意事項說明書\n檢查\n地點\n影像醫學部各電腦斷層室\n聯絡\n電話\n262299\n265590\n一般注意事項\n一、含碘離子顯影劑為水溶性，通常發生滲漏後能自行吸收。但因藥物滲透壓較高，可能導致滲\n漏部位發生灼熱、腫脹、疼痛、發麻感。敬請遵照下列注意事項，以減少進一步傷害發生：\n1.傷口局部冷敷，每次15-20 分鐘、每日3-4 次，通常在2-3 日內恢復。\n2.抬高患部高於心臟，可降低微血管壓力，助外滲藥物吸收消腫。\n3.患部勿泡水或塗酒精、優碘。\n二、但若有以下反應時，請來電由醫師評估是否返回本部或需進一步之處置(如照會整形外科)：\n1.局部疼痛感隨著時間增加而非減輕。\n2.注射部位有水泡、脫皮、潰瘍或變黑。\n3.肢體末梢有麻木、刺痛感或冰冷的感覺。\n24 小時諮詢專線：23123456 轉262299、265590。\n資料來源\n影像醫學部\n說明書製定日期\n112 年03 月09 日"}, {"code": "929", "title": "術中磁振掃描攝影檢查說明暨同意書", "nature": "診斷檢查", "modality": "MRI 磁振造影", "body_raw": "其他", "body_group": "其他", "unit": "東址四樓磁振造影室", "campuses": ["東址"], "audience": ["中文一般/成人"], "prep": ["需禁食／空腹", "使用顯影／造影劑", "含麻醉或鎮靜"], "phone": "261269", "rel_path": "pdfs/929_術中磁振掃描攝影檢查說明暨同意書.pdf", "pdf_url": "https://www.ntuh.gov.tw/ckfinder_file/OPD/files/DOCEMENT/inst929.pdf", "pages": 3, "text": "術後接受一般的腦部磁振造影檢查，若發現仍有未切除腫瘤/病灶，為求完全切除再\n如病情需要，須注射含釓（Gadolinium）之造影劑以利病灶之顯見。此造影劑為水溶\n性不含碘，因本身體質特異而對此造影劑產生不良反應如蕁麻疹、嘔吐、抽筋、頭\n痛、噁心等其機率約為萬分之二（二百萬人次之統計），僅有極少數案例因藥物過敏\n或腎源性系統性纖維化/腎源性纖維性皮膚病變（Nephrogenic systemic fibrosis ,\nNSF）而致死。哺乳期婦女接受含釓（Gadolinium）之造影劑之後哺乳，乳汁中將暫時\n含有釓，但不會被腸道吸收，一般建議可持續哺乳，若您有疑慮，可於施打造顯劑24\n小時後再進行哺乳。\n協助引導神經外科醫師評估腫瘤/病灶是否已切除乾淨，可降低因腫瘤或病灶因肉眼觀\n察下不易與正常腦組織分別導致切除不完全，而需二次手術之可能性。\n適應症：經臨床醫師評估，認為需要接受術中影像學檢查之病人。\n作法：\n＊於手術中，腫瘤/病灶切除後將病人移至開刀房內之磁振造影室接受檢查，有可能\n會施打造影劑。現場將有神經放射專科醫師即時判讀影像，並告知神經外科醫師是否\n還有尚未切除乾淨的腫瘤/病灶。\n※ 特殊注意事項：\n一、檢查當天：\n1.為配合全身麻醉手術，於手術當日需禁食，藥物請依照醫師指示服用。。\n2.請勿使用化妝品及髮油等造型裝飾品、以避免檢查過程中出現皮膚不適及干擾影\n像。\n3.金屬飾物（如：髮飾、髮夾），磁性物質（如：金融卡、磁碟片）請勿攜入檢查\n室。\n4.做過心臟或血管手術，裝有心律調節器，動脈瘤金屬夾，氣切造口金屬管，或體\n內裝置骨釘或金屬鋼片…等體內有金屬植入物之患者，應於術前告知臨床醫師。\n5.曾對造影劑發生過敏或不良反應、中度至末期腎臟病人、拒絕接受造影劑注射之\n患者，應術前先告知臨床醫師。\n6.請填妥「術中磁振造影同意書」並交給臨床醫護人員。\n二、因檢查需要，可能須注射含釓（Gadolinium）之造影劑以利病灶之顯見，醫護人\n員會先從已置放的靜脈軟針以生理食鹽水注射，以檢查注射血管之通暢性，但仍有少\n數病人，會於開始施打造影劑後，產生造影劑滲漏至皮下組織或肌肉（機率\n約0.7%），而致產生局部紅腫、疼痛之現象；皮下腫痛會在數日後隨造影劑吸收而慢\n慢消失，但亦有少數人出現嚴重發炎、潰瘍、及局部神經壓迫反應，而需接受住院觀\n察、外科處置或植皮。\n適應症及作法：（簡述）\n效益：\n風險：\n替代方案：\n編號：929\n術中磁振造影檢查說明書\n西元2025年04月08日病歷委員會修正通過電子病歷版本 MR 19-1079\n西元2025年03月19日品質暨病人安全委員會審核通過\n版次\n01400-4-602838\n4\n文件編號\nNational Taiwan University Hospital\n國立臺灣大學醫學院附設醫院\n術中磁振造影檢查說明暨同意書\n第1頁\n請詳細閱讀內容，待醫師向您說明後，再簽署同意書\n病歷號:\n姓名:\n生日:\n次開刀。\n醫師補充說明/病人提出之疑問及解釋:(如無，請填寫無)\n西元2025年04月08日病歷委員會修正通過電子病歷版本 MR 19-1079\n西元2025年03月19日品質暨病人安全委員會審核通過\n版次\n01400-4-602838\n4\n文件編號\nNational Taiwan University Hospital\n國立臺灣大學醫學院附設醫院\n術中磁振造影檢查說明暨同意書\n第2頁\n請詳細閱讀內容，待醫師向您說明後，再簽署同意書\n病歷號:\n姓名:\n生日:\n請逐項檢查自己身上物品，如果不確定身上有無下列物品、或其他未列出的人工物\n品，請詢問檢查室人員。\n□無體內裝置人工物件。\n□有下列不可去除之體內裝置人工物件：\n□心律調節器/調節器導線(要事先與廠商聯絡，當天可能需要設定體內裝置)\n□植入式神經刺激器或導線(要事先與廠商聯絡，當天可能需要設定體內裝置)\n□顱內動脈瘤血管夾\n□動脈止血夾\n□人工電子耳\n□電極\n□其他：\n術中磁振造影檢查同意書\n病人: ，出生於西元年月日，需接受術中磁振掃描攝\n影檢查。立同意書人已經與醫師討論過接受這個檢查的效益、風險及替代方案，對\n醫師的說明都已充分了解且同意由貴院施行該檢查。\n我充分明瞭在磁振造影檢查室內嚴禁任何金屬或磁性物質\n說明醫師:\n日期:西元年月日時間: 時分\n(1.如由病人、親屬或關係人簽署本同意書，則無需見證，見證人部分得免填。2.若意識清楚，但無法親自簽具者且\n無親屬或關係人在場，得以按指印代替簽名，惟應有二名見證人。3.若病人意識不清且無親屬或關係人在場，醫療\n緊急情況得由二名合格醫師在病歷上證明需檢查或治療即可。)\n見證人1：     （簽章）見證人2：     （簽章）\n見證人1身分證字號：  見證人2身分證字號：\n日期：西元年月日時間：時分\n立同意書人姓名: (簽章)\n身分證字號/居留證或護照號碼：\n與病人之關係（請圈選）：本人、配偶、父、母、兒、女、其他：_________\n住址：\n電話：\n日期:西元年月日時間: 時分\n西元2025年04月08日病歷委員會修正通過電子病歷版本 MR 19-1079\n西元2025年03月19日品質暨病人安全委員會審核通過\n版次\n01400-4-602838\n4\n文件編號\nNational Taiwan University Hospital\n國立臺灣大學醫學院附設醫院\n術中磁振造影檢查說明暨同意書\n第3頁\n請詳細閱讀內容，待醫師向您說明後，再簽署同意書\n病歷號:\n姓名:\n生日:"}, {"code": "930", "title": "微細動脈栓塞止痛術說明暨同意書", "nature": "介入治療／手術", "modality": "血管攝影與栓塞", "body_raw": "其他", "body_group": "其他", "unit": "東址一樓介入診療室", "campuses": ["東址"], "audience": ["中文一般/成人"], "prep": ["需禁食／空腹", "使用顯影／造影劑", "需驗腎功能 (Cre)", "含麻醉或鎮靜"], "phone": "262608", "rel_path": "pdfs/930_微細動脈栓塞止痛術說明暨同意書.pdf", "pdf_url": "https://www.ntuh.gov.tw/ckfinder_file/OPD/files/DOCEMENT/inst930.pdf", "pages": 3, "text": "國立臺灣大學醫學院附設醫院\nNational Taiwan University Hospital\n微細動脈栓塞止痛術說明暨同意書\n請詳細閱讀內容，待醫師向您說明後，再簽署同意書第 1 頁\n西元2023 年12 月15 日病歷委員會修正通過電子病歷版本 MR 19-1081\n西元2023 年06 月03 日品質暨病人安全委員會審核通過\n文件編號\n01400-4-602840\n版次\n02 \n病歷號：\n姓名：\n生日：西元年月日\n微細動脈栓塞止痛術說明書\n這份說明書是有關您即將接受的手術或醫療處置的效益、風險及替代方案的書面說明，可做\n為您與醫師討論時的補充資料。最重要的是我們希望您能充分瞭解資料的內容，所以請仔細\n閱讀；如果經醫師說明後您還有對這個手術或醫療處置的任何疑問，請在簽名前再與您的醫\n師充分討論，醫師會很樂意為您解答，讓我們一起為了您的健康努力。\n適應症及作法：（簡述）\n微細動脈栓塞止痛術(TAME, Trans-Arterial Micro-Embolization)，適用於四肢、胸腹部及骨\n盆腔等關節疼痛患者。血管異常新生與不正常血管重新分布與發炎反應關聯密切，可能是\n造成關節疼痛的原因之一。透過血管內治療技術，醫師可將微細導管和器械通過微創手術\n進入異常血管新生的血管分支，並在該位置注入止痛栓塞治療藥物。\n術前準備：術前需空腹四小時以上，可以服用必要之藥物，換上檢查服裝，並請家屬在檢\n查期間陪同前往。術前將進行必要的血液檢查和相關處置。\nA.步驟：\n1.在仔細消毒並舖上綠色消毒布單後，請您保持雙手在布單之下以維持無菌操作空間；同時\n放射師及護理師也會與您溝通檢查時的配合事項。接著由影像醫學部醫師為您進行檢查及\n治療，在預定的穿刺部位施打皮下麻醉，進行血管穿刺後，放置血管鞘並置入微細導管到\n達預定之微細動脈。檢查過程中若有任何不適，請口頭告知醫師，切勿任意移動身體或擺\n動四肢以免發生危險。\n2.醫師將在X 光的透視下，進行血管攝影並將微細導管放置預定位置。攝影過程中，將注射\n顯影劑，此時若有身上灼熱感或是口中異味，乃正常現象。\n3.經醫師影像評估後進行栓塞治療，過程中請勿移動，若感不適請立即跟醫師反應；治療結\n束後移除血管鞘，進行床邊加壓止血，完成止血後，依照醫師指示使用繃帶加壓觀察兩到\n四小時，確定傷口無出血與無其他不適症狀後，始可離院返家。\nB.注意事項：\n1.微細動脈栓塞止痛術所使用之栓塞物質分為兩大類:\ni.抗生素(Imipenem/Cilastatin)，經動脈途徑使用於肢體疼痛栓塞治療，特別提示為仿單核准\n適應症外的使用(Off-label use)。抗生素為暫時性栓塞物質，可減少異常增生血管之血流，\n以達到減少疼痛之目標。\nii.微球粒栓塞物(Particles)，經動脈途徑使用於肢體疼痛栓塞治療，微球粒栓塞物依照材質\n特性可能為暫時性或永久性栓塞物質，可減少異常增生血管之血流，以達到減少疼痛之目\n標。\n2.施打顯影劑可能造成不同程度之藥物不良反應，例如皮膚疹、呼吸困難、支氣管攣縮、休\n克等。建議施打前禁食四小時以上以防嘔吐造成吸入性肺炎。\n3.腎功能不良之病人（血清肌酸酐Creatinine 大於等於2.0mg/dL）施打顯影劑將增加暫時或\n終身洗腎之風險。\n4.甲雙胍類降血糖藥物（例如Metformin），同時施打顯影劑將增加乳酸中毒的機率，建議注\n射前停用至少48 小時。\n5.患有甲狀腺疾病、重症肌無力或嗜鉻細胞瘤等疾病，請告知臨床醫師。\n編號：930\n國立臺灣大學醫學院附設醫院\nNational Taiwan University Hospital\n微細動脈栓塞止痛術說明暨同意書\n請詳細閱讀內容，待醫師向您說明後，再簽署同意書第 2 頁\n西元2023 年12 月15 日病歷委員會修正通過電子病歷版本 MR 19-1081\n西元2023 年06 月03 日品質暨病人安全委員會審核通過\n文件編號\n01400-4-602840\n版次\n02 \n病歷號：\n姓名：\n生日：西元年月日\n6.本檢查之游離輻射可能影響胎兒，可能懷孕之婦女請告知臨床醫師。哺乳期婦女施打含碘\n顯影劑後，仍可繼續哺乳。\n效益：（您可能獲得以下所列的效益，但醫師並不能保證您獲得任何一項；且手術效益與風\n險性間的取捨，應由您決定。）\n經過醫師的評估和說明，微細動脈栓塞止痛治療被建議用於本次檢查與治療。根據文獻\n資料，微細動脈栓塞止痛的療效預期，在短期內對約一半以上至八成的患者有所改善，但實\n際成功率可能因個人病情不同而有所差異，後續亦可能需要進行反覆治療，以達到更明顯的\n效果或再次控制症狀。\n風險：（沒有任何手術或醫療處置是完全沒有風險的，以下所列的風險已被認定，但是仍然可\n能有一些醫師無法預期的風險未列出。）\n微細動脈栓塞止痛術可能導致的併發症可分為：\n一、與血管損傷及穿刺有關之併發症－包含穿刺處的疼痛或不適感，程度不一的出血（局部\n輕微血腫 >5%、嚴重血腫 <0.5%），對於血管的損傷（動靜脈管 0.05%、動脈瘤 0.01%、\n血管阻塞 0.1%），皮膚顏色改變，局部組織或遠端肢體缺血、發炎腫脹、肢體傷口感染、\n潰瘍、硬化而導致功能降低、神經受損、局部血腫產生、血管剝離等。除了這個術式本\n身外，對於止痛局部麻醉藥物不可預期的過敏亦有可能造成死亡。(發生機率為大規模病\n人所做出來的統計值，對每個人而言不一定適用，對個人而言只有發生與沒有發生。）\n二、與導管有關之併發症－導管在血管內操作時，有可能產生小的血栓（尤其是有動脈硬化\n者），血栓卡在非標的血管遠端就會導致器官組織梗塞（包括中風）；其他還有動脈剝離、\n血管痙攣或阻塞等。\n三、與栓塞物質有關之併發症－施打栓塞物質可能造成不同程度之藥物不良反應，例如皮膚\n疹、呼吸困難、支氣管攣縮、休克等。另外，栓塞物質可能漂流至非目標器官或組織，\n造成不等程度的缺血傷害。\n因上述併發症及其後續引發之醫療問題，可能隨時需要進行適當之處置，包括輸血及其他必\n要之藥物治療、心肺復甦術急救、氣管內管插入、手術治療……等等。本院醫療同仁會盡全\n力避免併發症的發生，倘若仍不幸發生意外，亦會適時做出適當的建議，以期病友可以得到\n最佳的治療效果。\n此醫療處置屬侵入性治療，如已簽署「不實施心肺復甦術或維生醫療（DNR）意願書/同意書」\n者，請慎重考慮。\n替代方案：（這個手術或醫療處置的替代方案如下，如果您決定不施行這個手術或醫療處置，\n請與醫師討論您的決定）\n根據疾病的不同可能有其他的處置可以進行，例如生活型態行為改變、保守治療、復健物理\n治療、局部注射與手術治療等，如果您對於本處置有所疑慮，請與您的醫師妥善討論其他方\n式的可行性及相關風險。\n不實施醫療處置可能的後果：因慢性疼痛造成的臨床相關症狀與其併發症。\n國立臺灣大學醫學院附設醫院\nNational Taiwan University Hospital\n微細動脈栓塞止痛術說明暨同意書\n請詳細閱讀內容，待醫師向您說明後，再簽署同意書第 3 頁\n西元2023 年12 月15 日病歷委員會修正通過電子病歷版本 MR 19-1081\n西元2023 年06 月03 日品質暨病人安全委員會審核通過\n文件編號\n01400-4-602840\n版次\n02 \n病歷號：\n姓名：\n生日：西元年月日\n醫師補充說明/病人提出之疑問及解釋：（如無，請填寫無）\n栓塞止痛術所需自費醫材，如止血棉…，將依照電腦計價為主。\n說明醫師：（簽章）\n日期：西元年月日時間：時分\n微細動脈栓塞止痛術同意書\n病人：，出生於西元年月日，因患，\n需接受微細動脈栓塞止痛術。立同意書人已經與醫師討論過接受這個手術或醫療處置的效\n益、風險及替代方案，對醫師的說明都已充分了解且同意由貴院施行該項術式或醫療處置。\n立同意書人姓名：（簽章）\n身分證字號/居留證或護照號碼：\n與病人之關係（請圈選）：本人、配偶、父、母、兒、女、其他：_________\n住址：\n電話：\n日期：西元年月日時間：時分\n(1.如由病人、親屬或關係人簽署本同意書，則無需見證，見證人部分得免填。2.若意識清楚，但無法親自簽具\n者且無親屬或關係人在場，得以按指印代替簽名，惟應有二名見證人。3.若病人意識不清且無親屬或關係人在\n場，醫療緊急情況得由2 名合格醫師在病歷上證明需檢查或治療即可。)\n見證人1：（簽章）見證人2：（簽章）\n見證人1 身分證字號：見證人2 身分證字號：\n日期：西元年月日時間：時分"}, {"code": "980", "title": "國民健康署胸部低劑量電腦斷層檢查說明書", "nature": "診斷檢查", "modality": "CT 電腦斷層", "body_raw": "呼吸(肺)", "body_group": "呼吸(肺)", "unit": "東址一樓電腦斷層掃描室", "campuses": ["東址"], "audience": ["中文一般/成人"], "prep": [], "phone": "266455", "rel_path": "pdfs/980_國民健康署胸部低劑量電腦斷層檢查說明書.pdf", "pdf_url": "https://www.ntuh.gov.tw/ckfinder_file/OPD/files/DOCEMENT/inst980.pdf", "pages": 2, "text": "號號說明書\n國民健康署胸部低劑量電腦斷層檢查說明書\n檢查\n地點\n影像醫學部電腦斷層室(5-7)\n聯絡\n電話\n(02)23123456\n轉 266455\n一般注意事項\n請於約定時間至檢查地點辦理報到候檢，超過所約時間視為放棄。\n如需更改日期或取消，請於預約檢查日之前請聯絡癌症篩檢中心，否則視同放\n棄；更改日期依排程現況辦理。\n本院預約登記後，請勿至其他醫療院所重複登記或檢查。\n欲取消檢查或當日未執行檢查者，請持健保卡至癌篩中心辦理。\n對說明書內容若有疑問，請向癌症篩檢中心洽詢。\n癌症篩檢中心電話：(02)23123456 轉 266455。\n服務時間：週一~週五 8：30~17：00，國定假日依本院公告休診。\n特殊注意事項\n低劑量電腦斷層(LDCT)是經實證可以早期發現肺癌的篩檢工具。\n肺癌篩檢是目前提供的四癌篩檢之外（子宮頸癌、乳癌、口腔癌、大腸癌），依據國際實證及國內\n研究結果，並經專家及相關學會討論訂定的癌症篩檢政策，而推出的第五癌篩檢。\n肺癌篩檢並不能預防肺癌發生，吸菸者應戒菸才能降低肺癌風險。\n服務對象：符合下列任一肺癌風險因子且具健保身分之民眾，國健署提供每2年1次肺部低劑量電\n腦斷層攝影檢查。\n一、具肺癌家族史：45 至74 歲男性或40 至74 歲女性，且其父母、子女或兄弟姊妹經診斷為肺癌\n之民眾。若有吸菸情形，應同意接受戒菸服務。\n二、具重度吸菸史：50 至74 歲吸菸史達20 包-年以上，有意願戒菸（若有吸菸情形，應同意接受\n戒菸服務）或戒菸未達15 年之重度吸菸者。\nLDCT 肺癌篩檢的利益與風險：\n一、利益：降低肺癌的死亡率、發現早期肺癌並增加生活品質、早期診斷其他疾病、LDCT 輻射量\n曝露低於常規的斷層掃描。\n二、風險：過度診斷、因等待診斷結果而產生焦慮情緒、偽陽性的結果、偽陰性的結果、仍會接受\n到低輻射量的曝露。\n資料來源\n影像醫學部\n文件編號\n15100-4-CS0980\n說明書修訂日期\n114 年10 月2 日"}, {"code": "983", "title": "人工智慧胰臟分析檢查說明暨同意書", "nature": "診斷檢查", "modality": "CT 電腦斷層", "body_raw": "消化(腹)", "body_group": "消化系統", "unit": "影像醫學部", "campuses": ["未指明特定大樓"], "audience": ["中文一般/成人"], "prep": [], "phone": "262623", "rel_path": "pdfs/983_人工智慧胰臟分析檢查說明暨同意書.pdf", "pdf_url": "https://www.ntuh.gov.tw/ckfinder_file/OPD/files/DOCEMENT/inst983.pdf", "pages": 2, "text": "國立臺灣大學醫學院附設醫院\nNational Taiwan University Hospital\n人工智慧胰臟分析檢查說明暨同意書\n請詳細閱讀內容，待醫師向您說明後，再簽署同意書第 1 頁\n西元2024 年月日病歷委員會審核通過電子病歷版本 MR 19-1133\n西元2024 年月日品質暨病人安全委員會審核通過\n文件編號\n01400-4-602913\n版次\n1\n\n病歷號：\n姓名：\n生日：西元年月日\n人工智慧胰臟分析檢查說明書\n編號：983\n這份說明書是有關您即將接受的檢查或醫療處置的效益、風險及替代方案的書面說明，\n可做為您與醫師討論時的補充資料。最重要的是我們希望您能充分瞭解資料的內容，所以請\n仔細閱讀；如果經醫師說明後您還有對這個檢查或醫療處置的任何疑問，請在簽名前再與您\n的醫師充分討論，醫師會很樂意為您解答，讓我們一起為了您的健康努力。\n適應症及作法：（簡述）\n本檢查之目的為輔助專業醫事人員分析腹部電腦斷層影像，辨識出疑似患有胰腺癌而需要\n更進一步檢查之病人，同時標示出疑似胰腺癌之位置，提供醫師參考。\n1.適應症：18 歲以上成年人。\n2.作法：\n受檢者有腹部電腦斷層影像，病房或門診醫師開立此醫令通知行政人員。由放射師確認已\n有可供分析之腹部電腦斷層影像，並上傳影像至人工智慧胰腺癌輔助偵測系統，提供給影\n像醫學部醫師判讀影像與撰打綜合報告。\n若尚未有腹部電腦斷層影像，則需接受腹部電腦斷層檢查。\n效益：\n本檢查的優點是能協助專業醫事人員分析腹部電腦斷層影像，辨識出疑似患有胰腺癌而\n需要更進一步檢查之病人，同時標示出疑似胰腺癌之位置，為醫師提供重要的參考資訊。\n本檢查對於胰腺癌的偵測敏感度與特異度達 80 % 以上。全國性資料集測試所得之敏感\n度為 89.9% (95%信賴區間：82.7%-94.9%)，特異度為 95.9% (95%信賴區間：91.3%-98.5%)。\n(Radiology 2023 306:1, 172-182)。\n風險：\n1.影像需由專業醫師評估，決定是否適合交由本產品分析。\n2.本產品的分析結果僅供醫師參考，正式診斷仍需由專業醫師進行。\n3.本產品僅限於影像分析，不可代替完整的病人評估。\n4.本產品僅能偵測胰腺癌，並不包含其他組織類型的胰臟腫瘤如胰臟神經內分泌腫瘤、胰臟\n內副脾或是胰臟周邊器官組織如膽管、壺腹、十二指腸之腫瘤。\n5.如果電腦斷層影像有下列情況者，會使分析結果正確度受影響:\n(1)膽管或胰管有置入支架者。\n(2)無施打顯影劑之電腦斷層影像。\n(3)胰腺癌接受過治療之電腦斷層影像，包含：手術、化學治療、放射治療、免疫治療等。\n(4)影像中之胰臟不完整者（例如:曾接受胰臟切除手術者、攝影時未拍到完整胰臟等等）。\n(5)急性胰臟炎或慢性胰臟炎急性發作導致部分組織壞死或積水，難以確認或排除胰臟癌的\n可能性，建議等待急性期緩解後，再檢查判斷。對於電腦斷層影像上顯現重度慢性胰臟炎\n變化 (如顯著的鈣化、胰管擴張/結石) 之病人。\n(6)肝門靜脈阻塞引發胰臟週邊有明顯之側枝靜脈曲張者。\n國立臺灣大學醫學院附設醫院\nNational Taiwan University Hospital\n人工智慧胰臟分析檢查說明暨同意書\n請詳細閱讀內容，待醫師向您說明後，再簽署同意書第 2 頁\n西元2024 年月日病歷委員會審核通過電子病歷版本 MR 19-1133\n西元2024 年月日品質暨病人安全委員會審核通過\n文件編號\n01400-4-602913\n版次\n1\n\n病歷號：\n姓名：\n生日：西元年月日\n(人工智慧胰臟分析檢查說明書)\n替代方案：\n依病灶之特性不同，尚有其他影像學之替代方案如磁振造影、內視鏡超音波、腹腔鏡手術…\n等檢查，如有疑問，請與您的臨床醫師討論。\n醫師補充說明/病人提出之疑問及解釋：（如無，請填寫無）\n如果您有任何問題，歡迎您提出來和您的主治醫師討論，並且請醫師寫下來供您作參考。\n說明醫師：（簽章）\n日期：西元年月日時間：時分\n人工智慧胰臟分析檢查同意書\n病人：，出生於西元年月日，需接受人工智慧胰臟分析\n檢查。立同意書人已經與醫師討論過接受這個檢查的效益、風險及替代方案，對醫師的說明\n都已充分了解且同意由貴院施行該項檢查，並願意負擔相關費用。\n請您詳細閱讀「風險」所列六種可能會影響分析結果正確性的情況後，勾選以下兩項選項其\n中之一：\n□沒有以上不適合分析之情況。\n□有以上情況，也了解可分析之正確性會受影響，仍同意進行分析。\n若您不確定是否有以上會影響正確性之情況，請與您的醫師確認後，再決定是否進行分析檢\n測。\n立同意書人姓名：（簽章）\n身分證字號/居留證或護照號碼：\n與病人之關係（請圈選）：本人、配偶、父、母、兒、女、其他：_________\n住址：\n電話：\n日期：西元年月日時間：時分\n(1.如由病人、親屬或關係人簽署本同意書，則無需見證，見證人部分得免填。2.若意識清楚，但無法親自簽具\n者且無親屬或關係人在場，得以按指印代替簽名，惟應有二名見證人。3.若病人意識不清且無親屬或關係人在\n場，醫療緊急情況得由2 名合格醫師在病歷上證明需檢查或治療即可。)\n見證人1：（簽章）見證人2：（簽章）\n見證人1 身分證字號：見證人2 身分證字號：\n日期：西元年月日時間：時分"}, {"code": "998", "title": "孕齡婦女X光檢查同意切結書", "nature": "照護須知／切結書", "modality": "照護須知與切結書", "body_raw": "全身", "body_group": "全身", "unit": "影像醫學部", "campuses": ["未指明特定大樓"], "audience": ["中文一般/成人"], "prep": [], "phone": "262623", "rel_path": "pdfs/998_孕齡婦女X光檢查同意切結書.pdf", "pdf_url": "https://www.ntuh.gov.tw/ckfinder_file/OPD/files/DOCEMENT/inst998.pdf", "pages": 1, "text": "國立臺灣大學醫學院附設醫院\nNational Taiwan University Hospital\n孕齡婦女X 光檢查同意切結書\n孕齡婦女X 光檢查同意切結書\n編號:998\n□ 本人目前無懷孕的可能性，本人願意接受X 光或影像醫學檢查，並承擔可能\n有未知的已懷孕狀態之風險。\n□ 本人目前已知懷孕，但因有危及生命或其他特殊情境，願意承擔輻射風險接受\nX 光或影像醫學檢查。\n立同意書人姓名：（簽章）\n身分證字號/居留證或護照號碼：\n與病人之關係（請圈選）：本人、配偶、父、母、兒、女、其他：_________\n住址：\n電話：\n日期：西元年月日時間：時分\n(1.如由病人、親屬或關係人簽署本同意書，則無需見證，見證人部分得免填。2.若意識清楚，但無法親自簽具者\n且無親屬或關係人在場，得以按指印代替簽名，惟應有二名見證人。3.若病人意識不清且無親屬或關係人在場，\n醫療緊急情況得由二名合格醫師在病歷上證明需檢查或治療即可。)\n見證人1：（簽章）見證人2：（簽章）\n見證人1 身分證字號：見證人2 身分證字號：\n日期：西元年月日時間：時分\n第 1 頁\n病歷號：\n姓名：\n生日：西元年月日\n文件編號\n01400-4-602959\n版次\n01 \n西元2024年05月09 日病歷委員會審核通過電子病歷版本 MR 19-1174\n西元2024年05月01 日品質暨病人安全委員會審核通過"}, {"code": "1000", "title": "影像導引經皮微創穿肝膽道取石術說明暨同意書", "nature": "介入治療／手術", "modality": "消融冷凍與微創介入", "body_raw": "消化(肝)", "body_group": "消化系統", "unit": "東址一樓介入診療室", "campuses": ["東址"], "audience": ["中文一般/成人"], "prep": ["需禁食／空腹", "使用顯影／造影劑", "含麻醉或鎮靜"], "phone": "262608", "rel_path": "pdfs/1000_影像導引經皮微創穿肝膽道取石術說明暨同意書.pdf", "pdf_url": "https://www.ntuh.gov.tw/ckfinder_file/OPD/files/DOCEMENT/inst1000.pdf", "pages": 2, "text": "國立臺灣大學醫學院附設醫院\nNational Taiwan University Hospital\n影像導引經皮微創穿肝膽道取石術說明暨同意書\n請詳細閱讀內容，待醫師向您說明後，再簽署同意書\n第 1 頁\n西元2024年06月25 日病歷委員會審核通過電子病歷版本 MR 19-1181\n西元2024年06月04 日品質暨病人安全委員會審核通過\n文件編號\n01400-4-602970\n版次\n1 \n病歷號：\n姓名：\n生日：西元\n年月日\n影像導引經皮微創穿肝膽道取石術說明書\n編號：1000\n這份說明書是有關您即將接受的手術或醫療處置的效益、風險及替代方案的書面說明，可\n做為您與醫師討論時的補充資料。最重要的是我們希望您能充分瞭解資料的內容，所以請仔細\n閱讀；如果經醫師說明後您還有對這個手術或醫療處置的任何疑問，請在簽名前再與您的醫師\n充分討論，醫師會很樂意為您解答，讓我們一起為了您的健康努力。\n適應症及作法：（簡述）\n膽結石因各種不同的原因無法經由正常的排泄路徑排到腸道中，如果卡在膽道中，導致膽汁淤\n積進而產生黃疸、肝功能受損以及膽道相關的感染，最後有可能危及生命，因此需要以各種方\n式進行取石，以建立膽汁引流的通暢。影像導引經皮微創穿肝膽道取石術是其中的一個方式，\n此處置會將微創導管穿過皮膚放入膽道系統內進行取石。\n術前準備：除了少量的水及必要的藥物以外，必須禁食四個小時以上。由於阻塞的膽汁有很高\n的比例是伴隨細菌感染，為了減低感染的可能性，必須術前先給予抗生素。若有大量的腹水及\n凝血功能異常，則需要能夠事先矯正，否則有極高的手術危險。\n步驟：您需要平躺在檢查台上，並將右手放至頭上，當時間較久可能會造成您的不適，但仍需\n要您的配合。腹部皮膚會消毒然後覆蓋消毒的布巾。首先會經由肌肉或靜脈給予止痛劑及在皮\n下注射局部麻醉劑，接著會在Ｘ光透視下或超音波引導下以細針穿刺膽道，然後注射Ｘ光顯影\n劑來確定細針的位置。為了穿刺到適合位置，此步驟可能會重複數次，接著會嘗試經由細針放\n入導引線，當導引線可以順利的沿著膽管進入，就會將細針置換成微創導管，同時會注入更多\n顯影劑以看清楚膽管結構以及結石位置。確認清楚後會進行取石，取石後亦會注射顯影劑進行\n膽道攝影確認取石效果，並視情況放置引流管，將引流管固定在皮膚表面並接上引流袋完成整\n個處置。若是引流管擺置後功能不佳或是有出血等併發症，可能會立刻重新調整或放置。通常\n整個步驟需時20-30 分鐘，但少數困難的情況可能花費兩個小時以上，需要您全程配合。\n效益：（經由手術，您可能獲得以下所列的效益，但醫師並不能保證您獲得任何一項；且手術\n效益與風險性間的取捨，應由您決定。）\n本經皮微創穿肝膽道取石術，可以將內視鏡取石困難的結石由經皮路徑取出使原本無法順利排\n入腸道的膽汁恢復暢通，讓黃膽減輕且控制因膽汁淤積而造成的感染現象。某些造成膽汁淤積\n的原因，可以利用建立好的引流管路線進行處置，包括氣球擴張術及支架置放(請參考經皮穿\n肝膽道氣球擴張術及支架放置說明書)，但不是所有原因都適合。根據原因及可進行的處置不\n同，引流管留置的時間不定，甚至需永久留置。需長期留置的情況，醫護人員將會教導您如何\n照護引流管。\n手術/醫療處置成功率：\n據文獻統計此處置成功率平均為九成以上，但實際成功率則因個體膽道擴張程度及膽道阻塞原\n因不同而有所差異，如有疑議，請與醫師討論。\n風險：（沒有任何手術或醫療處置是完全沒有風險的，以下所列的風險已被認定，但是仍然可\n能有一些醫師無法預期的風險未列出。）\n與此項處置相關的風險包含過程中及術後的疼痛、顯影劑引起的不良反應及類過敏現象(包含\n腎功能損害、噁心、嘔吐、皮膚紅疹、呼吸困難、休克甚至死亡)、出血(包括內出血、膽道出\n血)(3-7%)、敗血症(3-5%)、膽管破裂或膽汁沿引流管滲漏造成腹膜炎(15-20%)、引流管脫落\n(10-20%)、肋膜穿刺引起肋膜積水或氣胸(1-5%)、其他內臟的穿刺引起的出血或破裂(<1%)。\n國立臺灣大學醫學院附設醫院\nNational Taiwan University Hospital\n影像導引經皮微創穿肝膽道取石術說明暨同意書\n請詳細閱讀內容，待醫師向您說明後，再簽署同意書第 2 頁\n西元2024年06月25 日病歷委員會審核通過電子病歷版本 MR 19-1181\n西元2024年06月04 日品質暨病人安全委員會審核通過\n病歷號：\n姓名：\n生日：西元年月日\n文件編號\n01400-4-602970\n版次\n1\n\n(影像導引經皮微創穿肝膽道取石術說明書承上頁)\n有些併發症可能會需要其他的緊急處置，包括輸血、藥物及抗生素治療、心肺復甦術、胸管\n放置、引流管重新放置、其他的放射線治療、內視鏡治療或者開刀，嚴重的併發症可能會造\n成死亡(0.7-8%)。由於造成膽管阻塞的原因不同、膽管結構複雜度以及疾病本身的進行，有的\n患者可能會需要多次的引流管調整或多條引流管的放置；即使如此仍然有部分患者無法藉由\n引流來改善黃疸症狀。\n替代方案：（這個手術或醫療處置的替代方案如下，如果您決定不施行這個手術或醫療處置，\n可能會有危險，請與醫師討論您的決定）\n根據疾病的不同，可能有其他的處置可以進行，包括內視鏡逆行性取石或開刀，然而並非一\n定可行。如果您對於本處置有所疑慮，請與您的醫師妥善討論其他方式的可行性及相關風險。\n不實施醫療處置可能的後果：因膽汁淤積所造成之相關併發症。\n醫師補充說明/病人提出之疑問及解釋：（如無，請填寫無）\n目前本處置未納入健保給付，依照衛生局核可通過之自費項目，檢查與治療儀器、相關耗材\n以及技術費用約為一萬四千元，實際費用依系統顯示為主，將完全依照衛生局核可通過之自\n費項目。詳情請參閱全民健康保險病人使用自費醫療說明書。\n說明醫師：（簽章）\n日期：西元年月日時間：時分\n影像導引經皮微創穿肝膽道取石術同意書\n病人：，出生於西元年月日，因患_____________需接受\n影像導引經皮微創穿肝膽道取石術說明暨同意書。立同意書人已經與醫師討論過接受這個手\n術或醫療處置的效益、風險、替代方案及自費費用，對醫師的說明都已充分了解且同意由貴\n院施行該項術式或醫療處置。\n立同意書人姓名：（簽章）\n身分證字號/居留證或護照號碼：\n與病人之關係（請圈選）：本人、配偶、父、母、兒、女、其他：_________\n住址：\n電話：\n日期：西元年月日時間：時分\n(1.如由病人、親屬或關係人簽署本同意書，則無需見證，見證人部分得免填。2.若意識清楚，但無法親自簽具\n者且無親屬或關係人在場，得以按指印代替簽名，惟應有二名見證人。3.若病人意識不清且無親屬或關係人在\n場，醫療緊急情況得由2 名合格醫師在病歷上證明需檢查或治療即可。)\n見證人1：（簽章）見證人2：（簽章）\n見證人1 身分證字號：見證人2 身分證字號：\n日期：西元年月日時間：時分"}, {"code": "1074", "title": "對比增強斷層合成立體乳房X光攝影說明暨同意書", "nature": "診斷檢查", "modality": "乳房影像與切片", "body_raw": "乳房", "body_group": "乳房", "unit": "影像醫學部", "campuses": ["未指明特定大樓"], "audience": ["中文一般/成人"], "prep": ["需禁食／空腹", "使用顯影／造影劑", "需驗腎功能 (Cre)"], "phone": "2655053", "rel_path": "pdfs/1074_對比增強斷層合成立體乳房X光攝影說明暨同意書.pdf", "pdf_url": "https://www.ntuh.gov.tw/ckfinder_file/OPD/files/DOCEMENT/inst1074.pdf", "pages": 3, "text": "國立臺灣大學醫學院附設醫院\n號名日\n歷\n病姓生\nNationaI Taiwan University HospitaI\n對比增強斷層合成立體乳房 X 光攝影說明暨\n同意書\n第1頁\n對比增強斷層合成立體乳房 X 光攝影說明書\n編號: 1074\n這份說明書是有關您即將接受的醫療處置的效益、風險及替代方案的書面說明,可做\n為您與醫師討論時的補充資料。最重要的是我們希望您能充份瞭解資料的內容,所以\n請仔細閱讀;如果經醫師說明後您還有對這個醫療處置的任何疑問,請在簽名前再與\n您的醫師充分討論,醫師會很樂意為您解答,讓我們一起為了您的健康努力\n適症及作法: (簡述)\n* 適應症:\nl.接受傳統乳房檢查(超音波、乳房攝影)結果不明確或緻密乳房女性,經臨床醫師\n評估認為須接受進一步檢查的患者\n2 · 有磁振造影檢查禁忌症(含釓顯影劑過敏、磁性金屬或精密儀器植入物如心臟節律\n器、電子耳等、幽閉恐懼症)而無法接受磁振掃描之患者\n3 · 判定乳癌局部分期或評估化療反應\n4 · 搭配乳房立體定位切片,提高病灶對比度及切片手術之精準度\n* 作法:\n檢查全程由放射科醫師及女性放射技術師施行。我們會請您以坐姿或側臥姿接受\n檢查。先自周邊靜脈留置針注入含碘顯影劑,並於施打顯影劑的十分鐘內進行多角度\n的乳房攝影或乳房斷層攝影,必要時會加做放大影像。進行乳房攝影或乳房斷層攝影\n時必須將乳房適度壓平,以減少組織重疊,提升影像清晰度與診斷準確性,並降低輻\n射劑量。然而當乳房被壓平固定時,您可能會有一些緊繃感或是輕微疼痛,現場放射\n技術師會依照您的情況做姿勢及乳房壓平程度的調整。攝影時請務必配合保持身體不\n動。本檢查為全自費,健保不給付\n* 特殊注意事項:\n1.本檢查需施打顯影劑,檢查前請禁食四小時以上,可服用平日藥物(例如高血壓及\n心臟病藥物) ,但糖尿病藥物暫停服用。若有低血糖症狀或血糖過低,請立即告知檢\n查現場之工作人員並依醫療指示補充糖分\n2 · 本檢查需施打顯影劑,受檢者需有家屬陪伴。\n3 · 本檢查具游離輻射,有懷孕可能之受檢者請注意。如有疑慮,請與安排檢查之醫師\n4 · 請於檢查後七天,自行約掛門診或依醫師原預約門診時間看檢查結果。\n5 · 注射顯影劑須有三個月內之血清肌酸酐(Creatinine)值,請務必於受檢前三個月內\n完成抽血檢查。不便至本院檢驗者,可攜帶三個月內其他醫院或醫事檢驗機構之血清\n肌酸酐( Creatinine )正式報告於受檢當天供參考\n6 · 注射顯影劑者,若有下列病史請明確告知開立檢查之醫師以及檢查現場之工作人員\n:乳房美容植入物病史、腎功能不良、甲狀腺亢進、嗜鉻細胞瘤、重症肌無力、鐮刀\n型貧血、藥物及顯影劑過敏史。重症肌無力急性症狀者、甲狀腺風暴患者、即將接受\n碘一131治療之甲狀腺亢進患者不建議接受顯影劑注射。重症肌無力非急性症狀者、甲\n狀腺亢進但非急性甲狀腺風暴者、嗜鉻細胞瘤、鐮刀型貧血患者可接受靜脈顯影劑注\n射\n(經由此醫療處置,您可能獲得以下所列的效益,但醫師並不能保證您獲得任何一項\n;且效益與風險性間的取捨,應由您決定。)\n西元2026年08月26日病歷委員會審核通過電子病歷版本 MR 19-1333\n西元2026年08月17日品質暨病人安全委員會審核通過\n國立臺灣大學醫學院附設醫院\n號名日\n歷\n病姓生\nNationaI Taiwan University HospitaI\n對比增強斷層合成立體乳房 X 光攝影說明暨\n同意書\n第2頁\n月匕孑乚\n口酉己 ” 增\n、比,不月匕日、亻浿 ㄣ 卜丐化點及小\n型腫塊,也可將有不正常血管的病灶顯現出來,提高對乳癌及其他乳房病變的敏感度\n本檢查之癌症檢出率顯著高於傳統乳房攝影,並與磁振造影檢出率相當\n風險:\n(沒有任何醫療處置是完全沒有風險的,以下所列的風險已被認定,但是仍然可能有\n一些醫師無法預期的風險未列出。)\n* 顯影劑之可能不良作用:\nl.輕微藥物不良反應包含溫熱感覺、噁心嘔吐、頭暈、打噴嚏,通常短時間內會消退\n。具過敏性體質者,可能會發生       "心臟血管",
      "全身",
      "乳房",
      "其他",
      "呼吸(肺)",
      "泌尿(腎、膀胱、尿路)",
      "生殖",
      "腦與神經",
      "骨骼肌肉"
    ],
    getValues: r => [r.body_group]
  },
  {
    key: "campuses",
    label: "院區大樓",
    collapsed: false,
    options: ["東址", "兒醫大樓", "西址", "健康大樓", "未指明特定大樓"],
    getValues: r => r.campuses
  },
  {
    key: "nature",
    label: "檢查性質",
    collapsed: true,
    options: ["診斷檢查", "介入治療／手術", "照護須知／切結書"],
    getValues: r => [r.nature]
  },
  {
    key: "audience",
    label: "語言／對象",
    collapsed: true,
    options: ["中文一般/成人", "小兒專用", "英文版"],
    getValues: r => r.audience
  }
];

const state = {
  query: "",
  fullText: true,
  sort: "auto",
  view: "card",
  filters: {
    modality: new Set(),
    prep: new Set(),
    body_group: new Set(),
    campuses: new Set(),
    nature: new Set(),
    audience: new Set()
  },
  collapsed: Object.fromEntries(FACET_DEFS.map(f => [f.key, f.collapsed]))
};

const searchInput = document.getElementById("searchInput");
const clearSearch = document.getElementById("clearSearch");
const fullTextToggle = document.getElementById("fullTextToggle");
const clearAllBtn = document.getElementById("clearAllBtn");
const facetsContainer = document.getElementById("facetsContainer");
const activePills = document.getElementById("activePills");
const resultsCount = document.getElementById("resultsCount");
const resultsContainer = document.getElementById("resultsContainer");
const sortSelect = document.getElementById("sortSelect");
const viewCardBtn = document.getElementById("viewCardBtn");
const viewTableBtn = document.getElementById("viewTableBtn");
const sidebar = document.getElementById("sidebar");
const drawerBackdrop = document.getElementById("drawerBackdrop");
const mobileFilterBtn = document.getElementById("mobileFilterBtn");
const mobileFilterCnt = document.getElementById("mobileFilterCnt");

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function escapeRegex(str) {
  return str.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
}

function highlightText(text, terms) {
  let safe = escapeHtml(text);
  if (!terms.length) return safe;
  const pattern = terms.map(escapeRegex).join("|");
  const re = new RegExp(`(${pattern})`, "gi");
  return safe.replace(re, "<mark>$1</mark>");
}

function normForSearch(s) {
  return s.toLowerCase()
    .replace(/([\u4e00-\u9fff\u3000-\u303f\uff00-\uffef])\s+/g, "$1")
    .replace(/\s+([\u4e00-\u9fff\u3000-\u303f\uff00-\uffef])/g, "$1");
}

function matchesQuery(r, terms) {
  if (!terms.length) return { ok: true, score: 0, onlyBody: false, snippet: "" };

  const normTitle = normForSearch(r.title);
  const normCode = normForSearch(r.code);
  const metaOther = normForSearch([
    r.nature, r.modality, r.body_raw, r.body_group,
    r.unit, r.phone, r.campuses.join(" "), r.audience.join(" "), r.prep.join(" ")
  ].join(" "));
  const normMeta = normCode + " " + normTitle + " " + metaOther;
  const compactText = r.text.replace(/\s+/g, " ");
  const normText = normForSearch(compactText);
  const normFull = state.fullText ? (normMeta + " " + normText) : normMeta;

  for (const t of terms) {
    if (!normFull.includes(normForSearch(t))) return { ok: false };
  }

  // Relevance scoring
  let score = 0;
  const rawQ = normForSearch(terms.join(""));
  if (normCode === rawQ || String(parseInt(r.code, 10)) === rawQ) score += 1000;

  let titleHits = 0;
  let metaHits = 0;
  for (const t of terms) {
    const nt = normForSearch(t);
    if (normCode.includes(nt)) score += 300;
    if (normTitle.includes(nt)) { score += 80; titleHits++; }
    if (metaOther.includes(nt)) { score += 25; metaHits++; }
    if (state.fullText && normText.includes(nt)) {
      const occ = normText.split(nt).length - 1;
      score += 3 + Math.min(occ, 10);
    }
  }
  if (titleHits === terms.length) score += 150;
  const onlyBody = (titleHits === 0 && metaHits === 0 && !terms.some(t => normCode.includes(normForSearch(t))));
  const snippet = state.fullText ? buildSnippet(compactText, terms) : "";
  return { ok: true, score, onlyBody, snippet };
}

function matchesFacets(r, skipKey = null) {
  for (const f of FACET_DEFS) {
    if (f.key === skipKey) continue;
    const selected = state.filters[f.key];
    if (selected.size === 0) continue;
    const vals = f.getValues(r);
    if (!vals.some(v => selected.has(v))) return false;
  }
  return true;
}

function buildSnippet(text, terms) {
  if (!text || !terms.length) return "";
  const lower = text.toLowerCase();
  let bestIdx = -1;
  for (const t of terms) {
    const idx = lower.indexOf(t.toLowerCase());
    if (idx !== -1 && (bestIdx === -1 || idx < bestIdx)) bestIdx = idx;
  }
  if (bestIdx === -1) return "";
  const start = Math.max(0, bestIdx - 42);
  const end = Math.min(text.length, bestIdx + 115);
  let slice = text.slice(start, end).replace(/\n+/g, " ");
  if (start > 0) slice = "..." + slice;
  if (end < text.length) slice = slice + "...";
  return slice;
}

function renderFacets(terms) {
  // Pre-evaluate query match once per record
  const qMatched = RECORDS.filter(r => matchesQuery(r, terms).ok);

  facetsContainer.innerHTML = FACET_DEFS.map(f => {
    const baseRecords = qMatched.filter(r => matchesFacets(r, f.key));
    const counts = {};
    f.options.forEach(opt => { counts[opt] = 0; });
    baseRecords.forEach(r => {
      f.getValues(r).forEach(v => {
        if (v in counts) counts[v]++;
      });
    });

    const selected = state.filters[f.key];
    const activeBadge = selected.size > 0 ? ` <span style="color:var(--teal); font-weight:700;">(${selected.size})</span>` : "";
    const isCollapsed = state.collapsed[f.key];

    const listHtml = f.options.map(opt => {
      const isChecked = selected.has(opt);
      const cnt = counts[opt] || 0;
      const cls = ["facet-item", isChecked ? "checked" : "", (!isChecked && cnt === 0) ? "zero" : ""].filter(Boolean).join(" ");
      return `
        <label class="${cls}">
          <span class="facet-left">
            <input type="checkbox" data-facet="${f.key}" value="${escapeHtml(opt)}" ${isChecked ? "checked" : ""} />
            <span class="facet-name" title="${escapeHtml(opt)}">${escapeHtml(opt)}</span>
          </span>
          <span class="facet-cnt">${cnt}</span>
        </label>`;
    }).join("");

    return `
      <div class="facet-group ${isCollapsed ? "collapsed" : ""}" data-group="${f.key}">
        <button type="button" class="facet-toggle" data-toggle="${f.key}">
          <span>${escapeHtml(f.label)}${activeBadge}</span>
          <span class="facet-chevron">▼</span>
        </button>
        <div class="facet-list">${listHtml}</div>
      </div>`;
  }).join("");

  facetsContainer.querySelectorAll("[data-toggle]").forEach(btn => {
    btn.addEventListener("click", () => {
      const k = btn.dataset.toggle;
      state.collapsed[k] = !state.collapsed[k];
      btn.closest(".facet-group").classList.toggle("collapsed", state.collapsed[k]);
    });
  });

  facetsContainer.querySelectorAll("input[data-facet]").forEach(cb => {
    cb.addEventListener("change", () => {
      const set = state.filters[cb.dataset.facet];
      if (cb.checked) set.add(cb.value);
      else set.delete(cb.value);
      render();
    });
  });
}

function renderActivePills() {
  const pills = [];
  FACET_DEFS.forEach(f => {
    state.filters[f.key].forEach(val => {
      pills.push(`
        <span class="active-pill">
          <span>${escapeHtml(f.label)}：${escapeHtml(val)}</span>
          <button type="button" data-rm-facet="${f.key}" data-rm-val="${escapeHtml(val)}" title="移除條件">✕</button>
        </span>`);
    });
  });
  activePills.innerHTML = pills.join("");
  activePills.querySelectorAll("[data-rm-facet]").forEach(btn => {
    btn.addEventListener("click", () => {
      state.filters[btn.dataset.rmFacet].delete(btn.dataset.rmVal);
      render();
    });
  });

  const totalActive = FACET_DEFS.reduce((acc, f) => acc + state.filters[f.key].size, 0);
  mobileFilterCnt.textContent = totalActive > 0 ? `(${totalActive})` : "";
}

function toggleFacetValue(key, val) {
  const set = state.filters[key];
  if (set.has(val)) set.delete(val);
  else set.add(val);
  render();
}

function natureBadgeClass(nature) {
  if (nature.includes("介入")) return "badge-intervene";
  if (nature.includes("照護")) return "badge-note";
  return "";
}

function render() {
  const terms = state.query.trim().split(/\s+/).filter(Boolean);

  renderFacets(terms);
  renderActivePills();

  document.querySelectorAll(".quick-chip").forEach(btn => {
    btn.classList.toggle("active", state.query.trim() === btn.dataset.q);
  });

  let items = [];
  for (const r of RECORDS) {
    if (!matchesFacets(r)) continue;
    const qRes = matchesQuery(r, terms);
    if (!qRes.ok) continue;
    items.push({ rec: r, score: qRes.score, onlyBody: qRes.onlyBody, snippet: qRes.snippet });
  }

  if (state.sort === "auto" && terms.length > 0) {
    items.sort((a, b) => (b.score - a.score) || ((parseInt(a.rec.code, 10) || 999999) - (parseInt(b.rec.code, 10) || 999999)));
  } else if (state.sort === "pages_desc") {
    items.sort((a, b) => (b.rec.pages - a.rec.pages) || ((parseInt(a.rec.code, 10) || 999999) - (parseInt(b.rec.code, 10) || 999999)));
  } else {
    items.sort((a, b) => (parseInt(a.rec.code, 10) || 999999) - (parseInt(b.rec.code, 10) || 999999));
  }

  resultsCount.innerHTML = `顯示 <strong>${items.length}</strong> / ${RECORDS.length} 份說明書` +
    (terms.length ? `（關鍵字：${terms.map(t => `<mark>${escapeHtml(t)}</mark>`).join(" + ")}）` : "");

  if (!items.length) {
    resultsContainer.innerHTML = `
      <div class="empty">
        <p style="font-size:1.05rem; margin:0 0 8px;">找不到符合條件的檢查說明書</p>
        <p style="font-size:0.86rem; margin:0;">請試著取消部分左側勾選條件、改用較短關鍵字，或確認已勾選「含 PDF 全文檢索」。</p>
      </div>`;
    return;
  }

  if (state.view === "card") {
    resultsContainer.innerHTML = `<div class="cards-grid">${items.map(({ rec, onlyBody, snippet }) => {
      const nCls = natureBadgeClass(rec.nature);
      const pedsBadge = rec.audience.includes("小兒專用") ? `<span class="badge badge-peds badge-click" data-pick-key="audience" data-pick-val="小兒專用" title="點擊篩選：小兒專用">小兒專用</span>` : "";
      const langBadge = rec.audience.includes("英文版") ? `<span class="badge badge-lang badge-click" data-pick-key="audience" data-pick-val="英文版" title="點擊篩選：英文版">英文版</span>` : "";
      const natureBadge = nCls ? `<span class="badge ${nCls} badge-click" data-pick-key="nature" data-pick-val="${escapeHtml(rec.nature)}" title="點擊篩選：${escapeHtml(rec.nature)}">${escapeHtml(rec.nature)}</span>` : "";

      const prepHtml = rec.prep.length ? `
        <div class="prep-row">
          ${rec.prep.map(p => `<span class="badge badge-prep badge-click" data-pick-key="prep" data-pick-val="${escapeHtml(p)}" title="點擊篩選：${escapeHtml(p)}">${escapeHtml(p)}</span>`).join("")}
        </div>` : "";

      const snippetHtml = snippet ? `
        <div class="snippet-box">
          <div class="snippet-label">${onlyBody ? "僅內文命中片段：" : "PDF 內文命中片段："}</div>
          <div>${highlightText(snippet, terms)}</div>
        </div>` : "";

      return `
        <article class="card">
          <div class="card-head">
            <div class="badges">
              <span class="badge badge-code">#${escapeHtml(rec.code)}</span>
              <span class="badge badge-mod badge-click" data-pick-key="modality" data-pick-val="${escapeHtml(rec.modality)}" title="點擊篩選：${escapeHtml(rec.modality)}">${escapeHtml(rec.modality)}</span>
              ${natureBadge}
              <span class="badge badge-body badge-click" data-pick-key="body_group" data-pick-val="${escapeHtml(rec.body_group)}" title="點擊篩選部位：${escapeHtml(rec.body_group)}">${escapeHtml(rec.body_raw)}</span>
              ${pedsBadge}${langBadge}
            </div>
            <span class="page-meta">${rec.pages} 頁</span>
          </div>
          <h3 class="card-title"><a href="${encodeURI(rec.rel_path)}" target="_blank" rel="noopener">${highlightText(rec.title, terms)}<span class="ext-arrow" title="新分頁開啟 PDF">↗</span></a></h3>
          <div class="meta-list">
            <div class="meta-item"><span class="meta-k">檢查單位：</span><span>${highlightText(rec.unit, terms)}</span></div>
            <div class="meta-item"><span class="meta-k">聯絡分機：</span><span>${highlightText(rec.phone || "—", terms)}</span></div>
          </div>
          ${prepHtml}
          ${snippetHtml}
        </article>`;
    }).join("")}</div>`;
  } else {
    resultsContainer.innerHTML = `
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>編號</th>
              <th>儀器分類 / 性質</th>
              <th>部位</th>
              <th>檢查名稱（點擊開 PDF）</th>
              <th>檢前準備</th>
              <th>檢查單位</th>
              <th>聯絡分機</th>
            </tr>
          </thead>
          <tbody>
            ${items.map(({ rec, snippet }) => `
              <tr>
                <td><span class="badge badge-code">#${escapeHtml(rec.code)}</span></td>
                <td>
                  <div><strong class="badge-click" data-pick-key="modality" data-pick-val="${escapeHtml(rec.modality)}">${escapeHtml(rec.modality)}</strong></div>
                  <div style="font-size:0.75rem; color:var(--muted);">${escapeHtml(rec.nature)}</div>
                </td>
                <td>${escapeHtml(rec.body_raw)}</td>
                <td>
                  <div class="table-title"><a href="${encodeURI(rec.rel_path)}" target="_blank" rel="noopener"><strong>${highlightText(rec.title, terms)}</strong><span class="ext-arrow">↗</span></a></div>
                  ${snippet ? `<div style="margin-top:4px; font-size:0.77rem; color:#92400e; background:#fffbeb; padding:3px 6px; border-radius:4px;">${highlightText(snippet, terms)}</div>` : ""}
                </td>
                <td>
                  <div style="display:flex; flex-wrap:wrap; gap:3px; max-width:210px;">
                    ${rec.prep.length ? rec.prep.map(p => `<span class="badge badge-prep badge-click" data-pick-key="prep" data-pick-val="${escapeHtml(p)}">${escapeHtml(p)}</span>`).join("") : '<span style="color:var(--muted); font-size:0.78rem;">—</span>'}
                  </div>
                </td>
                <td>${highlightText(rec.unit, terms)}</td>
                <td style="white-space:nowrap;">${highlightText(rec.phone || "—", terms)}</td>
              </tr>`).join("")}
          </tbody>
        </table>
      </div>`;
  }

  resultsContainer.querySelectorAll("[data-pick-key]").forEach(el => {
    el.addEventListener("click", () => toggleFacetValue(el.dataset.pickKey, el.dataset.pickVal));
  });
}

// Events
searchInput.addEventListener("input", e => {
  state.query = e.target.value;
  clearSearch.classList.toggle("show", Boolean(state.query));
  render();
});

clearSearch.addEventListener("click", () => {
  state.query = "";
  searchInput.value = "";
  clearSearch.classList.remove("show");
  searchInput.focus();
  render();
});

fullTextToggle.addEventListener("change", e => {
  state.fullText = e.target.checked;
  render();
});

document.querySelectorAll(".quick-chip").forEach(btn => {
  btn.addEventListener("click", () => {
    const q = btn.dataset.q;
    state.query = state.query.trim() === q ? "" : q;
    searchInput.value = state.query;
    clearSearch.classList.toggle("show", Boolean(state.query));
    render();
  });
});

clearAllBtn.addEventListener("click", () => {
  state.query = "";
  searchInput.value = "";
  clearSearch.classList.remove("show");
  FACET_DEFS.forEach(f => state.filters[f.key].clear());
  render();
});

sortSelect.addEventListener("change", e => {
  state.sort = e.target.value;
  render();
});

viewCardBtn.addEventListener("click", () => {
  state.view = "card";
  viewCardBtn.classList.add("active");
  viewTableBtn.classList.remove("active");
  render();
});
viewTableBtn.addEventListener("click", () => {
  state.view = "table";
  viewTableBtn.classList.add("active");
  viewCardBtn.classList.remove("active");
  render();
});

mobileFilterBtn.addEventListener("click", () => {
  sidebar.classList.add("open");
  drawerBackdrop.classList.add("open");
});
drawerBackdrop.addEventListener("click", () => {
  sidebar.classList.remove("open");
  drawerBackdrop.classList.remove("open");
});

render();
</script>
</body>
</html>
