<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>臺大醫院影像醫學部｜檢查說明書快速查詢系統</title>
<style>
  :root {
    --bg: #f4f7fb;
    --surface: #ffffff;
    --surface-2: #f8fafc;
    --navy: #0f2942;
    --teal: #0e7490;
    --teal-soft: #ecfeff;
    --teal-border: #a5f3fc;
    --blue-soft: #eff6ff;
    --blue-text: #1d4ed8;
    --amber-soft: #fffbeb;
    --amber-text: #b45309;
    --amber-border: #fde68a;
    --rose-soft: #fff1f2;
    --rose-text: #be123c;
    --rose-border: #fecdd3;
    --emerald-soft: #ecfdf5;
    --emerald-text: #047857;
    --violet-soft: #f5f3ff;
    --violet-text: #6d28d9;
    --violet-border: #ddd6fe;
    --text: #1e293b;
    --muted: #64748b;
    --border: #e2e8f0;
    --shadow: 0 2px 10px rgba(15, 41, 66, 0.05);
    --radius: 12px;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.55;
  }

  /* Header */
  .topbar {
    background: linear-gradient(135deg, #0f2942 0%, #0e4d64 60%, #0e7490 100%);
    color: #fff;
    padding: 18px 24px 16px;
    box-shadow: 0 4px 18px rgba(15, 41, 66, 0.14);
  }
  .topbar-inner {
    max-width: 1420px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .brand h1 {
    margin: 0;
    font-size: 1.32rem;
    font-weight: 700;
    letter-spacing: 0.3px;
  }
  .brand p {
    margin: 3px 0 0;
    font-size: 0.84rem;
    color: rgba(255, 255, 255, 0.84);
  }
  .topbar-stats {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .stat-pill {
    background: rgba(255, 255, 255, 0.14);
    border: 1px solid rgba(255, 255, 255, 0.24);
    padding: 5px 12px;
    border-radius: 999px;
    font-size: 0.8rem;
  }

  /* Two-column Workspace */
  .layout {
    max-width: 1420px;
    margin: 0 auto;
    padding: 18px 20px 48px;
    display: grid;
    grid-template-columns: 286px minmax(0, 1fr);
    gap: 18px;
    align-items: start;
  }

  /* Sidebar */
  .sidebar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    position: sticky;
    top: 14px;
    max-height: calc(100vh - 28px);
    overflow-y: auto;
  }
  .sidebar-head {
    padding: 12px 15px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    background: var(--surface);
    z-index: 2;
  }
  .sidebar-head h2 {
    margin: 0;
    font-size: 0.95rem;
    color: var(--navy);
  }
  .btn-clear-sm {
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--muted);
    font-size: 0.76rem;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 7px;
    cursor: pointer;
    font-family: inherit;
  }
  .btn-clear-sm:hover { color: var(--navy); border-color: #cbd5e1; background: #e2e8f0; }

  .facet-group {
    border-bottom: 1px solid #f1f5f9;
  }
  .facet-group:last-child { border-bottom: none; }
  .facet-toggle {
    width: 100%;
    background: transparent;
    border: none;
    padding: 10px 15px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--navy);
    text-align: left;
  }
  .facet-toggle:hover { background: var(--surface-2); }
  .facet-chevron {
    font-size: 0.72rem;
    color: var(--muted);
    transition: transform 0.15s;
  }
  .facet-group.collapsed .facet-chevron { transform: rotate(-90deg); }
  .facet-group.collapsed .facet-list { display: none; }

  .facet-list {
    padding: 0 12px 11px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .facet-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 5px 7px;
    border-radius: 7px;
    cursor: pointer;
    font-size: 0.83rem;
    color: var(--text);
    user-select: none;
    transition: background 0.1s;
  }
  .facet-item:hover { background: var(--surface-2); }
  .facet-item.checked {
    background: var(--teal-soft);
    color: var(--navy);
    font-weight: 600;
  }
  .facet-item.zero {
    opacity: 0.42;
  }
  .facet-left {
    display: flex;
    align-items: center;
    gap: 7px;
    min-width: 0;
  }
  .facet-left input {
    margin: 0;
    accent-color: var(--teal);
    cursor: pointer;
    flex-shrink: 0;
  }
  .facet-name {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .facet-cnt {
    font-size: 0.74rem;
    color: var(--muted);
    background: #f1f5f9;
    padding: 1px 7px;
    border-radius: 999px;
    flex-shrink: 0;
  }
  .facet-item.checked .facet-cnt {
    background: rgba(14, 116, 144, 0.15);
    color: var(--teal);
  }

  /* Right Main Panel */
  .main-col { min-width: 0; }

  .search-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 14px 16px;
    margin-bottom: 14px;
  }
  .search-row {
    display: flex;
    gap: 9px;
    flex-wrap: wrap;
    align-items: center;
  }
  .search-box {
    flex: 1 1 320px;
    position: relative;
  }
  .search-box input {
    width: 100%;
    padding: 10px 36px 10px 38px;
    font-size: 0.96rem;
    border: 1.5px solid #cbd5e1;
    border-radius: 10px;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
    font-family: inherit;
  }
  .search-box input:focus {
    border-color: var(--teal);
    box-shadow: 0 0 0 3px rgba(14, 116, 144, 0.14);
  }
  .search-icon {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    pointer-events: none;
    font-size: 0.95rem;
  }
  .clear-btn {
    position: absolute;
    right: 9px;
    top: 50%;
    transform: translateY(-50%);
    background: #e2e8f0;
    border: none;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    cursor: pointer;
    color: #475569;
    font-size: 12px;
    display: none;
    align-items: center;
    justify-content: center;
  }
  .clear-btn.show { display: flex; }
  .clear-btn:hover { background: #cbd5e1; }

  .search-scope {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 0.84rem;
    color: var(--muted);
    background: var(--surface-2);
    border: 1px solid var(--border);
    padding: 7px 11px;
    border-radius: 9px;
    cursor: pointer;
    user-select: none;
  }
  .search-scope input { accent-color: var(--teal); cursor: pointer; }

  .mobile-filter-btn {
    display: none;
    background: var(--navy);
    color: #fff;
    border: none;
    padding: 8px 13px;
    border-radius: 9px;
    font-size: 0.84rem;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }

  .quick-bar {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 10px;
    font-size: 0.8rem;
    color: var(--muted);
  }
  .quick-chip {
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: #334155;
    padding: 3px 10px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 0.78rem;
    font-family: inherit;
    transition: all 0.12s;
  }
  .quick-chip:hover, .quick-chip.active {
    border-color: var(--teal);
    color: var(--teal);
    background: var(--teal-soft);
    font-weight: 600;
  }

  /* Active filter pills */
  .active-pills {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    margin-bottom: 12px;
  }
  .active-pills:empty { display: none; }
  .active-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #e0f2fe;
    color: #0369a1;
    border: 1px solid #bae6fd;
    padding: 3px 9px;
    border-radius: 999px;
    font-size: 0.78rem;
    font-weight: 600;
  }
  .active-pill button {
    border: none;
    background: transparent;
    color: #0369a1;
    cursor: pointer;
    padding: 0;
    font-size: 0.85rem;
    line-height: 1;
    font-weight: 700;
  }
  .active-pill button:hover { color: #0c4a6e; }

  /* Results toolbar */
  .results-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 12px;
  }
  .results-count {
    font-size: 0.9rem;
    color: var(--muted);
  }
  .results-count strong { color: var(--navy); font-size: 1.02rem; }
  .toolbar-right {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .sort-select {
    padding: 5px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    color: var(--text);
    font-family: inherit;
    font-size: 0.82rem;
    cursor: pointer;
  }
  .view-toggle {
    display: inline-flex;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 9px;
    overflow: hidden;
  }
  .view-btn {
    border: none;
    background: transparent;
    padding: 6px 12px;
    font-size: 0.82rem;
    cursor: pointer;
    font-family: inherit;
    color: var(--muted);
    font-weight: 600;
  }
  .view-btn.active {
    background: var(--navy);
    color: #fff;
  }

  /* Cards Grid */
  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 13px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 9px;
    transition: transform 0.12s, box-shadow 0.12s, border-color 0.12s;
  }
  .card:hover {
    transform: translateY(-1px);
    box-shadow: 0 8px 22px rgba(15, 41, 66, 0.08);
    border-color: #cbd5e1;
  }
  .card-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
  }
  .badges {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    align-items: center;
  }
  .badge {
    font-size: 0.73rem;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 6px;
    border: 1px solid transparent;
  }
  .badge-click {
    cursor: pointer;
    transition: filter 0.1s, transform 0.1s;
  }
  .badge-click:hover {
    filter: brightness(0.94);
  }
  .badge-code {
    background: var(--navy);
    color: #fff;
    font-family: ui-monospace, Consolas, monospace;
  }
  .badge-mod {
    background: var(--teal-soft);
    color: var(--teal);
    border-color: var(--teal-border);
  }
  .badge-intervene {
    background: var(--rose-soft);
    color: var(--rose-text);
    border-color: var(--rose-border);
  }
  .badge-note {
    background: var(--amber-soft);
    color: var(--amber-text);
    border-color: var(--amber-border);
  }
  .badge-body {
    background: #f1f5f9;
    color: #475569;
  }
  .badge-lang {
    background: var(--blue-soft);
    color: var(--blue-text);
  }
  .badge-peds {
    background: var(--emerald-soft);
    color: var(--emerald-text);
  }
  .badge-prep {
    background: var(--violet-soft);
    color: var(--violet-text);
    border-color: var(--violet-border);
    font-weight: 600;
  }
  .page-meta {
    font-size: 0.74rem;
    color: var(--muted);
    white-space: nowrap;
  }

  .card-title {
    margin: 0;
    font-size: 1.02rem;
    font-weight: 700;
    color: var(--navy);
    line-height: 1.4;
  }
  .card-title a, .table-title a {
    color: var(--navy);
    text-decoration: none;
    transition: color 0.12s;
  }
  .card-title a:hover, .table-title a:hover {
    color: var(--teal);
    text-decoration: underline;
  }
  .ext-arrow {
    font-size: 0.85em;
    color: var(--teal);
    margin-left: 4px;
    font-weight: 600;
  }

  .meta-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-size: 0.83rem;
    color: #334155;
  }
  .meta-item {
    display: flex;
    gap: 6px;
    align-items: flex-start;
  }
  .meta-k {
    color: var(--muted);
    flex-shrink: 0;
    font-weight: 600;
  }

  .prep-row {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-top: 2px;
  }

  .snippet-box {
    background: #fffbeb;
    border: 1px solid #fde68a;
    border-radius: 8px;
    padding: 7px 10px;
    font-size: 0.79rem;
    color: #451a03;
    line-height: 1.5;
  }
  .snippet-label {
    font-weight: 700;
    color: #92400e;
    margin-bottom: 2px;
    font-size: 0.74rem;
  }

  mark {
    background: #fde047;
    color: #0f172a;
    padding: 0 2px;
    border-radius: 3px;
    font-weight: 700;
  }

  /* Table view */
  .table-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow-x: auto;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.85rem;
  }
  th, td {
    padding: 10px 12px;
    text-align: left;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }
  th {
    background: var(--surface-2);
    color: var(--navy);
    font-weight: 700;
    white-space: nowrap;
  }
  tr:hover td { background: #f8fafc; }

  /* Empty state */
  .empty {
    text-align: center;
    padding: 48px 20px;
    background: var(--surface);
    border: 1px dashed #cbd5e1;
    border-radius: var(--radius);
    color: var(--muted);
  }

  /* Mobile drawer overlay */
  .drawer-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.45);
    z-index: 90;
  }
  .drawer-backdrop.open { display: block; }

  @media (max-width: 960px) {
    .layout { grid-template-columns: 1fr; }
    .mobile-filter-btn { display: inline-flex; align-items: center; gap: 5px; }
    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      width: min(310px, 86vw);
      max-height: 100vh;
      border-radius: 0 14px 14px 0;
      z-index: 100;
      transform: translateX(-105%);
      transition: transform 0.2s ease;
    }
    .sidebar.open { transform: translateX(0); }
  }
  @media (max-width: 600px) {
    .cards-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <h1>臺大醫院 影像醫學部｜檢查說明書快速查詢系統</h1>
      <p>點擊檢查名稱即可在新分頁開啟本地 PDF；支援多條件動態聯動篩選、檢前準備標籤與全文檢索</p>
    </div>
    <div class="topbar-stats">
      <span class="stat-pill">共 <strong>53</strong> 份文件</span>
      <span class="stat-pill">離線可用・點擊標題開 PDF</span>
    </div>
  </div>
</header>

<div id="drawerBackdrop" class="drawer-backdrop"></div>

<div class="layout">
  <aside id="sidebar" class="sidebar" aria-label="篩選條件">
    <div class="sidebar-head">
      <h2>篩選條件</h2>
      <button id="clearAllBtn" class="btn-clear-sm">全部清除</button>
    </div>
    <div id="facetsContainer"></div>
  </aside>

  <main class="main-col">
    <section class="search-panel">
      <div class="search-row">
        <button id="mobileFilterBtn" class="mobile-filter-btn">篩選條件 <span id="mobileFilterCnt"></span></button>
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input id="searchInput" type="text" placeholder="搜尋編號、檢查名稱、檢查室、分機或說明書內文（可用空白分隔多個詞）..." autocomplete="off" />
          <button id="clearSearch" class="clear-btn" title="清除搜尋">✕</button>
        </div>
        <label class="search-scope" title="勾選後可搜尋 PDF 內文文字（含掃描檔 OCR 辨識內容）">
          <input id="fullTextToggle" type="checkbox" checked />
          <span>含 PDF 全文檢索</span>
        </label>
      </div>

      <div class="quick-bar">
        <span>常用關鍵字：</span>
        <button class="quick-chip" data-q="禁食">禁食 / 空腹</button>
        <button class="quick-chip" data-q="顯影劑">顯影劑</button>
        <button class="quick-chip" data-q="懷孕">懷孕</button>
        <button class="quick-chip" data-q="肌酸酐">肌酸酐 / 腎功能</button>
        <button class="quick-chip" data-q="Metformin">Metformin</button>
        <button class="quick-chip" data-q="過敏">過敏</button>
        <button class="quick-chip" data-q="鎮靜">鎮靜 / 麻醉</button>
        <button class="quick-chip" data-q="心律調節器">心律調節器</button>
      </div>
    </section>

    <div id="activePills" class="active-pills"></div>

    <div class="results-bar">
      <div class="results-count" id="resultsCount"></div>
      <div class="toolbar-right">
        <select id="sortSelect" class="sort-select" aria-label="排序方式">
          <option value="auto">排序：智慧相關度（有搜尋時）</option>
          <option value="code">排序：依編號由小到大</option>
          <option value="pages_desc">排序：依頁數由多到少</option>
        </select>
        <div class="view-toggle">
          <button id="viewCardBtn" class="view-btn active">卡片視圖</button>
          <button id="viewTableBtn" class="view-btn">清單表格</button>
        </div>
      </div>
    </div>

    <section id="resultsContainer"></section>
  </main>

<script>

能檢驗值,須當場抽驗腎功能,待檢驗結果顯示腎功能正常始可\n接受泌尿道攝影檢查。\n特殊注意事項:\n、檢查前注意事項:\n1.檢查前二天,禁吃肉類、蛋、牛奶之食物,但可食用魚類食物\n2 · 檢查前一天,可食用稀飯、麵等殘渣較少之食物。禁吃蔬菜、水果。每餐後飲一大\n杯開水約300一500cc 。可參考大腸鏡所使用的「低渣飲食衛教單」,下載網\n址 http : //www. ntuh. gov. tw/Medi calTeams/ 1 ab/\n3.檢查前一天的睡前,服用黃色 DuIcoIax (清腸劑)四顆,每間隔二十分鐘飲用一大\n杯( 200 cc )開水一次,\n4 · 檢查當天早上六點自行用大粒坐藥灌腸(藥灌入肛門內忍半小時後才入廁) ,並盡量\n排便乾淨(二\n三次以上)。當日早上八點以前吃完早餐,請於八點後至檢查前禁食且\n不喝水,但可搭配50cc 以內的白開水服用藥物,如心臟病及降血壓藥物;但降血糖藥\n暫勿服用,以免血糖因禁食而降得太低,導致身體不適\n、檢查後注意事項:\nI.檢查後,請多喝開水,以利造影劑之儘快由小便排出\n2 · 請於檢查後七天(檢查當日及例假日不算) ,自行約掛門診或依醫師原預約門診時間\n看檢查結果\n作法:受檢者平躺於 X 光檢查台上接受腹部 X 光照射,之後需打針並施打血管內顯影\n劑,打完顯影劑後還需在檢查台上平躺等待,後續並需要再接受數次腹部 X 光照射檢\n查(依個人狀況有時須等候較長時間) ,有些人還需半側躺改變姿勢再照相,之後會在\n檢查室外喝水將膀胱漲滿後再次進檢查室照腹部 X 光,部份人可能要在解尿後再次進\n檢查室照腹部 X 光\n偵測並評估病灶。\n本檢查須經靜脈注入含碘之造影劑,少數病人會由於本身特異體質而對含碘之造影劑\n西元2023年12月15日病歷管理委員會修正通過電子病歷版本 MR 19一21\n西元2021年08月20日品質暨病人安全委員會審核通過\n國立臺灣大學醫學院附設醫院\n號名日\n歷\n病姓生\nNationaI Taiwan University HospitaI\n泌尿道攝影檢查說明暨同意書\n請詳細閱讀內容,待醫師向您說明後,再簽署同意書第2頁\n目之畐 |\n心、嘔吐\n不\n入吸入,\n、一工\n斑、蕁麻疹、腎功能受損及洗腎、支氣管攣縮,喉部水腫及呼吸困難、血壓驟降、\n跳停止、休克,甚至死亡。死亡率據報告有一萬二千分之一。而有過敏病史者其機率\n為常人之二倍。\n替代方案 ·\n如電腦斷層掃描攝影或泌尿道超音波等,如有任何問題,請向您的臨床醫師諮詢\n醫師補充說明/病人出之問及解釋: (如,請填寫、)\n說明醫師:\n時間:\n日期:西元\n日\n泌尿道攝影檢查同意書\n/ / ,需接受泌尿道攝影檢查。立同意書人已經與\n,出生於西元\n病人:\n醫師討論過接受這個手術或醫療處置的效益、風險及替代方案,對醫師的說明都已\n充分了解且同意由貴院施行該項術式或醫療處置。\n立同意書人姓名:\n(簽章)\n身分證字號/居留證或護照號碼:\n與病人之關係(請圈選) :本人、配偶、父、母、兒、女、其他:\n住址:\n時間:\n時\n年\n日期:西元\n月\n日\n( 1.如由病人、親屬或關係人簽署本同意書,則無需見證,見證人部分得免填。2.若意識清楚,但無法親自簽具者且\n無親屬或關係人在場,得以按指印代替簽名,惟應有二名見證人。若病人意識不清且無親屬或關係人在場,醫療\n緊急情況得由二名合格醫師在病歷上證明需檢查或治療即可。)\n(簽章)見證人2 :\n(簽章)\n見證人1 :\n見證人1身分證字號:\n見證人2身分證字號:\n時間:\n時\n日期:西元\n日\n西元2023年12月15日病歷管理委員會修正通過電子病歷版本 MR 19一21\n西元2021年08月20日品質暨病人安全委員會審核通過\n臺大醫院暨兒童醫院影像醫學部門診檢查一般說明書\n健康大樓 IF 搭乘電梯或電扶梯至 BIF\n聯絡\n( 02 ) 23123456轉\nX 光攝影室\n電話分機: 278142\n地點\n一般注意事項\n* 請務必詳閱各檢查說明書載明注意事項並填妥同意書,按照約定時間攜帶\n預約通知單、檢查同意書、健保卡或身分證明文件提前至各檢查室登記處\n辦理報到、候檢及準備工作,並請禮讓急重症病患\n* 立同意書人須年滿十八歲方具法律效力檢查對象若未滿十八歲,請務必\n由法定代理人簽妥同意書並陪同到院檢查\n* 如需更改日期,請於預約檢查日之前持預約檢查通知單至檢查室登記處辦\n理,或與各檢查室登記處聯絡。\n* 若因天災或其他因素經行政院人事行政總處發布台北市停止上班〔災防\n假〕,各項影像醫學部門診檢查請考量自身安全,並擇期於上班日電洽各\n檢查室登記處以利盡速安排檢查時段\n檢查注意事項\n、檢查前注意事項:\n1.請詳閱各檢查說明書載名的抽血、清腸或禁食準備,若未準備妥當將\n導致當日檢查無法如期完成\n2 · 各項檢查皆可能會更換檢查服,請穿著輕便衣物以利更換\n、檢查中注意事項:\n檢查時請務必聽從醫護人員指示,方能維持高品質的檢查以及保護您的\n、檢查後注意事項 ·\n檢查報告預計將於七個工作天內完成,請按照門診醫師預約回診時間或\n自行預約檢查完七個工作天後回原門診查看結果\n資料來源\n兌明書修訂日期\n影像醫學部\n115年10月30日\n○ 號說明書\n臺大醫院泌尿道攝影檢查地點簡要圖示\n請至健康大樓 IF 搭乘電梯或電扶梯至\n※ 請到報到\nBIF 報到\n往西址院區\n往兒童醫院\n中央走廊側\n亻\nIF\n檢驗醫學部\n梯廳\n餐 mi\n藥劑部\n櫃\n報至 |\n勇廁\nMRI 檢查室\n健康大樓 BIF 示意圖\n中山南路12號"}, {"code": "055", "title": "上消化道／小腸攝影說明暨同意書", "nature": "診斷檢查", "modality": "X光與透視攝影", "body_raw": "消化(胃/腸)", "body_group": "消化系統", "unit": "東址一樓影像醫學部第11攝影室", "campuses": ["東址"], "audience": ["中文一般/成人"], "prep": ["需禁食／空腹", "使用顯影／造影劑"], "phone": "262623", "rel_path": "pdfs/055_上消化道／小腸攝影說明暨同意書.pdf", "pdf_url": "https://www.ntuh.gov.tw/ckfinder_file/OPD/files/DOCEMENT/inst055.pdf", "pages": 4, "text": "國立臺灣大學醫學院附設醫院\nNational Taiwan University Hospital\n上消化道/小腸攝影檢查說明暨同意書\n請詳細閱讀內容，待醫師向您說明後，再簽署同意書第 1 頁\n西元2023 年 12 月15 日病歷委員會修正通過電子病歷版本 MR 19-20-40\n西元2021 年04 月16 日品質暨病人安全委員會審核通過\n文件編號\n01400-4-601370\n版次\n07\n\n病歷號：\n姓名：\n生日：西元年月日\n上消化道/小腸攝影檢查說明書\n這份說明書是有關您即將接受的手術（或醫療處置）的效益、風險及替代方案的書面說明，\n可做為您與醫師討論時的補充資料。最重要的是我們希望您能充份瞭解資料的內容，所以請\n仔細閱讀；如果經醫師說明後您還有對這個手術（或醫療處置）的任何疑問，請在簽名前再\n與您的醫師充分討論，醫師會很樂意為您解答，讓我們一起為了您的健康努力。\n適應症及作法：（簡述）\n特殊注意事項：檢查前八小時，除必要之藥物外，禁止吃任何食物；糖尿病人可食少量甜食，\n以防血糖過低。有固定服用藥物者，不可自行停藥，可用少許白開水配合藥物服下。\n適應症：被安排作這個檢查的人可能是因為吞嚥困難、胸部上腹部的疼痛、胃酸逆流、噁心\n嘔吐、嚴重消化不良或者糞便上有潛血反應，也可能是在食道、胃部或小腸切除後追蹤術後\n的狀況。\n作法：在開始檢查，會視臨床狀況先給予一小包發泡汽水粉(Effervescent granules)，請配合一\n小杯的開水迅速吞下，此粉末的作用是利用氣體使胃、腸道脹起來以利觀察黏膜的情形。也\n可能由靜脈注射抗腸胃道蠕動針劑(Antispasmodics；Buscopan)，此針劑的作用是為了減少腸\n胃道的蠕動以利觀察黏膜的狀況。接著醫護人員會遞上一杯的腸胃道造影劑（鋇劑或水溶性\n顯影劑），請配合指示飲用，例如請您喝一口含在嘴巴，醫師請您吞下時才可以吞下。檢查過\n程中會請被檢查者在檢查台上會開始平躺、俯臥、側躺或翻轉(體弱者可能需要家屬穿著鉛衣\n從旁協助以策安全)，有時則需要被檢查者配合閉氣，同時以X 光視需要做不等次數之照相。\n只檢查食道、胃及十二指腸者約費時20~30 分鐘，若包括空腸和迴腸者約費時2 小時以上。\n效益：\n1.上消化道攝影檢查可以協助診斷食道、胃、十二指腸、空腸及迴腸的病變，包括阻塞、潰\n瘍、腫瘤等等。\n2.手術/醫療處置成功率：視您可配合檢查的程度(如可否配合吞服汽水粉、閉氣、翻轉等等)、\n病變的大小與位置等因素，上消化道可檢測出病灶的成功率會有相當大的差異。以十二指\n腸潰瘍為例，其偵測到病灶的成功率可能由不到百分之五十至百分之八十以上。再以小腸\n腫瘤為例，小腸攝影可以清楚顯示病灶的機率可能介於百分之三十至百分之四十四之間。\n因此，檢查成功的機率會隨臨床狀況而有所改變，所得到的結果也必須與臨床症狀與其他\n檢查的結果相互參照，才能對您的病情有所幫助。\n風險：\n1.有以下情形的被檢查者不適宜注射胃腸蠕動抑制劑，包括：青光眼、心律不整、或是攝護\n腺肥大等情形，因施打胃腸蠕動抑制劑會使得上述病情加重。如有上列情況，請主動告知\n醫護人員。\n2.吞服鋇劑或水溶性顯影劑時，可能會因為吞嚥不易而嗆入呼吸道中，若發生此狀況時檢查\n醫師會視臨床狀況終止本次檢查。一般而言，呼吸道內嗆入少許鋇劑或水溶性顯影劑也並\n不會造成永久性的傷害。\n編號：55\n國立臺灣大學醫學院附設醫院\nNational Taiwan University Hospital\n上消化道/小腸攝影檢查說明暨同意書\n請詳細閱讀內容，待醫師向您說明後，再簽署同意書第 2 頁\n西元2023 年 12 月15 日病歷委員會修正通過電子病歷版本 MR 19-20-40\n西元2021 年04 月16 日品質暨病人安全委員會審核通過\n文件編號\n01400-4-601370\n版次\n07\n\n病歷號：\n姓名：\n生日：西元年月日\n(上消化道/小腸攝影檢查說明書承上頁)\n3.在檢查後的數日內，糞便可能會因為鋇劑的關係，變成白色或灰色，偶而會有暫時性便秘。\n通常這只需要服用些緩瀉劑就可排除。\n替代方案：\n如果您不想接受此項檢查，請與您的醫師討論是否改由胃鏡檢查、其他影像檢查(如電腦斷\n層攝影)或是暫時採用藥物治療等方式取代。\n如需更改日期，或有其他疑問，請在預約檢查日期前於上班時間來電。\n電話：（02）23562623；上班時間：星期一~星期五：上午8：00～下午5：00。\n醫師補充說明/病人提出之疑問及解釋：（如無，請填寫無）\n說明醫師：（簽章）\n日期：西元年月日時間：時分\n上消化道/小腸攝影檢查同意書\n病人：，出生於西元年月日，需接受上消化道攝影檢查。\n立同意書人已經與醫師討論過接受這個手術或醫療處置的效益、風險及替代方案，對醫師的\n說明都已充分了解且同意由貴院施行該項術式或醫療處置。\n立同意書人姓名：（簽章）\n身分證字號/居留證或護照號碼：\n與病人之關係（請圈選）：本人、配偶、父、母、兒、女、其他：_________\n住址：\n電話：\n日期：西元年月日時間：時分\n(1.如由病人、親屬或關係人簽署本同意書，則無需見證，見證人部分得免填。2.若意識清楚，但無法親自簽具\n者且無親屬或關係人在場，得以按指印代替簽名，惟應有二名見證人。3.若病人意識不清且無親屬或關係人在\n場，醫療緊急情況得由2 名合格醫師在病歷上證明需檢查或治療即可。)\n見證人1：（簽章）見證人2：（簽章）\n見證人1 身分證字號：見證人2 身分證字號：\n日期：西元年月日時間：時分\n臺大醫院暨兒童醫院影像醫學部門診檢查一般說明書\n檢查\n地點\n東址一樓影像醫學部第11 攝影室\n聯絡\n電話\n東址 262623\n一般注意事項\n請務必詳閱各檢查說明書載明注意事項並填妥同意書，按照約定時間攜帶\n預約通知單、檢查同意書、健保卡或身分證明文件提前至各檢查室登記處\n辦理報到、候檢及準備工作，並請禮讓急重症病患。\n立同意書人須年滿十八歲方具法律效力，檢查對象若未滿十八歲，請務必\n由法定代理人簽妥同意書並陪同到院檢查。\n如需更改日期，請於預約檢查日之前持預約檢查通知單至檢查室登記處辦\n理，或與各檢查室登記處聯絡。\n若因天災或其他因素經行政院人事行政總處發布台北市停止上班﹝災防\n假﹞，各項影像醫學部門診檢查請考量自身安全，並擇期於上班日電洽各\n檢查室登記處以利盡速安排檢查時段。\n檢查注意事項\n一、檢查前注意事項：\n1.請詳閱各檢查說明書載名的抽血、清腸或禁食準備，若未準備妥當將\n導致當日檢查無法如期完成。\n2.各項檢查皆可能會更換檢查服，請穿著輕便衣物以利更換。\n二、檢查中注意事項：\n檢查時請務必聽從醫護人員指示，方能維持高品質的檢查以及保護您的\n安全。\n三、檢查後注意事項：\n檢查報告預計將於七個工作天內完成，請按照門診醫師預約回診時間或\n自行預約檢查完七個工作天後回原門診查看結果。\n資料來源\n影像醫學部\n說明書修訂日期\n114 年2 月10 日\n上消化道/小腸攝影檢查\n東\n址\n1F"}, {"code": "056", "title": "下消化道攝影檢查說明暨同意書", "nature": "診斷檢查", "modality": "X光與透視攝影", "body_raw": "消化(胃/腸)", "body_group": "消化系統", "unit": "東址一樓影像醫學部第11攝影室", "campuses": ["東址"], "audience": ["中文一般/成人"], "prep": ["需禁食／空腹", "需清腸／低渣", "使用顯影／造影劑"], "phone": "262623", "rel_path": "pdfs/056_下消化道攝影檢查說明暨同意書.pdf", "pdf_url": "https://www.ntuh.gov.tw/ckfinder_file/OPD/files/DOCEMENT/inst056.pdf", "pages": 5, "text": "國立臺灣大學醫學院附設醫院\nNational Taiwan University Hospital\n下消化道攝影檢查說明暨同意書\n請詳細閱讀內容，待醫師向您說明後，再簽署同意書第 1 頁\n西元2023 年12 月15 日病歷委員會修正通過電子病歷版本 MR 19-20-41\n西元2021 年04 月16 日品質暨病人安全委員會審核通過\n文件編號\n01400-4-601371\n版次\n10 \n病歷號：\n姓名：\n生日：西元年月日\n下消化道攝影檢查說明書\n編號：56\n這份說明書是有關您即將接受的手術（或醫療處置）的效益、風險及替代方案的書面說明，\n可做為您與醫師討論時的補充資料。最重要的是我們希望您能充份瞭解資料的內容，所以請\n仔細閱讀；如果經醫師說明後您還有對這個手術（或醫療處置）的任何疑問，請在簽名前再\n與您的醫師充分討論，醫師會很樂意為您解答，讓我們一起為了您的健康努力。\n一般注意事項：\n1.檢查地點：新院區(東址)一樓大廳後面影像醫學部第11 攝影室。\n2.請於約定時間至檢查地點辦理報到候檢，超過約定時間則視為放棄。\n3.如需更改日期，或有其他疑問，請在預約檢查日期前於上班時間來電。電話：（02）23562623；\n上班時間：星期一~星期五：上午8：00～下午5：00。\n4.檢查時間約需20 分鐘。\n特殊注意事項：\n一、檢查前注意事項：\n1.檢查前三天，禁止吃任何富含肉類、蛋類或蔬菜類之食物。\n2.檢查前三天，食用稀飯或肉渣較少之肉湯。\n3.檢查前二天的睡前，口服清腸劑三顆，並同時每間隔二十分鐘飲用200cc 開水一次，共三\n次。\n4.檢查前一天的睡前(約晚上十點左右) ，再次口服清腸劑三顆，並同時每間隔二十分鐘飲用\n200cc 開水一次，共三次。此後，除必要之藥物外，禁食任何食物。\n5.檢查當天早上起床後，由肛門塞入塞劑型清腸劑一顆，盡量忍耐腸蠕動之不適，於十分鐘\n後，排便二至三次以上以清淨腸道。如須服用藥物或感到口渴，可喝少量開水，並請務必\n準時報到。糖尿病人可食少量甜食，以防血糖過低。\n6.失禁或無法完全控制排便者，請攜帶二至三片紙尿褲前來受檢，以備不時之需。\n二、檢查後注意事項：\n1.檢查後，請喝大量開水，以利鋇劑(不會消化吸收)早日排出。\n2.請於檢查後七天，自行約掛門診或依醫師原預約門診時間看檢查結果。\n三、其他注意事項：\n1.請儘量有家屬陪伴。如有懷孕、藥物過敏、心臟病、青光眼、攝護腺肥大，請先告知檢查\n室醫師及護理師。\n2.三日內有做過大腸、直腸鏡檢查並”切片\"者，請欲受檢者特別注意並避免之 !!\n{參考文獻 : American Journal of Radiology 1982, 139: 693-697}\n國立臺灣大學醫學院附設醫院\nNational Taiwan University Hospital\n下消化道攝影檢查說明暨同意書\n請詳細閱讀內容，待醫師向您說明後，再簽署同意書第 2 頁\n西元2023 年12 月15 日病歷委員會修正通過電子病歷版本 MR 19-20-41\n西元2021 年04 月16 日品質暨病人安全委員會審核通過\n文件編號\n01400-4-601371\n版次\n10 \n病歷號：\n姓名：\n生日：西元年月日\n（下消化道攝影檢查說明書承上頁）\n適應症及作法：（簡述）\n適應症：\n當病人有慢性腹瀉、血便、便秘、腸躁症、無法解釋的體重減輕、排便習慣改變、貧血等症\n狀，或當臨床醫師懷疑在大腸中有潰瘍、發炎、良性腫瘤(如息肉)、癌病變或者某些病變，\n以及做為腸道手術後的追蹤時，醫師將會為您安排這個檢查。\n作法：\n1.檢查前三天開始，依照檢查前注意事項中之指示進行腸道清潔。\n2.檢查前，由護理師將肛管插入肛門。依醫師指示灌入適量之含鋇劑腸道造影劑懸浮液\n(Barium Sulfate suspension)，視需要打入適量空氣並均勻混和及靜脈注射抗腸道蠕動針劑\n(Antispasmodics; Buscopan)。\n3.檢查時，請依醫師指示於檢查臺上做不同姿勢之旋轉及閉氣(體弱者請務必有家屬在旁陪伴\n及協助)，同時用X 光視需要作不同次數之照相。\n效益：\n1.利用X 光檢查範圍包括直腸、乙狀結腸、降結腸、橫結腸、升結腸、盲腸及闌尾，藉由鋇\n劑的襯托，空氣的對比以及利用各種角度的X 光攝影，清楚完整的看到大腸管腔和黏膜的\n變化。\n2.手術/醫療處置成功率：對大於一公分之病灶，診斷成功率約為七成。\n風險：\n1.鋇劑之過敏反應極為罕見。\n2.檢查後可能造成的短暫性便秘。\n3.最嚴重的併發症為腸胃道破裂及鋇劑滲漏至腹膜腔內，發生率約1/25000。大腸破裂而引起\n腹膜炎必須緊急開刀。\n4.其他極為罕見的併發症包括鋇劑進入腸內血管、陰道破裂、門靜脈空氣留存、水中毒、細\n菌感染、腹瀉等。\n5.患有嚴重心臟疾病者，也可能在檢查過程中再次發生心肌梗塞。\n替代方案：\n1.大腸鏡檢查。\n2.電腦斷層檢查。\n3.不實施醫療處置可能的後果：可能延誤您的病情診斷，錯失治療時機。\n醫師補充說明/病人提出之疑問及解釋：（如無，請填寫無）\n說明醫師：（簽章）\n日期：西元年月日時間：時分\n國立臺灣大學醫學院附設醫院\nNational Taiwan University Hospital\n下消化道攝影檢查說明暨同意書\n請詳細閱讀內容，待醫師向您說明後，再簽署同意書第 3 頁\n西元2023 年12 月15 日病歷委員會修正通過電子病歷版本 MR 19-20-41\n西元2021 年04 月16 日品質暨病人安全委員會審核通過\n文件編號\n01400-4-601371\n版次\n10 \n病歷號：\n姓名：\n生日：西元年月日\n下消化道攝影檢查同意書\n病人：，出生於西元年月日，需接受下消化道攝影檢查。\n立同意書人已經與醫師討論過接受這個手術或醫療處置的效益、風險及替代方案，對醫師的\n說明都已充分了解且同意由貴院施行該項術式或醫療處置。\n立同意書人姓名：（簽章）\n身分證字號/居留證或護照號碼：\n與病人之關係（請圈選）：本人、配偶、父、母、兒、女、其他：_________\n住址：\n電話：\n日期：西元年月日時間：時分\n(1.如由病人、親屬或關係人簽署本同意書，則無需見證，見證人部分得免填。2.若意識清楚，但無法親自簽具\n者且無親屬或關係人在場，得以按指印代替簽名，惟應有二名見證人。3.若病人意識不清且無親屬或關係人在\n場，醫療緊急情況得由2 名合格醫師在病歷上證明需檢查或治療即可。)\n見證人1：（簽章）見證人2：（簽章）\n見證人1 身分證字號：見證人2 身分證字號：\n日期：西元年月日\n臺大醫院暨兒童醫院影像醫學部門診檢查一般說明書\n檢查\n地點\n東址一樓影像醫學部第11 攝影室\n聯絡\n電話\n東址 262623\n一般注意事項\n請務必詳閱各檢查說明書載明注意事項並填妥同意書，按照約定時間攜帶\n預約通知單、檢查同意書、健保卡或身分證明文件提前至各檢查室登記處\n辦理報到、候檢及準備工作，並請禮讓急重症病患。\n立同意書人須年滿十八歲方具法律效力，檢查對象若未滿十八歲，請務必\n由法定代理人簽妥同意書並陪同到院檢查。\n如需更改日期，請於預約檢查日之前持預約檢查通知單至檢查室登記處辦\n理，或與各檢查室登記處聯絡。\n若因天災或其他因素經行政院人事行政總處發布台北市停止上班﹝災防\n假﹞，各項影像醫學部門診檢查請考量自身安全，並擇期於上班日電洽各\n檢查室登記處以利盡速安排檢查時段。\n檢查注意事項\n一、檢查前注意事項：\n1. 請詳閱各檢查說明書載名的抽血、清腸或禁食準備，若未準備妥當\n將導致當日檢查無法如期完成。\n2. 各項檢查皆可能會更換檢查服，請穿著輕便衣物以利更換。\n二、檢查中注意事項：\n檢查時請務必聽從醫護人員指示，方能維持高品質的檢查以及保護您\n的安全。\n三、檢查後注意事項：\n檢查報告預計將於七個工作天內完成，請按照門診醫師預約回診時間\n或自行預約檢查完七個工作天後回原門診查看結果。\n資料來源\n影像醫學部\n說明書修訂日期\n114 年2 月10 日\n下消化道攝影檢查\n東\n址\n1F"}, {"code": "057", "title": "乳房攝影檢查注意事項說明書", "nature": "診斷檢查", "modality": "乳房影像與切片", "body_raw": "乳房", "body_group": "乳房", "unit": "東址一樓影像醫學部第9攝影室、健康大樓B1樓", "campuses": ["東址", "健康大樓"], "audience": ["中文一般/成人"], "prep": [], "phone": "262623", "rel_path": "pdfs/057_乳房攝影檢查注意事項說明書.pdf", "pdf_url": "https://www.ntuh.gov.tw/ckfinder_file/OPD/files/DOCEMENT/inst057.pdf", "pages": 3, "text": "號說明書\n臺大醫院乳房攝影檢查注意事項說明書\n57\n檢查\n地點\n新大樓(東址)一樓大廳後面乳房影像中心\n(請詳背面簡要圖示)\n聯絡\n電話\n02-23562623\n一般注意事項\n 請於約定時間至檢查地點辦理報到候檢，超過所約時間視為放棄。\n 如需更改日期，請於預約檢查日之前持預約檢查通知單至檢查單位辦理，或於上\n班時間與檢查單位電話聯絡，否則視同放棄。\n 對說明書內容若有疑問，請向檢查單位人員或聯合服務台洽詢。\n檢查時間約需 30 分鐘。\n特殊注意事項\n一、檢查前注意事項：\n1. 請穿著兩段式服裝前來檢查，以輕便為原則。\n2. 當日檢查地點若為「乳房影像中心」，請至影醫部「第九或十攝影室」插健保\n卡報到取號碼牌，採先報到先作，請於現場耐心等候。\n二、檢查中注意事項：\n檢查時需除去上半身衣物，並以局部加壓器加壓 4~15 公斤於受檢部位，可能稍\n有不適，請盡量配合醫護人員的指導，以得到最清晰的影像。\n三、檢查後注意事項：\n自行約掛門診或依醫師原預約門診時間看檢查結果。\n四、其他注意事項：\n若為乳房細針穿刺、組織切片或乳管攝影，則需時較久，約需六十分鐘。\n(請翻閱背面)\n資\n料\n來\n源\n影像醫學部\n繪\n圖\n工務室\n說明書修訂日期\n113 年 5 月 2 日\n乳房攝影檢查\n報到\n東\n址\n1F\n57 號說明書\n臺大醫院乳房攝影檢查地點簡要圖示\n健康大樓B1F 示意圖\n中山南路12 號\n請至健康大樓1F 搭乘電梯或電扶梯至\nB1F 乳房攝影室"}, {"code": "058", "title": "小兒上消化道及小腸攝影說明暨同意書", "nature": "診斷檢查", "modality": "X光與透視攝影", "body_raw": "消化(胃/腸)", "body_group": "消化系統", "unit": "兒醫大樓三樓影像醫學部", "campuses": ["兒醫大樓"], "audience": ["小兒專用"], "prep": ["需禁食／空腹", "使用顯影／造影劑"], "phone": "270323", "rel_path": "pdfs/058_小兒上消化道及小腸攝影說明暨同意書.pdf", "pdf_url": "https://www.ntuh.gov.tw/ckfinder_file/OPD/files/DOCEMENT/inst058.pdf", "pages": 4, "text": "國立臺灣大學醫學院附設醫院\nNational Taiwan University Hospital\n小兒上消化道及小腸攝影說明暨同意書\n請詳細閱讀內容，待醫師向您說明後，再簽署同意書第 1 頁\n西元2023 年12 月15 日病歷委員會修正通過電子病歷版本 MR 19-20-42\n西元2021 年08 月20 日品質暨病人安全委員會審核通過\n文件編號\n01400-4-601372\n版次\n06\n病歷號：\n姓名：\n生日：西元年月日\n\n小兒上消化道及小腸攝影說明書\n編號：58\n這份說明書是有關您即將接受的檢查（或醫療處置）的效益、風險及替代方案的書面說明，\n可做為您與醫師討論時的補充資料。最重要的是我們希望您能充份瞭解資料的內容，所以請\n仔細閱讀；如果經醫師說明後您還有對這個檢查（或醫療處置）的任何疑問，請在簽名前再\n與您的醫師充分討論，醫師會很樂意為您解答，讓我們一起為了您的健康努力。\n一般注意事項：\n★請於約定時間至檢查地點辦理報到候檢，超過所約時間視為放棄。\n★如臨時因故需更改日期，請於上班時間(星期一至星期五，早上9-12 時；下午1-5 時不包\n含國定假日)與檢查單位聯絡(分機270323)。\n★無法配合的受檢兒童請由家屬陪同前來協助檢查。\n★對說明書內容若有疑問，請於上班時間向診間或檢查單位人員電話 (分機270323) 聯絡。\n特殊注意事項：\n一、檢查前注意事項：\n二歲以下：檢查前四小時禁食。\n二歲以上：檢查前日午夜之後禁食。\n二、檢查中注意事項：\n需要請家屬在旁協助檢查，請盡量與醫護人員合作。\n三、檢查後注意事項：\n請於檢查後三天，自行約掛門診或依醫師原預約門診時間看檢查結果。\n適應症及作法：（簡述）\n適應症：胃食道逆流、腸扭轉不良、胃及腸道結構異常等疾病。\n作法：讓受檢之小兒喝入顯影劑，配合醫師指示左右翻轉身體，檢查過程中須由家長在檢查\n室內陪同小兒受檢，以確保安全。\n效益：\n藉由此項檢查，我們可以確定是否有胃食道逆流、腸扭轉不良、胃及腸道結構異常等疾\n病，以決定之後治療的步驟。\n手術/醫療處置成功率：超過九成。\n風險：\n小兒進食顯影劑不慎嗆入因而導致吸入性肺炎、呼吸道阻塞等並不常見，發生機率低於百\n分之一。另外，依據過往的文獻統計，幾乎沒有發生致死的併發症。\n參考文獻: Medicine, 2017, 96.47.\n替代方案：\n胃鏡：其侵入性較消化道攝影高，請與醫師討論您的決定。\n國立臺灣大學醫學院附設醫院\nNational Taiwan University Hospital\n小兒上消化道及小腸攝影說明暨同意書\n請詳細閱讀內容，待醫師向您說明後，再簽署同意書第 2 頁\n西元2023 年12 月15 日病歷委員會修正通過電子病歷版本 MR 19-20-42\n西元2021 年08 月20 日品質暨病人安全委員會審核通過\n文件編號\n01400-4-601372\n版次\n06\n病歷號：\n姓名：\n生日：西元年月日\n\n醫師補充說明/病人提出之疑問及解釋：（如無，請填寫無）\n說明醫師：（簽章）\n日期：西元年月日時間：時分\n小兒上消化道及小腸攝影同意書\n病人：，出生於西元年月日，需接受小兒上消化道及小腸\n攝影檢查。立同意書人已經與醫師討論過接受這個手術或醫療處置的效益、風險及替代方案，\n對醫師的說明都已充分了解且同意由貴院施行該項術式或醫療處置。\n立同意書人姓名：（簽章）\n身分證字號/居留證或護照號碼：\n與病人之關係（請圈選）：本人、配偶、父、母、兒、女、其他：_________\n住址：\n電話：\n日期：西元年月日時間：時分\n(1.如由病人、親屬或關係人簽署本同意書，則無需見證，見證人部分得免填。2.若意識清楚，但無法親自簽具\n者且無親屬或關係人在場，得以按指印代替簽名，惟應有二名見證人。3.若病人意識不清且無親屬或關係人在\n場，醫療緊急情況得由2 名合格醫師在病歷上證明需檢查或治療即可。)\n見證人1：（簽章）見證人2：（簽章）\n見證人1 身分證字號：見證人2 身分證字號：\n日期：西元年月日時間：時分\n臺大醫院暨兒童醫院影像醫學部門診檢查一般說明書\n檢查\n地點\n兒醫大樓三樓影像醫學部\n聯絡\n電話\n兒醫 270323\n一般注意事項\n請務必詳閱各檢查說明書載明注意事項並填妥同意書，按照約定時間攜帶\n預約通知單、檢查同意書、健保卡或身分證明文件提前至各檢查室登記處\n辦理報到、候檢及準備工作，並請禮讓急重症病患。\n立同意書人須年滿十八歲方具法律效力，檢查對象若未滿十八歲，請務必\n由法定代理人簽妥同意書並陪同到院檢查。\n如需更改日期，請於預約檢查日之前持預約檢查通知單至檢查室登記處辦\n理，或與各檢查室登記處聯絡。\n若因天災或其他因素經行政院人事行政總處發布台北市停止上班﹝災防\n假﹞，各項影像醫學部門診檢查請考量自身安全，並擇期於上班日電洽各\n檢查室登記處以利盡速安排檢查時段。\n檢查注意事項\n一、檢查前注意事項：\n1. 請詳閱各檢查說明書載名的抽血、清腸或禁食準備，若未準備妥當\n將導致當日檢查無法如期完成。\n2. 各項檢查皆可能會更換檢查服，請穿著輕便衣物以利更換。\n二、檢查中注意事項：\n檢查時請務必聽從醫護人員指示，方能維持高品質的檢查以及保護您\n的安全。\n三、檢查後注意事項：\n檢查報告預計將於七個工作天內完成，請按照門診醫師預約回診時間\n或自行預約檢查完七個工作天後回原門診查看結果。\n資料來源\n影像醫學部\n說明書修訂日期\n114 年2 月10 日\n小兒上消化道及小腸攝影檢查\n兒醫\n3F"}, {"code": "059", "title": "小兒泌尿道攝影檢查說明暨同意書", "nature": "診斷檢查", "modality": "X光與透視攝影", "body_raw": "泌尿(腎、膀胱、尿路)", "body_group": "泌尿(腎、膀胱、尿路)", "unit": "兒醫大樓三樓影像醫學部", "campuses": ["兒醫大樓"], "audience": ["小兒專用"], "prep": ["需清腸／低渣", "使用顯影／造影劑", "需驗腎功能 (Cre)"], "phone": "270323", "rel_path": "pdfs/059_小兒泌尿道攝影檢查說明暨同意書.pdf", "pdf_url": "https://www.ntuh.gov.tw/ckfinder_file/OPD/files/DOCEMENT/inst059.pdf", "pages": 4, "text": "國立臺灣大學醫學院附設醫院\nNational Taiwan University Hospital\n小兒泌尿道攝影檢查說明暨同意書\n請詳細閱讀內容，待醫師向您說明後，再簽署同意書第1頁\n西元2023 年12 月15 日病歷委員會修正通過電子病歷版本 MR 19-33\n西元2021 年04 月16 日品質暨病人安全委員會審核通過\n文件編號\n01400-4-601344\n版次\n08 \n病歷號：\n姓名：\n生日：西元年月日\n小兒泌尿道攝影檢查說明書\n編號：59\n適應症及作法：（簡述）\n適應症：經臨床醫師評估認為病情有需要者。\n※一般注意事項：\n★請於約定時間攜帶本說明書及同意書至檢查地點辦理報到候檢，超過所約時間視為放棄。\n★如需更改日期，請於預約檢查日之前一日持預約檢查通知單至檢查單位辦理，或與檢查單位\n電話（02-23123456 分機270323）聯絡，否則視同放棄（改期以一次為限）。\n※特殊注意事項：\n一、檢查前注意事項：請於檢查前清腸，以利攝影及影像判讀。\n1.一至六個月嬰兒：檢查前三小時停止一切進食。\n2.六至十二個月嬰兒：檢查前三小時停止一切進食，並使用半顆甘油球(glycerin)灌腸，請將甘\n油球放進肛門內保持半小時後再如廁。\n3.一至四歲幼兒：檢查前二十四小時只可進食液體或低渣飲食，檢查前三小時停止一切進食，\n並使用半顆塞劑型清腸劑灌腸，請將栓劑放進肛門內保持半小時後再如廁。\n4.四歲以上兒童：檢查前二十四小時只可進食液體或低渣飲食，臨睡前以開水連同一粒口服劑\n型瀉藥服下。檢查前三小時停止一切進食，並使用半顆塞劑型清腸劑灌腸，請將栓劑放進肛\n門內保持半小時後再如廁。\n5.本檢查需注射顯影劑。由於本檢查所使用之含碘顯影劑可能造成腎功能不良之病人進一步腎\n功能損傷，檢查前一日須備有三個月內腎功能指數，即血清肌酸酐(Creatinine)值，請務必於\n受檢前三個月內完成抽血檢查。不便至本院檢驗者，可攜帶三個月內其他醫院或醫事檢驗機\n構之血清肌酸酐(Creatinine)正式報告於受檢當天供參考。住院及急診病人，若依醫師判斷其\n病情可能導致急性腎功能惡化者，建議於檢查前短期內再次確認血清肌酸酐值。\n二、檢查後注意事項：\n1.檢查後，請多喝開水，以利造影劑之儘快由小便排出。\n2.請於檢查後七天，自行約掛門診或依醫師預約門診時間看檢查結果。\n三、其他注意事項：\n1.必須有家屬陪伴。如有懷孕、藥物過敏病史、心臟病、腎臟病，請先告知檢查室醫師及護理\n師。\n2.天冷可著衛生衣褲，但不可有金屬釦子或拉鍊。\n效益：\n本檢查可提供臨床醫師所需之診斷資訊。在病人可配合之情況下，失敗率小於1%。\n風險：\n本檢查須經靜脈注入含碘之造影劑，由於本身特異體質而對含碘之造影劑產生不良反應者，\n國立臺灣大學醫學院附設醫院\nNational Taiwan University Hospital\n小兒泌尿道攝影檢查說明暨同意書\n請詳細閱讀內容，待醫師向您說明後，再簽署同意書第2頁\n西元2023 年12 月15 日病歷委員會修正通過電子病歷版本 MR 19-33\n西元2021 年04 月16 日品質暨病人安全委員會審核通過\n文件編號\n01400-4-601344\n版次\n08 \n病歷號：\n姓名：\n生日：西元年月日\n其相關之副作用，如噁心、嘔吐、異物嗆入及吸入性肺炎、皮膚紅斑、蕁麻疹、腎功能受損\n甚至須接受透析治療、支氣管攣縮，喉部水腫及呼吸困難、血壓驟降、心跳停止、休克，甚\n至死亡，死亡率據文獻報告有一萬二千分之一。而有過敏病史者其機率為常人之二倍。\n替代方案：\n如電腦斷層攝影或泌尿道超音波…等，如有任何疑問，請向您的臨床醫師諮詢。\n醫師補充說明/病人提出之疑問及解釋：（如無，請填寫無）\n說明醫師：（簽章）\n日期：西元年月日時間：時分\n小兒泌尿道攝影檢查同意書\n病人：，出生於西元年月日，需接受小兒泌尿道攝影檢查。\n立同意書人已經與醫師討論過接受這個手術或醫療處置的效益、風險及替代方案，對醫師的\n說明都已充分了解且同意由貴院施行該項術式或醫療處置。\n立同意書人姓名：（簽章）\n身分證字號/居留證或護照號碼：\n與病人之關係（請圈選）：本人、配偶、父、母、兒、女、其他：_________\n住址：\n電話：\n日期：西元年月日時間：時分\n(1.如由病人、親屬或關係人簽署本同意書，則無需見證，見證人部分得免填。2.若意識清楚，但無法親自簽具\n者且無親屬或關係人在場，得以按指印代替簽名，惟應有二名見證人。3.若病人意識不清且無親屬或關係人在\n場，醫療緊急情況得由2 名合格醫師在病歷上證明需檢查或治療即可。)\n見證人1：（簽章）見證人2：（簽章）\n見證人1 身分證字號：見證人2 身分證字號：\n日期：西元年月日時間：時分\n臺大醫院暨兒童醫院影像醫學部門診檢查一般說明書\n檢查\n地點\n兒醫大樓三樓影像醫學部\n聯絡\n電話\n兒醫 270323\n一般注意事項\n請務必詳閱各檢查說明書載明注意事項並填妥同意書，按照約定時間攜帶\n預約通知單、檢查同意書、健保卡或身分證明文件提前至各檢查室登記處\n辦理報到、候檢及準備工作，並請禮讓急重症病患。\n立同意書人須年滿十八歲方具法律效力，檢查對象若未滿十八歲，請務必\n由法定代理人簽妥同意書並陪同到院檢查。\n如需更改日期，請於預約檢查日之前持預約檢查通知單至檢查室登記處辦\n理，或與各檢查室登記處聯絡。\n若因天災或其他因素經行政院人事行政總處發布台北市停止上班﹝災防\n假﹞，各項影像醫學部門診檢查請考量自身安全，並擇期於上班日電洽各\n檢查室登記處以利盡速安排檢查時段。\n檢查注意事項\n一、檢查前注意事項：\n1. 請詳閱各檢查說明書載名的抽血、清腸或禁食準備，若未準備妥當\n將導致當日檢查無法如期完成。\n2. 各項檢查皆可能會更換檢查服，請穿著輕便衣物以利更換。\n二、檢查中注意事項：\n檢查時請務必聽從醫護人員指示，方能維持高品質的檢查以及保護您\n的安全。\n三、檢查後注意事項：\n檢查報告預計將於七個工作天內完成，請按照門診醫師預約回診時間\n或自行預約檢查完七個工作天後回原門診查看結果。\n資料來源\n影像醫學部\n說明書修訂日期\n114 年2 月10 日\n小兒泌尿道攝影檢查\n兒醫\n3F"}, {"code": "060", "title": "小兒下消化道攝影說明暨同意書", "nature": "診斷檢查", "modality": "X光與透視攝影", "body_raw": "消化(胃/腸)", "body_group": "消化系統", "unit": "兒醫大樓三樓影像醫學部", "campuses": ["兒醫大樓"], "audience": ["小兒專用"], "prep": ["需清腸／低渣", "使用顯影／造影劑"], "phone": "270323", "rel_path": "pdfs/060_小兒下消化道攝影說明暨同意書.pdf", "pdf_url": "https://www.ntuh.gov.tw/ckfinder_file/OPD/files/DOCEMENT/inst060.pdf", "pages": 4, "text": "國立臺灣大學醫學院附設醫院\nNational Taiwan University Hospital\n小兒下消化道攝影說明暨同意書\n請詳細閱讀內容，待醫師向您說明後，再簽署同意書第 1 頁\n西元2023 年12 月15 日病歷委員會修正通過電子病歷版本 MR 19-20-43\n西元2021 年04 月16 日品質暨病人安全委員會審核通過\n文件編號\n01400-4-601373\n版次\n06\n\n病歷號：\n姓名：\n生日：西元年月日\n小兒下消化道攝影說明書\n這份說明書是有關您即將接受的檢查（或醫療處置）的效益、風險及替代方案的書面說\n明，可做為您與醫師討論時的補充資料。最重要的是我們希望您能充份瞭解資料的內容，所\n以請仔細閱讀；如果經醫師說明後您還有對這個檢查（或醫療處置）的任何疑問，請在簽名\n前再與您的醫師充分討論，醫師會很樂意為您解答，讓我們一起為了您的健康努力。\n一般注意事項：\n★請於約定時間至檢查地點辦理報到候檢，超過所約時間視為放棄。\n★如臨時因故需更改日期，請於上班時間(星期一至星期五，早上9-12 時；下午1-5 時不包含\n國定假日)與檢查單位聯絡(分機270323)。\n★請由家屬陪同前來協助檢查。\n★對說明書內容若有疑問，請於上班時間向診間或檢查單位人員電話 (分機270323) 聯絡。\n特殊注意事項：\n一、檢查前注意事項：\n一至六個月：檢查前三小時停止一切進食。\n六至十二個月：檢查前三小時停止一切進食，檢查前三小時使用半顆甘油球(glycerin)灌腸(藥\n放進肛門內保持半小時後如廁)。\n一至四歲：檢查前二十四小時只可進食液體，檢查前三小時停止一切進食，檢查前三小時使用\n半顆栓劑(Dulcolax Supp 5mg)灌腸(藥放進肛門內保持半小時後如廁)。\n四歲以上：檢查前二十四小時只可進食液體，臨睡前以開水連同一粒瀉藥(Dulcolax 5mg) 服下。\n檢查前三小時停止一切進食，並使用半顆栓劑(Dulcolax Supp 5mg)灌腸(藥放進肛門內保持半\n小時後如廁)。\n例外：疑似巨腸症的小朋友，檢查前不須特別灌腸；疑似急性潰瘍性結腸炎的小朋友，檢查前\n二十四小時只可進食液體，不需特別灌腸。\n二、檢查中注意事項：\n請家屬在旁協助檢查，並盡量與醫護人員合作\n三、檢查後注意事項：\n請於檢查後三個工作天，按回診時間自行約掛門診看檢查結果。。\n適應症及作法：（簡述）\n適應症：巨腸症、急性潰瘍性結腸炎、大腸結構異常等疾病。\n作法：將一細小塑膠軟管置入肛門，依醫師指示灌入適量含鋇劑腸道造影劑懸浮液(不會被人\n體吸收、會隨糞便排出)。檢查過程中須由家長在檢查室內陪同小兒受檢，以確保安全。\n效益：\n藉由此項檢查，我們可以確定是否有巨腸症、急性潰瘍性結腸炎、大腸結構異常等疾病，以決\n定之後治療的方向及步驟。\n手術/醫療處置成功率：超過九成。\n編號：60\n國立臺灣大學醫學院附設醫院\nNational Taiwan University Hospital\n小兒下消化道攝影說明暨同意書\n請詳細閱讀內容，待醫師向您說明後，再簽署同意書第 2 頁\n西元2023 年12 月15 日病歷委員會修正通過電子病歷版本 MR 19-20-43\n西元2021 年04 月16 日品質暨病人安全委員會審核通過\n文件編號\n01400-4-601373\n版次\n06\n\n病歷號：\n姓名：\n生日：西元年月日\n風險：\n腸穿孔、破裂，導致腹膜炎。(發生機率0.02-0.1%)\n參考文獻: Current Problem of Diagnostic Radiology 1991 Jul-Aug;20(4):123-51.\n替代方案：\n可以大腸鏡替代，惟其侵入性較消化道攝影高，請與醫師討論您的決定。\n醫師補充說明/病人提出之疑問及解釋：（如無，請填寫無）\n說明醫師：（簽章）\n日期：西元年月日時間：時分\n小兒下消化道攝影說明暨同意書\n病人：，出生於西元年月日，需接受小兒下消化道攝影檢\n查。立同意書人已經與醫師討論過接受這個手術或醫療處置的效益、風險及替代方案，對醫\n師的說明都已充分了解且同意由貴院施行該項術式或醫療處置。\n立同意書人姓名：（簽章）\n身分證字號/居留證或護照號碼：\n與病人之關係（請圈選）：本人、配偶、父、母、兒、女、其他：_________\n住址：\n電話：\n日期：西元年月日時間：時分\n(1.如由病人、親屬或關係人簽署本同意書，則無需見證，見證人部分得免填。2.若意識清楚，但無法親自簽具\n者且無親屬或關係人在場，得以按指印代替簽名，惟應有二名見證人。3.若病人意識不清且無親屬或關係人在\n場，醫療緊急情況得由2 名合格醫師在病歷上證明需檢查或治療即可。)\n見證人1：（簽章）見證人2：（簽章）\n見證人1 身分證字號：見證人2 身分證字號：\n日期：西元年月日時間：時分\n臺大醫院暨兒童醫院影像醫學部門診檢查一般說明書\n檢查\n地點\n兒醫大樓三樓影像醫學部\n聯絡\n電話\n兒醫 270323\n一般注意事項\n請務必詳閱各檢查說明書載明注意事項並填妥同意書，按照約定時間攜帶\n預約通知單、檢查同意書、健保卡或身分證明文件提前至各檢查室登記處\n辦理報到、候檢及準備工作，並請禮讓急重症病患。\n立同意書人須年滿十八歲方具法律效力，檢查對象若未滿十八歲，請務必\n由法定代理人簽妥同意書並陪同到院檢查。\n如需更改日期，請於預約檢查日之前持預約檢查通知單至檢查室登記處辦\n理，或與各檢查室登記處聯絡。\n若因天災或其他因素經行政院人事行政總處發布台北市停止上班﹝災防\n假﹞，各項影像醫學部門診檢查請考量自身安全，並擇期於上班日電洽各\n檢查室登記處以利盡速安排檢查時段。\n檢查注意事項\n一、檢查前注意事項：\n1. 請詳閱各檢查說明書載名的抽血、清腸或禁食準備，若未準備妥當將\n導致當日檢查無法如期完成。\n2. 各項檢查皆可能會更換檢查服，請穿著輕便衣物以利更換。\n二、檢查中注意事項：\n檢查時請務必聽從醫護人員指示，方能維持高品質的檢查以及保護您的\n安全。\n三、檢查後注意事項：\n檢查報告預計將於七個工作天內完成，請按照門診醫師預約回診時間或\n自行預約檢查完七個工作天後回原門診查看結果。\n資料來源\n影像醫學部\n說明書修訂日期\n114 年2 月10 日\n小兒下消化道攝影檢查\n兒醫\n3F"}, {"code": "064", "title": "影像醫學部骨質密度測定檢查注意事項說明書", "nature": "診斷檢查", "modality": "X光與透視攝影", "body_raw": "骨骼肌肉", "body_group": "骨骼肌肉", "unit": "西址一樓影像醫學部骨質密度檢查室、東址影像醫學部一樓影像中心骨質密度測定檢查室", "campuses": ["東址", "西址"], "audience": ["中文一般/成人"], "prep": ["含麻醉或鎮靜"], "phone": "262810、262623", "rel_path": "pdfs/064_影像醫學部骨質密度測定檢查注意事項說明書.pdf", "pdf_url": "https://www.ntuh.gov.tw/ckfinder_file/OPD/files/DOCEMENT/inst064.pdf", "pages": 3, "text": "64 號說明書\n臺大醫院影像醫學部骨質密度測定檢查注意事項說明書\n檢查\n地點\n1.舊大樓(西址)影像醫學部一樓骨質密度檢查室\n2.新大樓(東址)影像醫學部一樓影像中心骨質密度測定檢查室\n聯絡\n電話\n02-23562810\n02-23562623\n一般注意事項\n請於約定日期及時間至西址一樓影像醫學部登記處或東址影像中心報到。\n1. 當日檢查地點若為「西址影像醫學部一樓骨質密度檢查室」，請至影醫部「西址一樓影像\n醫學部登記處」依應到時間辦理報到並依序檢查。\n2. 當日檢查地點若為「影像中心」，請至「影像中心骨質密度檢查室」自動報到機依應到時\n間辦理報到並依序檢查。\n報到完畢後，再前往影像醫學部“骨質密度檢查室”。\n如需更改日期，或有任何疑問，請於預約檢查日之前持預約檢查通知單至檢查單位辦理，或於\n上班時間與檢查單位電話聯絡，否則視同放棄。\n檢查時間約為30 分鐘。\n特殊注意事項\n一、檢查前注意事項：\n1.剛做過口服鋇劑(如上消化道或大腸X 光攝影等)之檢查者請安排於一星期後再做本檢查。\n2.本檢查前不需禁食。\n3.請穿著無金屬鈕釦之輕便服裝。\n二、檢查中注意事項：\n掃描中不可亂動。若小孩或病患無法合作者，請事先給予鎮靜。\n三、檢查後注意事項：\n自行約掛門診或依醫師原預約門診時間看檢查結果。\n四、其他注意事項：無。\n資料來源\n影像醫學部\n繪圖\n工務室\n說明書修訂日期\n113 年05 月02 日\n骨質密度測定檢查\n東\n址\n1F\n骨\n質\n密\n度\n測\n定\n檢\n查\n西址1F"}, {"code": "072", "title": "影像醫學部腹部超音波檢查注意事項說明書", "nature": "診斷檢查", "modality": "超音波檢查", "body_raw": "消化(腹)", "body_group": "消化系統", "unit": "東址一樓樓超音波A區", "campuses": ["東址"], "audience": ["中文一般/成人"], "prep": ["需禁食／空腹"], "phone": "265815", "rel_path": "pdfs/072_影像醫學部腹部超音波檢查注意事項說明書.pdf", "pdf_url": "https://www.ntuh.gov.tw/ckfinder_file/OPD/files/DOCEMENT/inst072.pdf", "pages": 2, "text": "72 號說明書\n台大醫院影像醫學部腹部超音波檢查注意事項說明書\n檢查\n地點\n新院區(東址)一樓超音波A 區\n(請詳背面簡要圖示)\n聯絡\n電話\n23123456 轉65815\n一般注意事項\n請於約定日期及時間至東址超音波A 區報到。\n如需更改日期，請於預約檢查日之前二日持預約檢查通知單至檢查單位辦理，或\n與檢查單位電話聯絡，否則視同放棄。\n對說明書內容若有疑問，請向診間或檢查單位人員洽詢。\n¥檢查時間依病情程度約需10~30 分鐘。\n特殊注意事項\n一、檢查前注意事項：\n1.檢查前請禁食六小時(可以喝開水)，平日藥物可正常服用。\n2.受檢當日請穿寬鬆之上下二截式服裝。\n二、檢查中注意事項：\n請配合醫師指示做腹式呼吸。\n三、檢查後注意事項：\n請於檢查後後七天，自行約掛門診或依醫師原預約門診時間看檢查結果。\n四、其他注意事項：\n無。\n(請翻閱背面)\n資料來源\n影像醫學部\n繪圖\n工務室\n說明書修訂日期\n99 年01 月15 日\n72 號說明書\n台大醫院影像醫學部腹部超音波檢查注意事項說明書\n新院區一樓位置圖"}, {"code": "073", "title": "磁振造影檢查說明暨同意書", "nature": "診斷檢查", "modality": "MRI 磁振造影", "body_raw": "全身", "body_group": "全身", "unit": "東址一樓磁振造影室、西址一樓磁振造影室、兒童醫院三樓磁振造影室", "campuses": ["東址", "西址", "兒醫大樓"], "audience": ["中文一般/成人"], "prep": ["需禁食／空腹", "使用顯影／造影劑", "需驗腎功能 (Cre)", "含麻醉或鎮靜"], "phone": "262540、262636、270323", "rel_path": "pdfs/073_磁振造影檢查說明暨同意書.pdf", "pdf_url": "https://www.ntuh.gov.tw/ckfinder_file/OPD/files/DOCEMENT/inst073.pdf", "pages": 8, "text": "國立臺灣大學醫學院附設醫院\n歷\n號名日\n病姓生\nNationaI Taiwan University HospitaI\n磁振造影檢查說明暨同意書\n第1頁\n請詳細閱讀內容,待醫師向您說明後,再簽署同意書\n磁振造影檢查說明書\n編號: 73\n適應症及作法: (簡述)\n適應症:協助臨床醫師診斷、追蹤病灶與評估治療效果\n* 請於預約當天約定時間提早10分鐘,持原預約單至檢查室(東址:新大樓一樓影\n像醫學部磁振造影檢查室,西址:舊大樓一樓磁振造影檢查室,兒醫:兒童醫院大樓\n三樓磁振掃描攝影室)辦理報到候檢,超過所約時間視為放棄。\n* 如需更改日期,或有其他疑問,請於預約檢查日期前之上班時間來電\n上班時間:星期一 ~ 五:上午8 : 00 ~ 下午5 : 00。新(東)址電話:\n( 02 ) 23562540 ;舊(西)址電話: ( 02 ) 23562636 ;兒醫電話: ( 02 ) 23123456\n分機270323。\n* 立同意書人須年滿十八歲方具法律效力,檢查對象若未滿十八歲,請務必由法定代\n理人簽妥同意書並陪同到院檢查。若因天災或其他因素經行政院人事行政總處發布台\n北市停止上班災防假〕,當日排定之檢查亦將同步取消,請擇期於上班日電洽各檢\n查室登記處以利儘速重新安排檢查時段。\n特殊注意事項:\n、檢查前一天:\n嬰幼兒於檢查前一日至少減少一半以上睡眠時間,以便於檢查時實施簡易鎮靜入\n睡(成人不必)。根據美國麻醉醫學會的建議,若服用母乳建議至少空腹4小時,若\n服用嬰兒配方奶粉建議至少空腹6小時,若服用固體食物建議至少空腹8小時。\n、檢查當天:\n1.如檢查範圍為腹部或骨盆腔者,請禁食、禁水至少6小時;不能合作須接受鎮\n靜者,必需禁食至少6小時,其他病人則不必禁食,亦不需停服日常藥物。\n2 · 請勿使用化妝品以及髮油等造型品、以避免檢查過程中出現皮膚不適及干擾影\n像。\n3 · 貴重物品,金屬飾物(如:髮飾、髮夾) ,磁性物質(如:金融卡、磁碟片)請\n勿攜入檢查室\n4 · 做過心臟或血管手術,裝有心律調節器,動脈瘤金屬夾,氣切造口金屬管,或體\n內裝置骨釘或金屬鋼片等體內有金屬植入物之患者,應先告知檢查室醫護人員。\n5 · 曾對造影劑發生過敏或不良反應、中度至末期腎臟病人、拒絕接受造影劑注射之\n患者,應先告知檢查室醫護人員。\n6 · 請填妥本「磁振造影檢查說明暨同意書」並交給檢查室醫護人員\n、如病情需要,須注射含釓(GadoIinium)之造影劑以利病灶之顯見。醫護人員會\n為您先施打靜脈軟針,並以生理食鹽水注射,以檢查注射血管之通暢性。但仍有少數\n病人,會於開始施打顯影劑後,產生造影劑滲漏至皮下組織或肌肉(機率約\n0 · 7 % ) ,而致產生局部紅腫、疼痛之現象。皮下腫痛會在數日後隨造影劑吸收而\n消失,但亦有少數人出現嚴重發炎、潰瘍、及局部神經壓迫反應,而需接受住院觀\n察、外科處置或植皮。\n四、請於檢查後七天,自行約掛原來門診或依醫師原預約門診時間看檢查結果。\n效益:\n在病人可配合之情況下,失敗率小於1 % ,但依照檢查部位及方式不同可能有些微差\n西元2025年09月11日病歷委員會修正通過電子病歷版本 MR 19一22\n西元2025年09月02日品質暨病人安全委員會審核通過\n國立臺灣大學醫學院附設醫院\n歷\n號名日\n病姓生\nNationaI Taiwan University HospitaI\n磁振造影檢查說明暨同意書\n第2頁\n請詳細閱讀內容,待醫師向您說明後,再簽署同意書\n風險:\n1.如病情需要,須注射含釓(GadoIinium)之造影劑以利病灶之顯見。此造影劑為水\n溶性不含碘,因本身體質特異而對此造成造影劑產生不良反應如蕁麻疹、嘔吐、抽\n筋、頭痛、噁心等其機率約為萬分之二(二百萬人次之統計) ,僅有極少數案例因藥\n物過敏或腎源性系統性纖維化/腎源性纖維性皮膚病變( Nephrogenic systemic\nf i bros i s , NSF / Nephrogenic f i brosi ng dormopathy, NFD )而致死\n2 · 針對腎臟功能不良,急性腎損傷,接受任何形式的透析治療,嚴重慢性腎病變或末\n期慢性腎病變,血清肌酸酐( Creatinine)數值等於或大於2 · 0mg/d 或腎絲球過\n濾率(eGFR) <30mL/min/1. 73 m 之受檢者,無論是否正在接受洗腎,為腎源性系統性\n纖維化/腎源性纖維性皮膚病變風險暴露,皆不建議施打第三類含釓( gadolinium )造影\n劑,請再與您的醫師討論。\n3 · 若使用第二類類含釓( gadolinium )造影劑者,腎源性系統性纖維化/腎源性纖維性皮\n膚病變風險足夠低,甚至不存在,只要靜脈注射不超過標準劑量,不受腎功能影響。\n4 · 哺乳期婦女接受含釓(Gadolinium)之造影劑之後哺乳,乳汁中將暫時含有釓,但\n不會被腸道吸收,一般建議可持續哺乳,若您有疑慮,可於施打造顯劑24小時後再\n進行哺乳\n替代方案:\n依病灶之特性不同,尚有其他影像學之替代方案如電腦斷層、超音波 ·\n· 等檢查\n,如\n有疑問,請與您的臨床醫師討論。\n醫師補充說明/病人提出之疑問及解釋: (如無,請填寫無)\n兌明醫師:\n時間:\n日期:西元\n日\n西元2025年09月11日病歷委員會修正通過電子病歷版本 MR 19一22\n西元2025年09月02日品質暨病人安全委員會審核通過\n國立臺灣大學醫學院附設醫院\n歷\n號名日\n病姓生\nNationaI Taiwan University HospitaI\n磁振造影檢查說明暨同意書\n第3頁\n請詳細閱讀內容,待醫師向您說明後,再簽署同意書\n磁振造影檢查同意書\n日,需接受磁振造影\n,出生於西元\n病人:\n檢查。立同意書人已經與醫師討論過接受這個手術或醫療處置的效益、風險及替\n代方案,對醫師的說明都已充分了解且同意由貴院施行該檢查\n磁、土杏宀\n、磁性\n、豕杏\n吅,請詢問檢杏室人員\n囗無下列體內裝置人工物件。\n有下列不可去除之體內裝置人工物件:\n囗律調節器/調節器導線(要事先與廠商聯絡,當天可能需要設定體內裝置)\n囗植入式神經刺激器或導線(要事先與廠商聯絡,當天可能需要設定體內裝置)\n囗顱內動脈瘤血管夾\n囗動脈止血夾\n囗人工電子耳\n囗電極\n(簽章)\n立同人姓名:\n身分證字號/居留證或護照號碼 ·\n與病人之關係(請圈選) :本人、配偶、父、母、兒、女、其他:\n住址:\n電話:\n年\n時間:\n日期:西元\n月\n日\n西元2025年09月11日病歷委員會修正通過電子病歷版本 MR 19一22\n西元2025年09月02日品質暨病人安全委員會審核通過\n國立臺灣大學醫學院附設醫院\n歷\n號名日\n病姓生\nNationaI Taiwan University HospitaI\n磁振造影檢查說明暨同意書\n請詳細閱讀內容,待醫師向您說明後,再簽署同意書第4頁\n( l.如由病人、親屬或關係人簽署本同意書,則無需見證,見證人部分得免填。2.若意識清楚,但無法親自簽具者且\n無親屬或關係人在場,得以按指印代替簽名,惟應有二名見證人。3.若病人意識不清且無親屬或關係人在場,醫療\n緊急情況得由二名合格醫師在病歷上證明需檢查或治療即可。)\n(簽章)見證人2 :\n(簽章)\n見證人1 :\n見證人1身分證字號:\n見證人2身分證字號:\n日時間 •\n時\n日期:西元\n西元2025年09月11日病歷委員會修正通過電子病歷版本 MR 19一22\n西元2025年09月02日品質暨病人安全委員會審核通過\n臺大醫院暨兒童醫院影像醫學部門訁僉查一兌明書\n檢查東址一樓磁振造影室\n東址262540\n聯絡\n西址262636\n西址一樓磁振造影室\n地點\n電話\n兒醫270323\n兒童醫院三樓磁振造影室\n一般注意事項\n* 請務必詳閱各檢查說明書載明注意事項並填妥同意書,按照約定時間攜帶\n預約通知單、檢查同意書、健保卡或身分證明文件提前至各檢查室登記處\n辦理報到、候檢及準備工作,並請禮讓急重症病患\n* 立同意書人須年滿十八歲方具法律效力,檢查對象若未滿十八歲,請務必\n由法定代理人簽妥同意書並陪同到院檢查。\n* 如需更改日期,請於預約檢查日之前持預約檢查通知單至檢查室登記處辦\n理,或與各檢查室登記處聯絡。\n* 若因天災或其他因素經行政院人事行政總處發布台北市停止上班〔災防\n假〕,各項影像醫學部門診檢查請考量自身安全,並擇期於上班日電洽各\n檢查室登記處以利盡速安排檢查時段。\n 時因故不能前來檢查，或月經尚未乾淨，請回門診掛號，與主治醫師討論決定下次檢\n查時間，此項檢查須排除懷孕之可能，故無法由病人自行更改檢查時間，有所不便請多見\n諒。\n(2)檢查後注意事項：\n●請自備衛生棉墊以便檢查後使用。口服藥物包含抗生素與止痛藥，請隨身攜帶，以便檢查\n完成後可立即服用。檢查當日晚上八點後，請自行將陰道的止血紗布取出。\n●檢查完7 天後即可至婦產科門診查詢檢查報告。對說明書內容若有疑問，請於上班時間(星\n期一至星期五，上午8:00~12:00，下午1:30~5:00)向生殖醫學中心人員(02-23123456 分機\n270950 或270955)詢問。\n效益：\n檢查輸卵管是否暢通或檢查子宮腔內是否出現病灶。\n風險：\n●本檢查經陰道注入含碘之顯影劑，可能的副作用包括：骨盆腔發炎(1-3％)、對顯影劑過敏\n等等。若檢查完後出現嚴重腹痛、發燒、呼吸或吞嚥困難、大量出血、皮膚疹、噁心嘔吐\n等情況，請立即就醫。\n●對碘過敏、甲狀腺功能不良或肺機能不全的人，應特別小心，並請告知檢查安排之醫師。\n替代方案：\n1.腹腔鏡或輸卵管通氣檢查：檢查輸卵管是否通暢。\n2.子宮鏡檢查：檢查是否出現子宮腔內病灶。\n請詳細閱讀內容，待醫師向您說明後，再簽署同意書第 1 頁\n病歷號：\n姓名：\n生日：西元年月日\n編號：83\n文件編號\n01400-4-601374\n版次\n12 \n西元2023 年12 月15 日病歷委員會修正通過電子病歷版本 MR 19-34\n西元2021 年11 月29 日品質暨病人安全委員會審核通過\n國立臺灣大學醫學院附設醫院\nNational Taiwan University Hospital\n子宮輸卵管攝影術檢查說明暨同意書\n（子宮輸卵管攝影術檢查說明書承上頁）\n不實施本醫療處置可能的後果：\n●無法瞭解輸卵管是否阻塞、或子宮腔內是否出現病灶。\n醫師補充說明/病人提出之疑問及解釋：（如無，請填寫無）\n以上說明未盡詳細者，或您仍有疑問，請洽詢您的主治醫師。\n說明醫師：（簽章）\n日期：西元年月日時間：時分\n子宮輸卵管攝影術檢查同意書\n病人：，出生於西元年月日，需接受子宮輸卵管攝影術\n檢查。立同意書人對於施行該項檢查已經與醫師討論過接受這個醫療處置的效益、風險及替\n代方案，業經貴院有關醫師詳細說明，並已充份瞭解並同意施行該項檢查。\n立同意書人姓名：（簽章）\n身分證字號/居留證或護照號碼：\n與病人之關係（請圈選）：本人、配偶、父、母、兒、女、其他：_________\n住址：\n電話：\n日期：西元年月日時間：時分\n（1.如由病人、親屬或關係人簽署本同意書，則無需見證，見證人部分得免填。2.若意識清楚，但無法親自簽\n具者且無親屬或關係人在場，得以按指印代替簽名，惟應有二名見證人。3.若病人意識不清且無親屬或關係人\n在場，醫療緊急情況得由2 名合格醫師在病歷上證明需檢查或治療即可。）\n見證人1：（簽章）見證人2：（簽章）\n見證人1 身分證字號：見證人2 身分證字號：\n日期：西元年月日時間：時分\n請詳細閱讀內容，待醫師向您說明後，再簽署同意書第 2 頁\n病歷號：\n姓名：\n生日：西元年月日\n文件編號\n01400-4-601374\n版次\n12 \n西元2023 年12 月15 日病歷委員會修正通過電子病歷版本 MR 19-34\n西元2021 年11 月29 日品質暨病人安全委員會審核通過\n子宮輸卵管攝影檢查\n兒醫\n3F"}, {"code": "087", "title": "影像醫學部腹部超音波檢查注意事項說明書", "nature": "診斷檢查", "modality": "超音波檢查", "body_raw": "消化(腹)", "body_group": "消化系統", "unit": "西址一樓影像醫學部第14攝影室", "campuses": ["西址"], "audience": ["中文一般/成人"], "prep": ["需禁食／空腹"], "phone": "262517", "rel_path": "pdfs/087_影像醫學部腹部超音波檢查注意事項說明書.pdf", "pdf_url": "https://www.ntuh.gov.tw/ckfinder_file/OPD/files/DOCEMENT/inst087.pdf", "pages": 2, "text": "87 號說明書\n台大醫院影像醫學部腹部超音波檢查注意事項說明書\n檢查\n地點\n舊院區(西址)影像醫學部第〸四攝影室\n(請詳背面簡要圖示)\n聯絡\n電話 23123456 轉62517\n一般注意事項\n請於約定日期至西址影像醫學部超音波室報到(在綜合診療部內科超音波室內)。\n報到時間:請依電腦預約單上之報到時間前來報到。\n如需更改日期，請於預約檢查日之前持預約檢查通知單至檢查單位辦理，或與檢\n查單位電話聯絡(分機62517)，否則視同放棄。\n對說明書內容若有任何疑問，請向檢查單位人員或聯合服務台洽詢。\n¥檢查時間約為10~30 分鐘。\n特殊注意事項\n一、檢查前注意事項：\n1.檢查前禁食六小時(可以喝開水)，平日藥物可正常服用。\n2.受檢當日請穿寬鬆之上下兩截式服裝。\n二、檢查中注意事項：\n請配合醫院指示做腹式呼吸。\n三、檢查後注意事項：\n請於檢查後七天，自行約掛門診或依醫師原預約門診時間看檢查結果。\n四、其他注意事項：\n無。\n(請翻閱背面)\n資料來源\n影像醫學部\n繪圖\n工務室\n說明書修訂日期\n99 年01 月15 日\n87 號說明書\n台大醫院影像醫學部腹部超音波檢查地點簡要圖示\n中\n山\n南\n路\n常德街\n往青島西路\n公\n園\n路\n後門\n中\n央\n走\n廊\n公共等候區\n辦公室\n所\n廁\n藥\n處\n領\n公共\n等候區\n20~38診\n廁所\n門診\n電腦斷層\n神經部\n等候區\n公共\n門診\n所\n家醫部\n門診\n家醫部\n廁\nCT\n教育中心\n健康\n1~12診\n外科部\n13~20診\n外科部\n二西\n二東\n一西\n一東\n三西\n三東\n四西\n四東\n五西\n五東\n六西\n六東\n九西\n九東\n舊大樓一樓正門"}, {"code": "088", "title": "乳管攝影檢查說明暨同意書", "nature": "診斷檢查", "modality": "乳房影像與切片", "body_raw": "乳房", "body_group": "乳房", "unit": "東址一樓影像醫學部第9攝影室", "campuses": ["東址"], "audience": ["中文一般/成人"], "prep": ["使用顯影／造影劑"], "phone": "262623", "rel_path": "pdfs/088_乳管攝影檢查說明暨同意書.pdf", "pdf_url": "https://www.ntuh.gov.tw/ckfinder_file/OPD/files/DOCEMENT/inst088.pdf", "pages": 4, "text": "國立臺灣大學醫學院附設醫院\nNational Taiwan University Hospital\n乳管攝影檢查說明暨同意書\n乳管攝影檢查說明書\n這份說明書是有關您即將接受的手術（或醫療處置）的效益、風險及替代方案的書面說明，可\n做為您與醫師討論時的補充資料。最重要的是我們希望您能充份瞭解資料的內容，所以請仔細\n閱讀；如果經醫師說明後您還有對這個手術（或醫療處置）的任何疑問，請在簽名前再與您的\n醫師充分討論，醫師會很樂意為您解答，讓我們一起為了您的健康努力。\n適應症及作法：（簡述）\n適應症：\n有異常乳頭分泌物之患者。\n作法：\n1.本檢查由放射科醫師施行，受檢者採平躺姿勢，以一極細導管置入不正常分泌之乳管內，\n並注入微量(少於1cc)含碘顯影劑，注射時可能會造成些許脹痛。注射完畢後，受檢者接受\n局部加壓攝影數次，以得到乳管攝影影像，全程約需45~60 分鐘。\n2.本檢查在有乳頭不正常分泌物之時，檢查才易施行。若沒有不正常分泌物時則無法實施檢\n查，建議改期在有分泌物時來檢查或改做其他檢查，如超音波或者是核磁共振。\n3.此檢查具放射線，有懷孕可能之病人請告知放射師或與臨床醫師討論。\n4.如需更改日期，請於預約檢查日之前的上班日08:00~17:00 持預約檢查通知單至檢查單位辦\n理，或與檢查單位電話（02-23562623）聯絡，否則視同放棄。\n5.對說明書內容若有疑問，請向檢查單位人員洽詢。\n效益：\n1.乳管攝影可發現小的乳管內病灶，此病灶可能在其他檢查無法偵測。\n2.乳管攝影可以協助外科醫師定位本檢查偵測到之乳房病灶的位置。\n3.手術/醫療處置成功率：因乳管開口十分細小，導致檢查困難度高，少數情況無法得到確信\n的診斷，則必須重新安排下一次檢查或改做其他檢查。\n風險：\n1.本檢查的顯影劑施予，並非直接進入血液，故過敏機率較低，但請有顯影劑過敏的患者，\n應先告知醫師。\n2.若顯影劑外漏可經人體自然吸收，多數不致造成危害，但若有乳房紅、腫、熱、痛之情形\n時，請儘快掛門診或至急診接受治療。\n3.檢查後可能有分泌物暫時增加之情形，此為正常現象。\n替代方案：\n1.如果您不想接受此項檢查，請與您的醫師討論是否改由乳房超音波檢查、或其他影像檢查(如\n核磁共振)，但是千萬不要因此而延誤病情診斷而錯失治療的黃金時間。\n請詳細閱讀內容，待醫師向您說明後，再簽署同意書第 1 頁\n病歷號：\n姓名：\n生日：西元年月日\n編號：88\n文件編號\n01400-4-601369\n版次\n07 \n西元2023 年12 月15 日病歷委員會修正通過電子病歷版本MR 19-20-39\n西元2021 年04 月28 日品質暨病人安全委員會審核通過\n國立臺灣大學醫學院附設醫院\nNational Taiwan University Hospital\n乳管攝影檢查說明暨同意書\n(乳管攝影檢查說明書承上頁)\n2.不實施醫療處置可能的後果：您可能因為不接受此此一檢查而需要由其他檢查來診斷您的\n問題，請務必與您的醫師討論如何藉由其他方式評估您的病情，不要因此而延誤診斷而錯\n過治療的黃金時間。\n醫師補充說明/病人提出之疑問及解釋：（如無，請填寫無）\n本檢查需自費，金額請參閱自費同意書細項說明。\n說明醫師：（簽章）\n日期：西元年月日時間：時分\n乳管攝影檢查同意書\n病人：，出生於西元年月日，需接受乳管攝影檢查。立\n同意書人已經與醫師討論過接受這個手術或醫療處置的效益、風險及替代方案，對醫師的說\n明都已充分了解且同意由貴院施行該項術式或醫療處置。\n立同意書人姓名：（簽章）\n身分證字號/居留證或護照號碼：\n與病人之關係（請圈選）：本人、配偶、父、母、兒、女、其他：_________\n住址：\n電話：\n日期：西元年月日時間：時分\n-------------------------------------------------------------------------------\n（1.如由病人、親屬或關係人簽署本同意書，則無需見證，見證人部分得免填。2.若意識清楚，但無法親自簽\n具者且無親屬或關係人在場，得以按指印代替簽名，惟應有二名見證人。3.若病人意識不清且無親屬或關係人\n在場，醫療緊急情況得由2 名合格醫師在病歷上證明需檢查或治療即可。）\n見證人1：（簽章）見證人2：（簽章）\n見證人1 身分證字號：見證人2 身分證字號：\n日期：西元年月日時間：時分\n請詳細閱讀內容，待醫師向您說明後，再簽署同意書第 2 頁\n病歷號：\n姓名：\n生日：西元年月日\n文件編號\n01400-4-601369\n版次\n07 \n西元2023 年12 月15 日病歷委員會修正通過電子病歷版本MR 19-20-39\n西元2021 年04 月28 日品質暨病人安全委員會審核通過\n台大醫院暨兒童醫院影像醫學部門診檢查一般說明書\n檢查\n地點\n東址一樓影像醫學部第9 攝影室\n聯絡\n電話\n東址 262623\n一般注意事項\n請務必詳閱各檢查說明書載明注意事項並填妥同意書，按照約定時間攜帶預\n約通知單、檢查同意書、健保卡或身分證明文件提前至各檢查室登記處辦理\n報到、候檢及準備工作，並請禮讓急重症病患。\n立同意書人須年滿十八歲方具法律效力，檢查對象若未滿十八歲，請務必由\n法定代理人簽妥同意書並陪同到院檢查。\n如需更改日期，請於預約檢查日之前持預約檢查通知單至檢查室登記處辦\n理，或與各檢查室登記處聯絡。\n若因天災或其他因素經行政院人事行政總處發布台北市停止上班﹝災防\n假﹞，各項影像醫學部門診檢查請考量自身安全，並擇期於上班日電洽各檢\n查室登記處以利盡速安排檢查時段。\n檢查注意事項\n一、檢查前注意事項：\n1.請詳閱各檢查說明書載名的抽血、清腸或禁食準備，若未準備妥當將導致\n當日檢查無法如期完成。\n2.各項檢查皆可能會更換檢查服，請穿著輕便衣物以利更換。\n二、檢查中注意事項：\n檢查時請務必聽從醫護人員指示，方能維持高品質的檢查以及保護您的安\n全。\n三、檢查後注意事項：\n檢查報告預計將於七個工作天內完成，請按照門診醫師預約回診時間或自\n行預約檢查完七個工作天後回原門診查看結果。\n資料來源\n影像醫學部\n說明書修訂日期\n114 年2 月10 日\n乳管攝影檢查\n報到\n東\n址\n1F"}, {"code": "118", "title": "電腦斷層大腸造影檢查說明暨同意書", "nature": "診斷檢查", "modality": "CT 電腦斷層", "body_raw": "消化(胃/腸)", "body_group": "消化系統", "unit": "東址一樓電腦斷層掃描室", "campuses": ["東址"], "audience": ["中文一般/成人"], "prep": ["需禁食／空腹", "需清腸／低渣", "使用顯影／造影劑"], "phone": "262301", "rel_path": "pdfs/118_電腦斷層大腸造影檢查說明暨同意書.pdf", "pdf_url": "https://www.ntuh.gov.tw/ckfinder_file/OPD/files/DOCEMENT/inst118.pdf", "pages": 5, "text": "國立臺灣大學醫學院附設醫院\nNational Taiwan University Hospital\n電腦斷層大腸造影檢查說明暨同意書\n請詳細閱讀內容，待醫師向您說明後，再簽署同意書第 1 頁\n西元2023 年 12 月15 日病歷委員會修正通過電子病歷版本 MR 19-111\n西元2021 年05 月17 日品質暨病人安全委員會審核通過\n文件編號\n01400-4-600115\n版次\n07\n\n病歷號：\n姓名：\n生日：西元年月日\n電腦斷層大腸造影檢查檢查說明書\n適應症及作法：（簡述）\n適應症：懷疑有大腸病灶，經臨床醫師評估認為需要接受此檢查之患者。\n作法：\n※一般注意事項：\n★到院檢查時請向護理人員報到，依序檢查，檢查前的準備工作依檢查部位而有所不同。\n另因緊急醫療所需，當日可能需要請您禮讓住院及急診病人。\n★請攜帶預約通知單、本說明書所附之檢查同意書、身分證及健保卡報到。\n★如需更改日期，或有其他疑問，請於預約檢查日期前於上班時間來電。\n上班時間：星期一~五：上午8：00～下午5：00。電話：（02）23562299、23562301\n※特殊注意事項：\n一、檢查前注意事項：\n1.檢查前2 天，禁吃任何富含肉類、蛋類或蔬菜類之食物，但可食用稀飯或肉渣較少之肉湯。\n2.檢查前2 天的睡前(約晚上10 點左右)，口服Ducolax(口服型清腸劑)3 顆，並同時每間隔\n20 分鐘飲用一大杯200cc 開水，共3 次。\n3.檢查前1 天的睡前(約晚上10 點左右)，再次口服Ducolax(口服型清腸劑)3 顆，並同時每\n間隔20 分鐘飲用一大杯200cc 開水，共3 次。此後，除必要之藥物外，禁止食用任何食\n物。\n4.檢查當天早上起床後，由肛門塞入Ducolax(塞劑型清腸劑)一顆，盡量忍耐腸蠕動之不適，\n於10 分鐘後，排便兩至兩次以上清淨腸道。如須服用藥物或感口渴，可喝少量開水，並\n請務必準時報到。\n5.失禁或無法控制排便者，請攜帶兩至三片紙尿褲前來受檢，以備不時之需。\n6.檢查前請禁食4 小時以上(可服必要的藥物，但糖尿病藥物暫停服用)，糖尿病患者可服用\n糖果或巧克力等。\n7.受檢當日請穿無金屬之服裝，例如運動褲，以減少金屬干擾影像。\n二、檢查中注意事項：\n1.檢查前，由護士將肛管插入肛門，依醫師指示打入適量空氣，以達大腸充盈之效果。\n2.檢查時，請配合仰臥或俯臥於檢查台上接受電腦斷層檢查。大多數病人須經靜脈注射造影\n劑，以利病灶之顯現。\n三、檢查後注意事項：\n1.檢查後，可能因腸內打入空氣而有暫時性腹部不適現象，通常在1 天內會自然消退。\n2.請於檢查後７個工作天後(檢查當日及例假日不算)，自行約掛門診或依醫師原預約門診時\n間聽取檢查結果說明。\n四、其他注意事項：\n1.請儘量有家屬陪伴。如有懷孕(不宜受檢)、藥物過敏、心臟病，請先告知檢查室醫師及護\n士。\n2.三日內有做過大腸、直腸鏡檢查並“切片”者，請受檢者特別注意並避免接受電腦斷層及\n大腸攝影。\n效益：\n偵測並評估病灶。\n編號：118\n國立臺灣大學醫學院附設醫院\nNational Taiwan University Hospital\n電腦斷層大腸造影檢查說明暨同意書\n請詳細閱讀內容，待醫師向您說明後，再簽署同意書第 2 頁\n西元2023 年 12 月15 日病歷委員會修正通過電子病歷版本 MR 19-111\n西元2021 年05 月17 日品質暨病人安全委員會審核通過\n文件編號\n01400-4-600115\n版次\n07\n\n病歷號：\n姓名：\n生日：西元年月日\n風險：\n★造影劑之可能不良作用：（大多數病人須經靜脈注射造影劑，以利病灶之顯見）\n1.少數人在注射含碘顯影劑時會發生溫熱感覺、噁心、嘔吐、頭暈、打噴嚏，通常在短時\n間內會消退。\n2.對具過敏性體質者，可能引起較嚴重的反應，如全身性蕁麻疹、寒顫、呼吸困難等症狀。\n3.對具特異體質者，可能發生極罕見之喉頭水腫、氣喘、血壓降低、心肺衰竭休克及猝死\n（發生率約十萬分之一）。少數病人會有靜脈腫痛，請勿熱敷；若有不適情形，請回原檢\n查室或掛急診處理。\n4.施打造影劑前，會由醫護人員施行生理食鹽水注射，以檢查注射血管之通暢性。但仍有\n少數病人，會於開始施打造影劑後，產生造影劑滲漏至皮下組織或肌肉 (機率約0.7%)，\n而致產生局部紅腫、疼痛之現象。皮下腫痛會在數日後隨造影劑吸收而慢慢消失，但亦\n有少數人出現嚴重發炎、潰瘍、及局部神經壓迫反應，而需接受住院觀察、外科處置或\n植皮。\n替代方案：\n傳統大腸鏡檢查。\n醫師補充說明/病人提出之疑問及解釋：（如無，請填寫無）\n說明醫師：\n（簽章）\n日期：西元年月日時間：時分\n電腦斷層大腸造影檢查同意書\n病人：，出生於西元年月日，需接受電腦斷層大腸造影檢\n查。立同意書人已經與醫師討論過接受這個手術或醫療處置的效益、風險及替代方案，對醫\n師的說明都已充分了解且同意由貴院施行該項術式或醫療處置。\n立同意書人姓名：（簽章）\n身分證字號/居留證或護照號碼：\n與病人之關係（請圈選）：本人、配偶、父、母、兒、女、其他：_________\n住址：\n電話：\n日期：西元年月日時間：時分\n國立臺灣大學醫學院附設醫院\nNational Taiwan University Hospital\n電腦斷層大腸造影檢查說明暨同意書\n請詳細閱讀內容，待醫師向您說明後，再簽署同意書第 3 頁\n西元2023 年 12 月15 日病歷委員會修正通過電子病歷版本 MR 19-111\n西元2021 年05 月17 日品質暨病人安全委員會審核通過\n文件編號\n01400-4-600115\n版次\n07\n\n病歷號：\n姓名：\n生日：西元年月日\n(1.如由病人、親屬或關係人簽署本同意書，則無需見證，見證人部分得免填。2.若意識清楚，但無法親自簽具\n者且無親屬或關係人在場，得以按指印代替簽名，惟應有二名見證人。3.若病人意識不清且無親屬或關係人在\n場，醫療緊急情況得由2 名合格醫師在病歷上證明需檢查或治療即可。)\n見證人1：（簽章）見證人2：（簽章）\n見證人1 身分證字號：見證人2 身分證字號：\n日期：西元年月日時間：時分\n臺大醫院暨兒童醫院影像醫學部門診檢查一般說明書\n檢查\n地點\n東址一樓電腦斷層掃描室\n聯絡\n電話\n東址 262301\n一般注意事項\n請務必詳閱各檢查說明書載明注意事項並填妥同意書，按照約定時間攜帶\n預約通知單、檢查同意書、健保卡或身分證明文件提前至各檢查室登記處\n辦理報到、候檢及準備工作，並請禮讓急重症病患。\n立同意書人須年滿十八歲方具法律效力，檢查對象若未滿十八歲，請務必\n由法定代理人簽妥同意書並陪同到院檢查。\n如需更改日期，請於預約檢查日之前持預約檢查通知單至檢查室登記處辦\n理，或與各檢查室登記處聯絡。\n若因天災或其他因素經行政院人事行政總處發布台北市停止上班﹝災防\n假﹞，各項影像醫學部門診檢查請考量自身安全，並擇期於上班日電洽各\n檢查室登記處以利盡速安排檢查時段。\n檢查注意事項\n一、檢查前注意事項：\n1.請詳閱各檢查說明書載名的抽血、清腸或禁食準備，若未準備妥當將\n導致當日檢查無法如期完成。\n2.各項檢查皆可能會更換檢查服，請穿著輕便衣物以利更換。\n二、檢查中注意事項：\n檢查時請務必聽從醫護人員指示，方能維持高品質的檢查以及保護您的\n安全。\n三、檢查後注意事項：\n檢查報告預計將於七個工作天內完成，請按照門診醫師預約回診時間或\n自行預約檢查完七個工作天後回原門診查看結果。\n資料來源\n影像醫學部\n說明書修訂日期\n114 年2 月10 日\n電腦斷層大腸造影檢查\n東\n址\n1F"}, {"code": "123", "title": "電腦斷層心臟冠狀動脈鈣化指數檢查說明暨同意書", "nature": "診斷檢查", "modality": "CT 電腦斷層", "body_raw": "心臟血管", "body_group": "心臟血管", "unit": "東址一樓電腦斷層掃描室", "campuses": ["東址"], "audience": ["中文一般/成人"], "prep": [], "phone": "262301", "rel_path": "pdfs/123_電腦斷層心臟冠狀動脈鈣化指數檢查說明暨同意書.pdf", "pdf_url": "https://www.ntuh.gov.tw/ckfinder_file/OPD/files/DOCEMENT/inst123.pdf", "pages": 4, "text": "國立臺灣大學醫學院附設醫院\nNational Taiwan University Hospital\n電腦斷層心臟冠狀動脈鈣化指數檢查說明\n暨同意書\n請詳細閱讀內容，待醫師向您說明後，再簽署同意書第 1 頁\n西元2023 年 12 月15 日病歷委員會修正通過電子病歷版本 MR 19-135\n西元2021 年04 月28 日品質暨病人安全委員會審核通過\n文件編號\n01400-4-600113\n版次\n08\n\n病歷號：\n姓名：\n生日：西元年月日\n電腦斷層心臟冠狀動脈鈣化指數檢查說明書\n適應症及作法：（簡述）\n適應症: 懷疑有心血管疾病或高風險者(本檢查目的是偵測動脈硬化鈣化斑塊，以便評估冠\n狀動脈血管疾病風險)。\n作法:\n※一般注意事項：\n1.請於預約檢查日期攜帶預約通知單、本說明書所附之檢查同意書及身分證到院向檢查室護\n理人員報到。\n2.本檢查為自費檢查，價格約為6000 元。\n3.如需更改檢查日期，請於預約檢查前三日前於上班時間(9:00~17:00)與檢查單位電話聯絡\n（02-2356-2301）。\n4.如對說明書與同意書之內容有不明瞭之處，請向開單診間或檢查室醫護人員洽詢。\n※特殊注意事項：\n一、檢查前注意事項：\n心跳速率快將造成影像模糊無法判讀，檢查前12 小時內請勿服用含咖啡因物質（例如咖\n啡、茶、可樂、巧克力），以避免心跳加快。\n二、檢查進行方式與注意事項：\n1.經測量心跳速率超過每分鐘100 下者，需使用口服藥物 (Propranolol，商品名為Inderal)減\n慢心跳速率，服藥後約需等待一小時至一個半小時，請耐心等候。心跳不規律或服藥後仍\n無法減慢心跳速率者，可能造成影像不清晰影響判讀之正確性。\n2.檢查時，受檢者需要閉氣（約10 秒），根據心電圖訊號進行檢查。請配合醫護人員指示，\n如未依指示配合閉氣將造成影像模糊無法判讀。\n三、此檢查後注意事項：\n1.請於檢查後7 個工作天(不包含例假日)，自行約掛門診或依醫師原預約門診時間查看檢查\n結果。\n2.若此檢查為本院健康管理中心所包含之健檢項目，檢查結果將另行通知。\n效益：\n偵測動脈硬化鈣化斑塊，以便評估冠狀動脈血管疾病風險。\n風險：\n1.本檢查輻射劑量約為10 張胸部X 光的暴露量，懷孕婦女不適合進行本項檢查。\n2.口服藥物(Propranolol)作用為降低心跳速率，其副作用包括心跳過慢、低血壓、虛弱、倦\n怠、頭暈、噁心、誘發氣喘、呼吸急促、頭重腳輕、昏睡等。若服用後有身體不適，請告\n知現場醫護人員。\n3.有氣喘病史應主動告知醫護人員。\n替代方案：\n本檢查目的是偵測心臟冠狀動脈硬化鈣化斑塊，以便評估冠狀動脈血管疾病風險。其他可\n評估冠狀動脈血管疾病風險的替代方案為運動心電圖等。\n不實施醫療處置可能的後果：減少評估冠狀動脈血管疾病風險的一項參考。\n編號：123\n國立臺灣大學醫學院附設醫院\nNational Taiwan University Hospital\n電腦斷層心臟冠狀動脈鈣化指數檢查說明\n暨同意書\n請詳細閱讀內容，待醫師向您說明後，再簽署同意書第 2 頁\n西元2023 年 12 月15 日病歷委員會修正通過電子病歷版本 MR 19-135\n西元2021 年04 月28 日品質暨病人安全委員會審核通過\n文件編號\n01400-4-600113\n版次\n08\n\n病歷號：\n姓名：\n生日：西元年月日\n醫師補充說明/病人提出之疑問及解釋：（如無，請填寫無）\n說明醫師：（簽章）\n日期：西元年月日時間：時分\n電腦斷層心臟冠狀動脈鈣化指數檢查同意書\n病人：，出生於西元年月日，需接受電腦斷層心臟冠狀動\n脈鈣化指數檢查。立同意書人已經與醫師討論過接受這個手術或醫療處置的效益、風險及替\n代方案，對醫師的說明都已充分了解且同意由貴院施行該項術式或醫療處置。\n立同意書人姓名：（簽章）\n身分證字號/居留證或護照號碼：\n與病人之關係（請圈選）：本人、配偶、父、母、兒、女、其他：_________\n住址：\n電話：\n日期：西元年月日時間：時分\n(1.如由病人、親屬或關係人簽署本同意書，則無需見證，見證人部分得免填。2.若意識清楚，但無法親自簽具\n者且無親屬或關係人在場，得以按指印代替簽名，惟應有二名見證人。3.若病人意識不清且無親屬或關係人在\n場，醫療緊急情況得由2 名合格醫師在病歷上證明需檢查或治療即可。)\n見證人1：（簽章）見證人2：（簽章）\n見證人1 身分證字號：見證人2 身分證字號：\n日期：西元年月日時間：時分\n臺大醫院暨兒童醫院影像醫學部門診檢查一般說明書\n檢查\n地點東址一樓電腦斷層掃描室\n聯絡\n電話\n東址 262301\n一般注意事項\n請務必詳閱各檢查說明書載明注意事項並填妥同意書，按照約定時間攜帶\n預約通知單、檢查同意書、健保卡或身分證明文件提前至各檢查室登記處\n辦理報到、候檢及準備工作，並請禮讓急重症病患。\n立同意書人須年滿十八歲方具法律效力，檢查對象若未滿十八歲，請務必\n由法定代理人簽妥同意書並陪同到院檢查。\n如需更改日期，請於預約檢查日之前持預約檢查通知單至檢查室登記處辦\n理，或與各檢查室登記處聯絡。\n若因天災或其他因素經行政院人事行政總處發布台北市停止上班﹝災防\n假﹞，各項影像醫學部門診檢查請考量自身安全，並擇期於上班日電洽各\n檢查室登記處以利盡速安排檢查時段。\n檢查注意事項\n一、檢查前注意事項：\n1.請詳閱各檢查說明書載名的抽血、清腸或禁食準備，若未準備妥當將\n導致當日檢查無法如期完成。\n2.各項檢查皆可能會更換檢查服，請穿著輕便衣物以利更換。\n二、檢查中注意事項：\n檢查時請務必聽從醫護人員指示，方能維持高品質的檢查以及保護您的\n安全。\n三、檢查後注意事項：\n檢查報告預計將於七個工作天內完成，請按照門診醫師預約回診時間或\n自行預約檢查完七個工作天後回原門診查看結果。\n資料來源\n影像醫學部\n說明書修訂日期\n114 年2 月10 日\n電腦斷層心臟冠狀動脈鈣化指數檢查\n東\n址\n1F"}, {"code": "128", "title": "立體定位乳房微創切片檢查說明暨同意書", "nature": "介入治療／手術", "modality": "乳房影像與切片", "body_raw": "乳房", "body_group": "乳房", "unit": "東址一樓影像醫學部第9攝影室", "campuses": ["東址"], "audience": ["中文一般/成人"], "prep": ["含麻醉或鎮靜"], "phone": "262623", "rel_path": "pdfs/128_立體定位乳房微創切片檢查說明暨同意書.pdf", "pdf_url": "https://www.ntuh.gov.tw/ckfinder_file/OPD/files/DOCEMENT/inst128.pdf", "pages": 4, "text": "國立臺灣大學醫學院附設醫院\nNational Taiwan University Hospital\n立體定位乳房微創切片檢查說明暨同意書\n請詳細閱讀內容，待醫師向您說明後，再簽署同意書第 1 頁\n西元2023 年 12 月15 日病歷委員會修正通過電子病歷版本 MR 19-116\n西元2021 年09 月09 日品質暨病人安全委員會審核通過\n文件編號\n01400-4-600116\n版次\n08\n\n病歷號：\n姓名：\n生日：西元年月日\n立體定位乳房微創切片檢查說明書\n這份說明書是有關您即將接受的手術或醫療處置的效益、風險及替代方案的書面說明，\n可做為您與醫師討論時的補充資料。最重要的是我們希望您能充分瞭解資料的內容，所以請\n仔細閱讀；如果經醫師說明後您還有對這個手術或醫療處置的任何疑問，請在簽名前再與您\n的醫師充分討論，醫師會很樂意為您解答，讓我們一起為了您的健康努力。\n適應症及作法：（簡述）\n適應症：\n本檢查之目的，是要將乳房攝影上有疑問之病灶，以乳房攝影立體定位出來，並以微創抽引\n切片針取樣，以查驗該病灶可能之性質，提供臨床醫師治療方向之參考。\n作法：\n檢查全程由影像醫學部醫師及女性放射技術師施行。我們會請您以坐姿或側臥姿接受檢查。\n先將乳房固定於乳房攝影機上，然後以電腦立體定位找出病灶的位置。我們會為您做局部麻\n醉，然後在乳房皮膚上切開一個約0.5 公分的小傷口，將切片針置入病灶處，抽取約12 至20\n條樣本(每一條約2 公分長)之後，醫師會視情況，於切片處置入組織標示夾。切片完成後，\n將為您局部壓迫止血，再以消毒紗布覆蓋傷口後即完成。全程約1 小時。但依個人難易程度\n會稍長或稍短。樣本將送病理科化驗結果。\n效益：\n若此微創切片過程順利，其準確度高達94%到98%。傷口小，恢復快，不需住院即能施行。\n風險：\n1.最常見之副作用為局部淤青、出血，約在檢查一週後可逐漸恢復。\n2.極罕見之情形會有局部感染 (紅、腫、熱、痛)。更罕見的會有癌細胞植入穿刺之路徑。\n3.若病灶太小、不明顯，或所在位置致手術難度高，不易施行，或您無法配合，可能致此切\n片手術無法進行，則須以其他切片方式 (例如:開刀) 取代。\n4.因此種切片檢查仍有少許(2%至6%)之不確定性。故當此種切片之病理結果和影像判斷不能\n配合時，醫師有可能會建議進一步之處理方式 (例如:開刀)。\n替代方案：\n開刀切片。\n不實施醫療處置可能的後果：無法得知可疑病灶之病理診斷，可能延誤處置。\n醫師補充說明/病人提出之疑問及解釋：（如無，請填寫無）\n1.有明顯之易出血體質者不建議接受此檢查。\n2.若您有定期服用抗凝血之藥物，例如：阿斯匹靈(Aspirin)，可邁丁(Coumadin)，銀杏\n(Ginkgo)…等，則須在切片檢查前3-5 天開始停藥至檢查結束後再恢復用藥。但若因您的身\n體狀況不能停藥，則無法接受此種切片，而須以其他切片方式取代。\n3.若您對局部麻醉劑、醫師用的乳膠手套、膠布、碘酒過敏，請務必於檢查前告知檢查執行\n醫師與放射技術師。我們會使用其他之替代品。\n4.檢查後一週內請多穿胸罩，以協助傷口壓迫及恢復。傷口請保持乾燥，並以美容膠布固定\n傷口。\n編號：128\n國立臺灣大學醫學院附設醫院\nNational Taiwan University Hospital\n立體定位乳房微創切片檢查說明暨同意書\n請詳細閱讀內容，待醫師向您說明後，再簽署同意書第 2 頁\n西元2023 年 12 月15 日病歷委員會修正通過電子病歷版本 MR 19-116\n西元2021 年09 月09 日品質暨病人安全委員會審核通過\n文件編號\n01400-4-600116\n版次\n08\n\n病歷號：\n姓名：\n生日：西元年月日\n（立體定位乳房微創切片檢查說明書承上頁）\n5.回去後若傷口及附近有無法控制的出血或感染 (紅、腫、熱、痛)，請盡速掛號求醫。\n6.請您於一週後至門診詢問病理化驗結果。\n7.本處置需自費約22000~40000 元之間，總價格依照所使用的耗材品項及數量而定，健保並\n無給付。\n說明醫師：（簽章）\n日期：西元年月日時間：時分\n立體定位乳房微創切片檢查同意書\n病人：，出生於西元年月日，需接受立體定位乳房微創切\n片檢查。立同意書人已經與醫師討論過接受這個手術或醫療處置的效益、風險及替代方案，\n對醫師的說明都已充分了解且同意由貴院施行該項術式或醫療處置。\n立同意書人姓名：（簽章）\n身分證字號/居留證或護照號碼：\n與病人之關係（請圈選）：本人、配偶、父、母、兒、女、其他：_________\n住址：\n電話：\n日期：西元年月日時間：時分\n(1.如由病人、親屬或關係人簽署本同意書，則無需見證，見證人部分得免填。2.若意識清楚，但無法親自簽具\n者且無親屬或關係人在場，得以按指印代替簽名，惟應有二名見證人。3.若病人意識不清且無親屬或關係人在\n場，醫療緊急情況得由2 名合格醫師在病歷上證明需檢查或治療即可。)\n見證人1：（簽章）見證人2：（簽章）\n見證人1 身分證字號：見證人2 身分證字號：\n日期：西元年月日時間：時分\n臺大醫院暨兒童醫院影像醫學部門診檢查一般說明書\n檢查\n地點\n東址一樓影像醫學部第9 攝影室\n聯絡\n電話\n東址 262623\n一般注意事項\n請務必詳閱各檢查說明書載明注意事項並填妥同意書，按照約定時間攜帶\n預約通知單、檢查同意書、健保卡或身分證明文件提前至各檢查室登記處\n辦理報到、候檢及準備工作，並請禮讓急重症病患。\n立同意書人須年滿十八歲方具法律效力，檢查對象若未滿十八歲，請務必\n由法定代理人簽妥同意書並陪同到院檢查。\n如需更改日期，請於預約檢查日之前持預約檢查通知單至檢查室登記處辦\n理，或與各檢查室登記處聯絡。\n若因天災或其他因素經行政院人事行政總處發布台北市停止上班﹝災防\n假﹞，各項影像醫學部門診檢查請考量自身安全，並擇期於上班日電洽各\n檢查室登記處以利盡速安排檢查時段。\n檢查注意事項\n一、檢查前注意事項：\n1.請詳閱各檢查說明書載名的抽血、清腸或禁食準備，若未準備妥當將\n導致當日檢查無法如期完成。\n2.各項檢查皆可能會更換檢查服，請穿著輕便衣物以利更換。\n二、檢查中注意事項：\n檢查時請務必聽從醫護人員指示，方能維持高品質的檢查以及保護您的\n安全。\n三、檢查後注意事項：\n檢查報告預計將於七個工作天內完成，請按照門診醫師預約回診時間或\n自行預約檢查完七個工作天後回原門診查看結果。\n資料來源\n影像醫學部\n說明書修訂日期\n114 年2 月10 日\n立體定位乳房微創切片檢查\n東\n址\n1F"}, {"code": "159", "title": "電腦斷層心臟冠狀動脈血管攝影檢查說明暨同意書", "nature": "診斷檢查", "modality": "CT 電腦斷層", "body_raw": "心臟血管", "body_group": "心臟血管", "unit": "東址一樓電腦斷層掃瞄室", "campuses": ["東址"], "audience": ["中文一般/成人"], "prep": ["需禁食／空腹", "使用顯影／造影劑", "需驗腎功能 (Cre)"], "phone": "262299", "rel_path": "pdfs/159_電腦斷層心臟冠狀動脈血管攝影檢查說明暨同意書.pdf", "pdf_url": "https://www.ntuh.gov.tw/ckfinder_file/OPD/files/DOCEMENT/inst159.pdf", "pages": 5, "text": "國立臺灣大學醫學院附設醫院\nNational Taiwan University Hospital\n電腦斷層心臟冠狀動脈血管攝影檢查說明暨\n同意書\n病歷號：\n姓名：\n生日：西元年月日\n請詳細閱讀內容，待醫師向您說明後，再簽署同意書\n第 1 頁\n西元2023 年12 月15 日病歷委員會修正通過電子病歷版本 MR 19-114\n西元2021 年05 月17 日品質暨病人安全委員會審核通過\n文件編號\n01400-4-600111\n版次\n10 \n電腦斷層心臟冠狀動脈血管攝影檢查說明書\n編號:159\n適應症及作法：（簡述）\n本檢查目的是偵測動脈硬化斑塊，以便早期診斷冠狀動脈血管狹窄，也可評估支架暢通與否或\n繞道手術之追蹤。\n※一般注意事項：\n1.請於預約檢查日期攜帶預約通知單、本說明書所附之檢查同意書及身分證，到院向檢查室護\n理人員報到。\n2.如需更改檢查日期，或有其他疑問，請於預約檢查日前於上班時間與檢查單位電話聯絡\n（02-2356-2301）。上班時間：星期一~星期五：上午8：00～下午5：00。\n3.如對說明書與同意書之內容有不明瞭之處，請向開單診間或檢查室醫護人員洽詢。\n4.請儘量有家屬陪伴。\n※特殊注意事項：\n一、檢查前注意事項：\n1.因心跳速率快將造成影像模糊無法判讀，檢查前12 小時內請勿服用含咖啡因物質（例如咖啡、\n茶、可樂、巧克力），以避免心跳加快。檢查前請禁食四小時以上(可服用必要的藥物，但糖尿\n病藥物須暫停服用，糖尿病患者可服用少量糖果)。\n2.孕婦或有藥物過敏、腎功能不良之病史者，應告知醫師，與醫師討論本項檢查可能引起之不\n良反應後，再決定是否使用本項檢查。\n3.如有氣喘病史或曾做過冠狀動脈繞道手術者，請務必告知檢查室醫護人員。\n二、檢查進行方式與注意事項：\n1.為了提供最佳的影像品質以及降低輻射劑量，心跳速率超過每分鐘70-80 次以上者，用單次\n口服藥物(Propranolol，商品名為Inderal；或Verapamil，商品名Isoptin)以穩定心跳。若有對這\n些藥物過敏或氣喘、慢性阻塞性肺疾病史者，請告知。服藥後約需等待半小時至一個半小時，\n請耐心等候。此口服藥物作用為降低心跳速率，其副作用包括心跳過慢、低血壓、虛弱、倦怠、\n頭暈、噁心、呼吸急促、頭重腳輕、昏睡等。若服用後有身體不適，請告知現場醫護人員。\n2.心跳不規律或服藥後仍無法減慢心跳速率者，可能造成影像不清晰，影響判讀之正確性。\n3.留置靜脈注射帽，注射顯影劑，根據心電圖訊號進行檢查。\n4.檢查時，受檢者需要多次閉氣（每次約10 秒），請配合醫護人員指示，如未依指示配合閉氣\n將造成影像模糊，無法判讀。\n5.若心律無法控制，有可能會使用一般輻射劑量進行掃描，如有疑問請洽詢在場醫護人員。\n國立臺灣大學醫學院附設醫院\nNational Taiwan University Hospital\n電腦斷層心臟冠狀動脈血管攝影檢查說明暨\n同意書\n病歷號：\n姓名：\n生日：西元年月日\n請詳細閱讀內容，待醫師向您說明後，再簽署同意書\n第 2 頁\n西元2023 年12 月15 日病歷委員會修正通過電子病歷版本 MR 19-114\n西元2021 年05 月17 日品質暨病人安全委員會審核通過\n文件編號\n01400-4-600111\n版次\n10 \n6.施打顯影劑之患者須有三個月內之血液肌酸酐(Cre)值，請務必於受檢前三個月內完成抽血檢\n查。不便至本院檢驗者，可攜帶三個月內其他醫院或醫事檢驗機構之血液肌酸酐(Cre)正式報告\n於受檢當天供參考。\n三、檢查後注意事項：\n1.如有身體不適者，請回原檢查室或至本院急診處理。\n2.檢查後請多喝水，可加速所注射顯影劑之排出。\n※顯影劑之可能不良反應：(本項檢查使用的顯影劑為“非離子性低滲透壓顯影劑“）\n1.部分受檢者在注射顯影劑時會發生溫熱感覺、噁心、嘔吐、頭暈、打噴嚏，通常在短時間內\n會消退。\n2.極少數人，可能引起較嚴重的反應，如全身性蕁麻疹、寒顫、呼吸困難等症狀。\n3.對具特異體質者，可能發生極罕見之喉頭水腫、氣喘、血壓降低、心肺衰竭休克及猝死（發\n生率約十萬分之一）。\n4.曾患心臟疾病、氣喘病、曾因顯影劑引起不良反應者、腎功能不良者或其他特殊疾病之患者\n等，發生不良反應之機率較高。腎臟功能不佳者，注射顯影劑可能會使腎臟功能更加惡化。\n5.施打顯影劑前，會由醫護人員施行生理食鹽水注射，以檢查注射血管之通暢性。但仍有少數\n病人(如意識不清無痛覺反應，躁動，皮膚水腫，靜脈循環不佳(有開過刀或中心靜脈阻塞)，血\n管細小易破，留置針在關節或約束帶固定處，不易評估腫脹)，會於開始施打顯影劑後，產生顯\n影劑滲漏至皮下組織或肌肉 (機率約0.7%)，而致產生局部紅腫、疼痛之現象。皮下腫痛會在數\n日後隨顯影劑吸收而慢慢消失，但亦有少數人出現嚴重發炎、潰瘍、及局部神經壓迫反應，而\n需接受住院觀察、外科處置或植皮。\n效益：\n無。\n風險：\n無。\n替代方案：\n替代方案為心導管檢查。\n醫師充說明/病人提出之疑問及解釋：（如無，請填寫無）\n如果您有任何問題，歡迎您提出來和您的主治醫師討論，並且請他寫下來供您作參考。\n說明醫師：（簽章）\n日期：西元年月日時間：時分\n國立臺灣大學醫學院附設醫院\nNational Taiwan University Hospital\n電腦斷層心臟冠狀動脈血管攝影檢查說明暨\n同意書\n病歷號：\n姓名：\n生日：西元年月日\n請詳細閱讀內容，待醫師向您說明後，再簽署同意書\n第 3 頁\n西元2023 年12 月15 日病歷委員會修正通過電子病歷版本 MR 19-114\n西元2021 年05 月17 日品質暨病人安全委員會審核通過\n文件編號\n01400-4-600111\n版次\n10 \n電腦斷層心臟冠狀動脈血管攝影檢查同意書\n病人：，出生於西元年月日，需接受電腦斷層心臟冠狀\n動脈血管攝影檢查。立同意書人已經與醫師討論過接受這個手術或醫療處置的效益、風險、及\n替代方案，對醫師的說明都已充分了解且同意由貴院施行該項術式或醫療處置。\n立同意書人姓名：（簽章）\n身分證字號/居留證或護照號碼：\n與病人之關係（請圈選）：本人、配偶、父、母、兒、女、其他：_________\n住址：\n電話：\n日期：西元年月日時間：時分\n(1.如由病人、親屬或關係人簽署本同意書，則無需見證，見證人部分得免填。2.若意識清楚，但無法親自簽具者\n且無親屬或關係人在場，得以按指印代替簽名，惟應有二名見證人。3.若病人意識不清且無親屬或關係人在場，\n醫療緊急情況得由二名合格醫師在病歷上證明需檢查或治療即可。)\n見證人1：（簽章）見證人2：（簽章）\n見證人1 身分證字號：見證人2 身分證字號：\n日期：西元年月日時間：時分\n國立臺灣大學醫學院附設醫院\nNational Taiwan University Hospital\n電腦斷層心臟冠狀動脈血管攝影檢查說明暨\n同意書\n病歷號：\n姓名：\n生日：西元年月日\n請詳細閱讀內容，待醫師向您說明後，再簽署同意書\n第 4 頁\n西元2023 年12 月15 日病歷委員會修正通過電子病歷版本 MR 19-114\n西元2021 年05 月17 日品質暨病人安全委員會審核通過\n文件編號\n01400-4-600111\n版次\n10 \n臺大醫院暨兒童醫院影像醫學部門診檢查一般說明書\n檢查\n地點\n東址一樓電腦斷層掃瞄室\n聯絡\n電話\n東址 262299\n一般注意事項\n請務必詳閱各檢查說明書載明注意事項並填妥同意書，按照約定時間攜帶\n預約通知單、檢查同意書、健保卡或身分證明文件提前至各檢查室登記處\n辦理報到、候檢及準備工作，並請禮讓急重症病患。\n立同意書人須年滿十八歲方具法律效力，檢查對象若未滿十八歲，請務必\n由法定代理人簽妥同意書並陪同到院檢查。\n如需更改日期，請於預約檢查日之前持預約檢查通知單至檢查室登記處辦\n理，或與各檢查室登記處聯絡。\n若因天災或其他因素經行政院人事行政總處發布台北市停止上班﹝災防\n假﹞，各項影像醫學部門診檢查請考量自身安全，並擇期於上班日電洽各\n檢查室登記處以利盡速安排檢查時段。\n檢查注意事項\n一、檢查前注意事項：\n1.請詳閱各檢查說明書載名的抽血、清腸或禁食準備，若未準備妥當將導\n致當日檢查無法如期完成。\n2.各項檢查皆可能會更換檢查服，請穿著輕便衣物以利更換。\n二、檢查中注意事項：\n檢查時請務必聽從醫護人員指示，方能維持高品質的檢查以及保護您的\n安全。\n三、檢查後注意事項：\n檢查報告預計將於七個工作天內完成，請按照門診醫師預約回診時間或自\n行預約檢查完七個工作天後回原門診查看結果。\n資料來源\n影像醫學部\n說明書修訂日期\n112 年3 月10 日\n電腦斷層心臟冠狀動脈血管攝影檢查\n東\n址\n1F"}, {"code": "176", "title": "小兒吞嚥攝影說明暨同意書", "nature": "診斷檢查", "modality": "X光與透視攝影", "body_raw": "消化(食道)", "body_group": "消化系統", "unit": "兒醫大樓三樓影像醫學部", "campuses": ["兒醫大樓"], "audience": ["小兒專用"], "prep": ["需禁食／空腹", "使用顯影／造影劑"], "phone": "270323", "rel_path": "pdfs/176_小兒吞嚥攝影說明暨同意書.pdf", "pdf_url": "https://www.ntuh.gov.tw/ckfinder_file/OPD/files/DOCEMENT/inst176.pdf", "pages": 4, "text": "國立臺灣大學醫學院附設醫院\nNational Taiwan University Hospital\n小兒吞嚥攝影說明暨同意書\n小兒吞嚥攝影說明書\n這份說明書是有關您即將接受的檢查（或醫療處置）的效益、風險及替代方案的書面說\n明，可做為您與醫師討論時的補充資料。最重要的是我們希望您能充份瞭解資料的內容，\n所以請仔細閱讀；如果經醫師說明後您還有對這個檢查（或醫療處置）的任何疑問，請在\n簽名前再與您的醫師充分討論，醫師會很樂意為您解答，讓我們一起為了您的健康努力。\n一般注意事項：\n★請於約定時間至檢查地點辦理報到候檢，超過所約時間視為放棄。\n★如臨時因故需更改日期，請於三日前上班時間(星期一至星期五，早上9-12 時；下午1-5\n時不包含國定假日)與檢查單位聯絡(分機270323)。\n★請由家屬陪同前來協助檢查。\n★對說明書內容若有疑問，請於上班時間向診間或檢查單位人員電話 (分機270323) 聯絡。\n特殊注意事項：\n一、檢查前注意事項：檢查前需禁食一餐。\n二、檢查中注意事項：需要請至少兩位家屬在旁協助檢查，請儘量與醫護人員合作。\n三、檢查後注意事項：請於檢查後三天，自行約掛門診或依醫師原預約門診時間看檢查結\n果。。\n適應症及作法：（簡述）\n適應症：腦性麻痺等疾病，或其他導致吞嚥困難或嗆咳之疾病。\n作法：讓受檢之小兒喝入顯影劑，檢查過程中須由家長在檢查室內陪同小兒受檢，以確保安\n全。\n效益：\n藉由此項檢查，我們可以確定是否有嗆咳之情形，以決定之後治療的步驟。\n檢查/醫療處置成功率：超過九成。\n風險：\n此檢查而導致吸入性肺炎或致死的案例極少，但接受此檢查的病人通常因自身吞嚥功能不良，\n可能會有潛在性的吸入(silent aspiration)，是為吸入性肺炎的危險因子。\n參考文獻: International archives of otorhinolaryngology 20.2 (2016): 132-137.\n編號：176\n\n病歷號：\n姓名：\n生日：西元年月日\n請詳細閱讀內容，待醫師向您說明後，再簽署同意書第 1 頁\n文件編號\n01400-4-601368\n版次\n05\n西元2023 年12 月15 日病歷委員會修正通過電子病歷版本 MR 19-20-38\n西元2021 年03 月25 日品質暨病人安全委員會審核通過\n國立臺灣大學醫學院附設醫院\nNational Taiwan University Hospital\n小兒吞嚥攝影說明暨同意書\n（小兒吞嚥攝影說明書承上頁）\n替代方案：\n目前無替代檢查，請與醫師討論您的決定及接受此檢查的必要性。\n醫師補充說明/病人提出之疑問及解釋：（如無，請填寫無）\n說明醫師：（簽章）\n日期：西元年月日時間：時分\n小兒吞嚥攝影同意書\n病人：，出生於西元年月日，需接受小兒吞嚥攝影。\n立同意書人已經與醫師討論過接受這個手術或醫療處置的效益、風險及替代方案，對醫師\n的說明都已充分了解且同意由貴院施行該項術式或醫療處置。\n立同意書人姓名：（簽章）\n身分證字號/居留證或護照號碼：\n與病人之關係（請圈選）：本人、配偶、父、母、兒、女、其他：_________\n住址：\n電話：\n日期：西元年月日時間：時分\n--------------------------------------------------------------------------------\n（1.如由病人、親屬或關係人簽署本同意書，則無需見證，見證人部分得免填。2.若意識清楚，但無法親自簽具\n者且無親屬或關係人在場，得以按指印代替簽名，惟應有二名見證人。3.若病人意識不清且無親屬或關係人在\n場，醫療緊急情況得由2 名合格醫師在病歷上證明需檢查或治療即可。）\n見證人1：（簽章）見證人2：（簽章）\n見證人1 身分證字號：見證人2 身分證字號：\n日期：西元年月日時間：時分\n病歷號：\n姓名：\n生日：西元年月日\n請詳細閱讀內容，待醫師向您說明後，再簽署同意書第 2 頁\n文件編號\n01400-4-601368\n版次\n05 \n西元2023 年12 月15 日病歷委員會修正通過電子病歷版本 MR 19-20-38\n西元2021 年03 月25 日品質暨病人安全委員會審核通過\n臺大醫院暨兒童醫院影像醫學部門診檢查一般說明書\n檢查\n地點\n兒醫大樓三樓影像醫學部\n聯絡\n電話\n兒醫 270323\n一般注意事項\n請務必詳閱各檢查說明書載明注意事項並填妥同意書，按照約定時間攜帶\n預約通知單、檢查同意書、健保卡或身分證明文件提前至各檢查室登記處\n辦理報到、候檢及準備工作，並請禮讓急重症病患。\n立同意書人須年滿十八歲方具法律效力，檢查對象若未滿十八歲，請務必\n由法定代理人簽妥同意書並陪同到院檢查。\n如需更改日期，請於預約檢查日之前持預約檢查通知單至檢查室登記處辦\n理，或與各檢查室登記處聯絡。\n若因天災或其他因素經行政院人事行政總處發布台北市停止上班﹝災防\n假﹞，各項影像醫學部門診檢查請考量自身安全，並擇期於上班日電洽各\n檢查室登記處以利盡速安排檢查時段。\n檢查注意事項\n一、檢查前注意事項：\n1.請詳閱各檢查說明書載名的抽血、清腸或禁食準備，若未準備妥當將\n導致當日檢查無法如期完成。\n2.各項檢查皆可能會更換檢查服，請穿著輕便衣物以利更換。\n二、檢查中注意事項：\n檢查時請務必聽從醫護人員指示，方能維持高品質的檢查以及保護您的\n安全。\n三、檢查後注意事項：\n檢查報告預計將於七個工作天內完成，請按照門診醫師預約回診時間或\n自行預約檢查完七個工作天後回原門診查看結果。\n資料來源\n影像醫學部\n說明書修訂日期\n114 年2 月10 日\n小兒吞嚥攝影檢查\n兒醫\n3F"}, {"code": "177", "title": "成人吞嚥攝影說明暨同意書", "nature": "診斷檢查", "modality": "X光與透視攝影", "body_raw": "消化(食道)", "body_group": "消化系統", "unit": "東址一樓影像醫學部第11攝影室", "campuses": ["東址"], "audience": ["中文一般/成人"], "prep": ["使用顯影／造影劑"], "phone": "262623", "rel_path": "pdfs/177_成人吞嚥攝影說明暨同意書.pdf", "pdf_url": "https://www.ntuh.gov.tw/ckfinder_file/OPD/files/DOCEMENT/inst177.pdf", "pages": 4, "text": "國立臺灣大學醫學院附設醫院\nNational Taiwan University Hospital\n成人吞嚥攝影說明暨同意書\n成人吞嚥攝影說明書\n這份說明書是有關您即將接受的手術（或醫療處置）的效益、風險及替代方案的書面說明，\n可做為您與醫師討論時的補充資料。最重要的是我們希望您能充份瞭解資料的內容，所以請\n仔細閱讀；如果經醫師說明後您還有對這個手術（或醫療處置）的任何疑問，請在簽名前再\n與您的醫師充分討論，醫師會很樂意為您解答，讓我們一起為了您的健康努力。\n一般注意事項：\n★請於約定時間至檢查地點辦理報到候檢，超過所約時間視為放棄。\n★如臨時因故需更改日期，請於上班時間(星期一至星期五，早上9-12 時；下午1-5 時不包含\n國定假日)與檢查單位聯絡(分機262623)。\n★臨床上自行吞嚥或行動有困難者，請由家屬或照護者陪同前來協助檢查。\n★對說明書內容若有疑問，請於上班時間向診間或檢查單位人員電話 (分機262623) 詢問。\n特殊注意事項：\n一、檢查前注意事項：檢查前不需禁食。\n二、檢查中注意事項：必要時需要請家屬或照護者在旁協助檢查，請儘量與醫護人員合作。\n三、檢查後注意事項：請於檢查後七天，自行約掛門診或依醫師原預約門診時間看檢查結\n果。\n適應症及作法：（簡述）\n適應症：因中風、神經系統疾病、頭頸部癌症或其他疾病所導致吞嚥困難或嗆咳的病人。\n作法：讓受檢者或病人多次喝入不同濃稠度之鋇劑顯影劑，並以連續X 光照射錄影。檢查\n過程中可能須由家屬穿著鉛衣在檢查室內陪同病人受檢，以幫助檢查順利進行。\n效益：\n此項檢查可以用於評估吞嚥功能及吞嚥過程是否發生異常雨嗆咳的可能，以利於後續之治療\n規劃。手術/醫療處置成功率：超過九成。\n風險：\n1.受檢者或病人在檢查中若不慎嗆入大量顯影劑，可能導致吸入性肺炎(發生機率低於百分之\n一)。\n2.鋇劑之過敏反應極為罕見。\n3.此檢查需要病人配合口令進行吞嚥，若意識不清或是無法配合者不適合進行此檢查。\n替代方案：\n耳鼻喉部纖維內視鏡吞嚥檢查(FEES)。此檢查適合評估吞嚥功能，其他替代方案需與醫師討\n論決定。\n病歷號：\n姓名：\n生日：西元年月日\n請詳細閱讀內容，待醫師向您說明後，再簽署同意書第 1 頁\n編號：177\n文件編號\n01400-4-601367\n版次\n07 \n西元2023 年12 月15 日病歷委員會修正通過電子病歷版本 MR 19-20-37\n西元2021 年04 月28 日品質暨病人安全委員會審核通過\n國立臺灣大學醫學院附設醫院\nNational Taiwan University Hospital\n成人吞嚥攝影說明暨同意書\n（成人吞嚥攝影說明書承上頁）\n醫師補充說明/病人提出之疑問及解釋：（如無，請填寫無）\n說明醫師：（簽章）\n日期：西元年月日時間：時分\n成人吞嚥攝影同意書\n病人：，出生於西元年月日，需接受成人吞嚥攝影。立\n同意書人已經與醫師討論過接受這個手術或醫療處置的效益、風險及替代方案，對醫師的\n說明都已充分了解且同意由貴院施行該項術式或醫療處置。\n立同意書人姓名：（簽章）\n身分證字號/居留證或護照號碼：\n與病人之關係（請圈選）：本人、配偶、父、母、兒、女、其他：_________\n住址：\n電話：\n日期：西元年月日時間：時分\n-------------------------------------------------------------------------------\n（1.如由病人、親屬或關係人簽署本同意書，則無需見證，見證人部分得免填。2.若意識清楚，但無法親自簽\n具者且無親屬或關係人在場，得以按指印代替簽名，惟應有二名見證人。3.若病人意識不清且無親屬或關係人\n在場，醫療緊急情況得由2 名合格醫師在病歷上證明需檢查或治療即可。）\n見證人1：（簽章）見證人2：（簽章）\n見證人1 身分證字號：見證人2 身分證字號：\n日期：西元年月日時間：時分\n請詳細閱讀內容，待醫師向您說明後，再簽署同意書第 2 頁\n文件編號\n01400-4-601367\n版次\n07 \n西元2023 年12 月15 日病歷委員會修正通過電子病歷版本 MR 19-20-37\n西元2021 年04 月28 日品質暨病人安全委員會審核通過\n病歷號：\n姓名：\n生日：西元年月日\n臺大醫院暨兒童醫院影像醫學部門診檢查一般說明書\n檢查\n地點\n東址一樓影像醫學部第11 攝影室\n聯絡\n電話\n東址 262623\n一般注意事項\n請務必詳閱各檢查說明書載明注意事項並填妥同意書，按照約定時間攜帶\n預約通知單、檢查同意書、健保卡或身分證明文件提前至各檢查室登記處\n辦理報到、候檢及準備工作，並請禮讓急重症病患。\n立同意書人須年滿十八歲方具法律效力，檢查對象若未滿十八歲，請務必\n由法定代理人簽妥同意書並陪同到院檢查。\n如需更改日期，請於預約檢查日之前持預約檢查通知單至檢查室登記處辦\n理，或與各檢查室登記處聯絡。\n若因天災或其他因素經行政院人事行政總處發布台北市停止上班﹝災防\n假﹞，各項影像醫學部門診檢查請考量自身安全，並擇期於上班日電洽各\n檢查室登記處以利盡速安排檢查時段。\n檢查注意事項\n一、檢查前注意事項：\n1.請詳閱各檢查說明書載名的抽血、清腸或禁食準備，若未準備妥當將\n導致當日檢查無法如期完成。\n2.各項檢查皆可能會更換檢查服，請穿著輕便衣物以利更換。\n二、檢查中注意事項：\n檢查時請務必聽從醫護人員指示，方能維持高品質的檢查以及保護您的\n安全。\n三、檢查後注意事項：\n檢查報告預計將於七個工作天內完成，請按照門診醫師預約回診時間或\n自行預約檢查完七個工作天後回原門診查看結果。\n資料來源\n影像醫學部\n說明書修訂日期\n114 年2 月10 日\n成人吞嚥攝影檢查\n東\n址\n1F"}, {"code": "189", "title": "乳房攝影檢查注意事項說明書", "nature": "診斷檢查", "modality": "乳房影像與切片", "body_raw": "乳房", "body_group": "乳房", "unit": "東址六樓健康管理中心乳房攝影室", "campuses": ["東址"], "audience": ["中文一般/成人"], "prep": [], "phone": "262623", "rel_path": "pdfs/189_乳房攝影檢查注意事項說明書.pdf", "pdf_url": "https://www.ntuh.gov.tw/ckfinder_file/OPD/files/DOCEMENT/inst189.pdf", Committee on Oct. 11, 2024 MR19-331\nApproved by the Quality and Patient Safety Committee on Dec. 13, 2024\nMedical Record No.:\nName:\nBirthday(yyyy/mm/dd):\nPlease read the information thoroughly, await the physician’s explanation, and then sign the consent form.\n文件編號 01400-4-601655 版次 02 \nCoronary CT Angiography Exam Instruction Form\nGeneral instructions:\n1. On the appointment day, please report to the nursing staff at the exam room with the\nappointment reminder form, exam consent form, ID card, Taiwan National Health Insurance\nCard (if applicable) .\n2. For inquiries or rescheduling, please contact the exam room at 2356-2301during business hours.\n(Monday - Friday from 8:00am-5:00pm)\n3. Please discuss with your doctor or the staff in the exam room if you have any questions\nconcerning this exam.\n4. Being accompanied by a family member is strongly recommended.\nSpecial instructions:\n1. Before the exam:\na. Please avoid caffeinated drinks (e.g. coffee, tea, coke, and chocolate) for 12 hours before the\nexam. These substances will increase heart rate, which will affect the quality of the image.\nPlease do not eat or drink anything for 4 hours before the exam. (You may take your\nprescribed medication, except for diabetic medication). Diabetic patients may have a small\namount of syrup.\nb. Please inform your doctor if you are pregnant or have any history of allergies or kidney\ndysfunction. Before you decide to undergo this exam, please discuss its risks and benefits\nwith your doctor.\nc. Please inform the staff in the exam room if you have a history of asthma or have had\ncoronary artery bypass surgery.\n2. During the exam:\na. If your heart rate is higher than 100 bpm and if there are no contraindications, you will be\ngiven Propranolol (Inderal) orally to lower your heart rate. It may take 1 to 1.5 hours for the\nmedication to take effect. Please wait patiently. The side effects of this drug include\nbradycardia, hypotension, weakness, tiredness, dizziness, nausea, shortness of breath,\nlightheadedness and lethargy. If you experience any discomfort, please inform the medical\nstaff immediately.\nb. If your heart rate is irregular or does not slow down, a blurred image may possibly affect the\ndoctor’s interpretation.\nc. An intravenous line will be inserted into your arm. Three small electrode patches will be\nplaced on the chest. The electrodes are attached to an electrocardiograph monitor, which will\nregister your heart’s electrical activity during the test.\nd. During the scan, you will be asked to hold your breath several times (for about 10 seconds\neach time). Please follow the medical staff’s instructions. Breathing during these periods\nwill interfere with the scan and affect the quality of images and the accuracy of the exam.\n3. After the exam:\na. If you feel any discomfort after the test, please return to the exam room or go to the ER of\nour hospital.\nb. Please drink plenty of water to help flush the contrast agent out of your body.\nPossible side effects of the contrast agent: (Nonionic low-osmolarity contrast agent will be used in this exam)\n1.During the injection of the contrast agent, some people may experience a warm sensation, nausea,\nvomiting, dizziness or sneezing, but these symptoms usually subside within a short time.\n2. A few patients may have severe reactions such as systemic hives, chills, and difficulty breathing.\n3. In very rare cases, patients may experience swelling of the throat, asthmatic attacks, low blood\npressure, cardiopulmonary arrest, and sudden death (one in a hundred thousand).\n(Continued on page 2)\nNo. 229\nPage: 2\n國立臺灣大學醫學院附設醫院\nNational Taiwan University Hospital\nCoronary CT Angiography Exam\nInstruction and Consent Form\nApproved by the Medical Records Committee on Oct. 11, 2024 MR19-331\nApproved by the Quality and Patient Safety Committee on Dec. 13, 2024\nMedical Record No.:\nName:\nBirthday(yyyy/mm/dd):\nPlease read the information thoroughly, await the physician’s explanation, and then sign the consent form.\n文件編號 01400-4-601655 版次 02 \n(Continued from page 1)\n4. For patients who have a history of heart disease, asthma, allergy to contrast agents, kidney\ndysfunction, or other unusual illnesses, the adverse reaction rate may be higher.\n5. Before the contrast injection, the medical staff will inject normal saline to check the patency of\nthe intravenous line. For approximately 0.7% of patients, the contrast agent may leak to the\nsubcutaneous tissue or muscles. This may cause redness, swelling, or pain in the area of\ninjection. Subcutaneous pain and swelling will typically subside in a few days. For some\npatients, inflammation, ulcer, or local nerve compression may occur; please inform your\nphysician immediately. Hospitalization for surgical interventions such as skin grafting may be\nneeded.\nIndications and Alternatives:\nThe test can detect narrowing or blockages in the coronary arteries. The test can also be used to\nevaluate a stent implantation or for a bypass graft follow-up. An alternative procedure is cardiac\ncatheterization.\nSupplemental instructions from the physician: (If none, please write “none”)\nIf you have any questions, please discuss them with your doctor, and request him/she to provide\nanswers in writing for your reference.\nSignature of the Physician: ___________________________________________\nDate: _______/_______/___________ (MM/DD/YYYY) Time: ______/______\nCoronary CT Angiography Exam Consent Form\nI (the patient) , born on ____/____/______ (MM/DD/YYYY),\ndue to ______________ require a Coronary CT Angiography exam. I have discussed the benefits,\nrisks, and alternative treatment options of the proposed exam with the physician. I fully understand\nall the instructions and explanations from the physician and hereby give consent for the treatment.\nSignature of the consenting party: _____________________________\nI.D. No:___________________________ Phone number：_____________________\nRelation to the patient: self, spouse, guardians, son, daughter, or others：__________\nAddress：____________________________________________________________\nDate: _____/_____/_______ (MM/DD/YYYY) Time: ______/______\n---------------------------------------------------------------------------------------------------------------------\n(1) In case that the patient, his/her relative, or interested party signs the consent form, there is no witness needed. (2) In\ncase that the patient is conscious but unable to sign the consent form and no relative or interested party is present, the\npatient’s signature may be replaced by fingerprint and two witnesses are required. (3) In case that the patient is not\nclearly conscious and no relative or interested party is present, under emergent condition and two qualified physicians\nconfirmed and documented on the medical record about the emergency, then emergent examination or treatment may\nbe performed.\nWitness：_____________________________ Witness:_______________________________\nID No: ______________________________ ID No: ________________________________\nDate: _____/_____/______ (MM/DD/YYYY) Time: ______/______\nCoronary CT Angiography Exam\nRegistration\nAdmission\nService Center\nNo.7,Chung Shan S. Road\nER\nMain Building\n(East campus 1F)"}, {"code": "230", "title": "MRI (Magnetic Resonance Imaging) Instruction and Consent Form [磁振掃描攝影檢查說明暨同意書(英文版)]", "nature": "診斷檢查", "modality": "MRI 磁振造影", "body_raw": "全身", "body_group": "全身", "unit": "東址一樓磁振造影室、西址一樓磁振造影室、兒童醫院三樓磁振造影室", "campuses": ["東址", "西址", "兒醫大樓"], "audience": ["英文版"], "prep": ["需禁食／空腹", "使用顯影／造影劑", "含麻醉或鎮靜"], "phone": "262540、262636、270323", "rel_path": "pdfs/230_MRI (Magnetic Resonance Imaging) Instruction and Consent Form [磁振掃描攝影檢查說明暨同意書(英文版)].pdf", "pdf_url": "https://www.ntuh.gov.tw/ckfinder_file/OPD/files/DOCEMENT/inst230.pdf", "pages": 6, "text": "\nApproved by the Medical Records Committee on Apr. 15, 2025 MR 19-332\nApproved by the Quality and Patient Safety Committee on Mar. 19, 2025\n國立臺灣大學醫學院附設醫院\nNational Taiwan University Hospital\nMRI (Magnetic Resonance Imaging)\nInstruction and Consent Form\nPage: 1\nPlease read the information thoroughly, await the physician’s explanation, and then sign the consent form.\n文件編號\n01400-4-601656\n版次\n03\n病歷號:\n姓名:\n生日:西元年月日\nNo. 230\nMRI Instruction Form\nSurgery/medical treatment indications and practices (in brief)\nIndication: Help clinical physicians to diagnose, monitor lesions and evaluate treatment effectiveness.\n※ General instructions:\n1. Please arrive ten minutes prior to your appointment time with your appointment reminder form\nto check-in at East campus: 1st floor MRI room, West campus: 1st floor MRI room or Children\nhospital: 3rd floor MRI room. You will be considered a no-show if you fail to arrive for your\nappointment on time.\n2. For inquiries or rescheduling, please contact the exam room a day before your exam, during\noffice hours. Monday-Friday from 8:00am-5:00pm.\n※ Special instructions:\n1. The day before the exam:\nFor infants, sleep time should be reduced by half or more in order to facilitate the\nadministration of a sedative drug (this is not necessary for adults).\n2. On the day of the exam:\na、 If the examined body part includes abdomen or pelvis, please fast at least 4 hours prior to the\nexam. For patients who require sedation, please do not eat or drink anything for at least 6\nhours prior to the exam. Other patients do not need to fast. All patients may take their usual\nmedications.\nb、To avoid itching and magnetic interference during the exam, please do not use cosmetics or\nhair cream.\nc、 Please remove valuable items, metal objects (such as hairpins), and magnetic objects (such as\nbankcards or USBs) prior to the exam.\nd、Prior to the exam, please inform the exam staff if you have had heart or vascular surgeries\ninvolving pacemakers, arterial stents, tracheostomy metallic tubes or any surgical implants.\nPlease inform the exam staff
