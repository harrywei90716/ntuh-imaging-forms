before the exam.\ne、 Prior to the exam, please inform the exam staff if you have had allergic reactions with contrast\nagents, moderate to end-stage kidney diseases, or refuse to have the contrast agent injected.\nf、 Please fill out the MRI Consent Form and hand it over to our medical staff in the exam room.\n3. If necessary, the gadolinium-based contrast agent, will be injected to improve the visibility of\ninternal body structure. The nurse will insert an intravenous line and inject saline to check the\npatency of the intravenous line. For approximately 0.7% of patients, the contrast agent may leak to\nthe subcutaneous tissue or muscles. This may cause redness, swelling, or pain in the area of\ninjection. Subcutaneous pain and swelling will typically subside in a few days. For a few patients,\ninflammation, ulcer, or local nerve compression may occur; please inform your physician\nimmediately. Hospitalization for surgical interventions such as skin grafting may be needed.\n(Continued on page 2)\n\nApproved by the Medical Records Committee on Apr. 15, 2025 MR 19-332\nApproved by the Quality and Patient Safety Committee on Mar. 19, 2025\n國立臺灣大學醫學院附設醫院\nNational Taiwan University Hospital\nMRI (Magnetic Resonance Imaging)\nInstruction and Consent Form\nPage: 2\nPlease read the information thoroughly, await the physician’s explanation, and then sign the consent form.\n文件編號\n01400-4-601656\n版次\n03\n病歷號:\n姓名:\n生日:西元年月日\n(Continued from page 1)\n4. Results will be available 7 days after the exam and should be discussed with your doctor during\nthe prescheduled follow-up appointment or an appointment to be obtained.\nBenefits of surgery/medical procedure:\nIf the patient is willing to cooperate, the failure rate is below 1%. However, slight differences may\noccur according to the differences in the area and method of examination.\nRisk of surgery/medical procedure:\nIf necessary, the gadolinium-based contrast agent will be injected to improve the visibility of\ninternal body structure. The gadolinium-based contrast agent is a water-soluble contrast agent that\ndoes not contain iodine. Some adverse reactions include hives, vomiting, twitching, headaches,\nnausea, etc. The above adverse reactions occur in approximately two in ten thousand patients.\nIn very rare cases patients may suffer from an anaphylactic reaction or nephrogenic systemic\nfibrosis/nephrogenic fibrosing dermopathy (NSF/NFD), which can be life-threatening.\nPlease discuss this with your physician. The gadolinium-based contrast agent is temporarily present\nin the breast milk of breastfeeding mothers who have received the injection of the contrast agent,\nbut it will not be absorbed by the intestine. In general, you can continue breastfeeding.\nIf you have any concerns, you may breastfeed 24 hours after the injection of the contrast agent.\nAlternatives:\nPlease discuss with your physician if you would like to receive alternative imaging exams such as\nultrasound or CT scan.\nArea of interest:\n□ Right side □ Left side □ Not-specified\n□ Brain □ Neck □ Chest □ Abdomen □ Pelvis □ Extremities □ Spine\nSpecific site/ protocol:\nSupplemental instructions from the physician; patient’s questions and physician’s explanations:\n(If none, please write “none”)\nSignature and title of the Physician:\nDate:\n/\n/\n(MM/DD/YYYY)\nTime:\n/\n\nApproved by the Medical Records Committee on Apr. 15, 2025 MR 19-332\nApproved by the Quality and Patient Safety Committee on Mar. 19, 2025\n國立臺灣大學醫學院附設醫院\nNational Taiwan University Hospital\nMRI (Magnetic Resonance Imaging)\nInstruction and Consent Form\nPage: 3\nPlease read the information thoroughly, await the physician’s explanation, and then sign the consent form.\n文件編號\n01400-4-601656\n版次\n03\n病歷號:\n姓名:\n生日:西元年月日\nMRI Consent Form\nI (the patient)\n, born on /\n/\n(MM/DD/YYYY), require an MRI exam.\nI have discussed the benefits, risks, and alternative treatment options of the proposed exam with the\nphysician. I fully understand all the instructions and explanations from the physician and hereby give\nconsent to the treatment.\nSignature of the consenting party:\nI.D. No.:\nPhone number：\nRelation to the patient: self, spouse, guardians, son, daughter, or others：\nAddress：\nDate:\n/\n/\n(MM/DD/YYYY)\nTime:\n/\n(1) In case that the patient, his/her relative, or interested party signs the consent form, there is no witness needed. (2) In\ncase that the patient is conscious but unable to sign the consent form and no relative or interested party is present, the\npatient’s signature may be replaced by fingerprint and two witnesses are required. (3) In case that the patient is not clearly\nconscious and no relative or interested party is present, under emergent condition and two qualified physicians confirmed\nand documented on the medical record about the emergency, then emergent examination or treatment may be performed.)\nWitness 1：\nWitness2:\nI.D. No.:\nI.D. No.:\nDate:\n/\n/\n(MM/DD/YYYY)\nTime:\n/\nMRI(Magnetic Resonance Imaging)Exam\nMain Building\n(East campus 1F)\nER\nNo.7,Chung Shan S. Road\nAdmission\nService Center\nRegistration\nSurgery\n(Clinics 3-11)\nSurgery\n(Clinics 12-20)\nService Counter\nMedical Information\nManagement Office\nLobby\nMain Entrance\nAmbulatory\nService Office\nOriginal Building\n(West campus 1F)\nNo.1, Changde St.\nMRI(Magnetic Resonance Imaging)Exam\n7th Lecture Hall\nMRI (Magnetic Resonance Imaging) Exam\nNursing Station\nX Ray\nX Ray\nX Ray\nChanging Room\nRegistration\nWaiting Area\nChanging Room\nMen's room\n親子\n廁所\nFamily restroom\nLadies' room\nHospital Bed Elevator\nVisitor Elevator\nClinics Elevator\nChildren’s Hospital\n3F\nEscalator\nNo.8, Chung Shan S. Road\nBreastfeeding\nRoom\nQingdao W. Rd"}, {"code": "231", "title": "CT (Computed Tomography) Scan Instruction and Consent Form [電腦斷層攝影檢查說明暨同意書(英文版)]", "nature": "診斷檢查", "modality": "CT 電腦斷層", "body_raw": "全身", "body_group": "全身", "unit": "東址一樓電腦斷層掃描室、兒醫大樓三樓電腦斷層掃描室", "campuses": ["東址", "兒醫大樓"], "audience": ["英文版"], "prep": ["需禁食／空腹", "使用顯影／造影劑", "需驗腎功能 (Cre)"], "phone": "262301、263667、270323", "rel_path": "pdfs/231_CT (Computed Tomography) Scan Instruction and Consent Form [電腦斷層攝影檢查說明暨同意書(英文版)].pdf", "pdf_url": "https://www.ntuh.gov.tw/ckfinder_file/OPD/files/DOCEMENT/inst231.pdf", "pages": 5, "text": "Page: 1\n國立臺灣大學醫學院附設醫院\nNational Taiwan University Hospital\nCT (Computed Tomography) Scan\nInstruction and Consent Form\nApproved by the Medical Records Committee on Dec. 19, 2024 MR19-335\nApproved by the Quality and Patient Safety Committee on Dec. 13, 2024\nPlease read the information thoroughly, await the physician’s explanation, and then sign the consent form.\n文件編號 01400-4-601659 版次04 \nMedical Record No.:\nName:\nBirthday(yyyy/mm/dd):\nCT Scan Instruction Form\nIndications:\nPatients who are advised to receive an imaging exam based on the clinician’s evaluation\n※ General instructions:\n1. Please arrive on time for the appointment and wait for your number to be called. Preparation\nvaries, depending on the area to be scanned. Inpatients and ER patients will have priority.\n2. Please bring the appointment reminder form, exam consent form, ID card, and Taiwan National\nHealth Insurance Card on the appointment day.\n3. If you have any questions, please contact the exam room during office hours (East campus:\n2356-2301; West campus: 2356-2636).\n※ Special instructions:\n1. If you need to receive contrast media injection, no food or drink for at least four hours\nbefore the exam. However, you may take your regular medication (e.g. medication for\nhypertension and heart disease, but not diabetic medication). Diabetic patients can have candy or\nchocolates to prevent low blood sugar.\n2. On the day of the exam, please wear clothing with no metal closures such as sportswear.\n3. X-rays are used during this procedure. It is therefore of crucial importance to be sure that the\npatient is not pregnant. Patients who are weak or are required to receive a contrast injection must\nbe accompanied by a family member.\n4. Results will be available 7 days after the exam and should be discussed with your doctor during\nthe prescheduled follow-up appointment or an appointment to be obtained.\n5. Patients planning on undergoing a contrast agent injection must present serum creatinine(Cre)\nlevel obtained within three months. Please complete a blood test within the three-month period\nprior to the injection. On the day of the examination, patients who were unable to undergo the\nblood test at our hospital may bring an official report of their serum Cre issued by other hospitals\nor medical laboratories to serve as a reference. If a physician has determined that a hospitalized\npatient or a patient undergoing emergent treatments is experiencing short-term or acute changes\nin renal function, it is highly recommended that his or her serum Cre level is rechecked within\nthe three days prior to the CT scan.\n6. Patients planning on undergoing a contrast agent injection must notify the attending physician\nand staff performing the CT scan examination if they have one or more of the following\nconditions: renal dysfunction, hyperthyroidism, pheochromocytoma, myasthenia gravis, and\nallergy drugs and contrast agents.\nBenefits:\nTo provide the clinical physician with advanced information for further evaluation. When the\npatient is able to cooperate, the failure rate is lower than 1%. Variations in such rates may occur\nbased on examination site and method.\nRisks:\nThe contrast agent may cause some side effects (for most patients, the contrast agent will be\ninjected to improve the visibility of the internal body structure).\n1. Some patients may experience a warm sensation, nausea, vomiting, dizziness, or sneezing during\nthe injection of the contrast agent. These symptoms usually subside within a short time. Patients\nwith allergies may experience symptoms such as dermatitis, hives, and chills. Severe allergic\nNo. 231\nPage: 2\n國立臺灣大學醫學院附設醫院\nNational Taiwan University Hospital\nCT (Computed Tomography) Scan\nInstruction and Consent Form\nApproved by the Medical Records Committee on Dec. 19, 2024 MR19-335\nApproved by the Quality and Patient Safety Committee on Dec. 13, 2024\nPlease read the information thoroughly, await the physician’s explanation, and then sign the consent form.\n文件編號 01400-4-601659 版次04 \nMedical Record No.:\nName:\nBirthday(yyyy/mm/dd):\nreactions include laryngeal edema, asthmatic attacks, low blood pressure, cardiopulmonary\narrest, and sudden death (incidence rate of one per hundred thousand). The degree of adverse\nreaction may vary among individuals receiving contrast agent injection. Inform the physician of\nany allergies including drug allergies and your reaction to them.\n2. Some patients may experience vein swelling. Please do not apply hot pack on it. If you feel\nunwell, please return to the CT room or go to the ER immediately.\n3. Patients with hyperthyroidism, pheochromocytoma, or myasthenia gravis may experience\nexacerbated symptoms following a contrast agent injection. Please inform the physician\nbeforehand and take the relevant precautions when necessary.\n4. Patients with renal dysfunction with Cre levels around or equal to 2.0mg/dL but are not on\ndialysis and not subjected to fluid restriction, are recommended to maintain a hydration protocol\nwith water (100 mL/hour) 12 hours before and after the CT scan. For patients with a Cre level\ngreater the 2.0mg/dL, a contrast agent injection will increase the risk of short-term or lifelong\ndialysis.\n5. To prevent contrast agent induced nephropathy, we suggest that patients with kidney dysfunction\nstop taking Metformin for 48 hours before the CT scan; resume medication when proper kidney\nfunction is verified 48 hours after the scan. Patients are advised to discuss if they should stop\ntaking the medication or not with their doctors.\n6. For approximately 0.7% of patients, the contrast agent may leak to the subcutaneous tissue or\nmuscles. This may cause redness, swelling, or pain in the area of injection. Subcutaneous pain\nand swelling will typically subside in a few days. For some patients, inflammation, ulcer, or local\nnerve compression may occur; please inform your physician immediately. Hospitalization for\nsurgical interventions such as skin grafting may be needed. Increased risk of contrast agent\nextravasation is associated with altered level of consciousness, irritable state, skin edema, and\npoor venous acess.\n7. If you have plans to undergo a thyroid scan involving a radioisotope, please avoid injecting and\niodinated contrast agent within the two-month period prior to the scan so as not to reduce\ntreatment effects. Nursing mothers may continue to breastfeed after receiving an injection of an\niodinated medium compound.\n※Potential adverse effects of ionizing radiation exposure are generally stochastic. To obtain a\nbooklet [for further information] on this, please contact our medical staff (KM system/Knowledge\ncenter/Medical support units/Department of Medical Imaging/Instruction and consent forms/FAQs\non CT scan.doc)\nAlternatives:\nPlease discuss with your physician if you would like to receive alternative imaging exams such as\nultrasound, MRI, or PET.\nWe can provide a non-ionic contrast agent that has fewer adverse reactions. Since Feb. 1, 2011, the\nTaiwan National Health Insurance has cancelled the limitation that prevented use of a non-ionic\ncontrast agent. The fee, except for elected self-pay exams, is covered by the Taiwan National\nHealth Insurance plan for eligible patients.\nSupplemental instructions from the physician/patient’s questions and physician’s\nexplanation: (If none, please write “none”)\nSignature of the Physician: ___________________________________________\nDate: _______/_______/___________ (MM/DD/YYYY) Time: ______/_______\nPage: 3\n國立臺灣大學醫學院附設醫院\nNational Taiwan University Hospital\nCT (Computed Tomography) Scan\nInstruction and Consent Form\nApproved by the Medical Records Committee on Dec. 19, 2024 MR19-335\nApproved by the Quality and Patient Safety Committee on Dec. 13, 2024\nPlease read the information thoroughly, await the physician’s explanation, and then sign the consent form.\n文件編號 01400-4-601659 版次04 \nMedical Record No.:\nName:\nBirthday(yyyy/mm/dd):\nCT Scan Consent Form\nI, (the patient) _______________________________________, born on _____/_____/______\n(MM/DD/YYYY), due to ______________ require a CT Scan. I have discussed the benefits, risks,\nand alternative treatment options of the proposed exam with the physician. I fully understand all the\ninstructions and explanations from the physician and hereby give consent to the treatment.\nSignature of the consenting party: _____________________________\nI.D. No.:___________________________ Phone number：_____________________\nRelation to the patient: self, spouse, guardians, son, daughter, or others：__________\nAddress：____________________________________________________________\nDate: _____/_____/_______ (MM/DD/YYYY) Time: ______/_______\n------------------------------------------------------------------------------------------------------------------------\n(1)In case that the patient, his/her relative, or interested party signs the consent form, there is no witness needed. (2) In case\nthat the patient is conscious but unable to sign the consent form and no relative or interested party is present, the patient’s\nsignature may be replaced by fingerprint and two witnesses are required. (3)In case that the patient is not clearly conscious\nand no relative or interested party is present, under emergent condition and two qualified physicians confirmed and\ndocumented on the medical record about the emergency, then emergent examination or treatment may be performed.\nWitness1：____________________________ Witness2:_______________________________\nID No.: ______________________________ ID No.: ________________________________\nDate: _____/_____/______ (MM/DD/YYYY) Time: ______/_______\nCT Scan Exam\n(Computed Tomography)\n※ Please report to the registration\nRegistration\nRegistration\nCT (Computed Tomography) Scan Exam\nHospital Bed Elevator\nVisitor Elevator\nClinics Elevator\nEscalator\nX Ray\nX Ray\nX Ray\nRegistration\nNo.8, Chung Shan S. Road\nQingdao W. Rd\nChildren’s Hospital\n3F"}, {"code": "239", "title": "預防保健乳房X光攝影檢查注意事項說明書", "nature": "診斷檢查", "modality": "乳房影像與切片", "body_raw": "乳房", "body_group": "乳房", "unit": "東址一樓影像醫學部第9攝影室、健康大樓B1樓", "campuses": ["東址", "健康大樓"], "audience": ["中文一般/成人"], "prep": [], "phone": "262623", "rel_path": "pdfs/239_預防保健乳房X光攝影檢查注意事項說明書.pdf", "pdf_url": "https://www.ntuh.gov.tw/ckfinder_file/OPD/files/DOCEMENT/inst239.pdf", "pages": 3, "text": "239 號說明書\n台大醫院預防保健乳房X 光攝影檢查注意事項說明書\n檢查\n地點\n新大樓(東址)一樓大廳後面女性乳房影像中心\n(請詳背面簡要圖示)\n聯絡\n電話\n02-23562623\n一\n般\n注\n意\n事\n項\n請攜帶健保卡及填妥問卷於約定時間至檢查地點辦理報到候檢，超過所約時間視為放\n棄。\n如需更改日期，請於預約檢查日之前持預約檢查通知單至檢查單位辦理，或與檢查單\n位電話（02-23562623）聯絡，否則視同放棄。\n檢查時間約需30 分鐘。\n特\n殊\n注\n意\n事\n項\n一、檢查前注意事項：\n1.請穿著兩段式服裝前來檢查，以輕便為原則。\n2.當日檢查地點「女性乳房影像中心」，請至影醫部「第九或十攝影室」插健保卡\n報到取號碼牌，採先報到先作，請於現場耐心等候。\n二、檢查中注意事項：\n檢查時需除去上半身衣物，並以局部加壓器加壓4~15 公斤於受檢部位，可能稍有\n不適，請盡量配合醫護人員的指導，以得到最清晰的影像。\n三、檢查後注意事項：\n檢查結果通知書約4 週後寄發，實際寄發時間需以院內作業流程為主，敬請耐心等\n候。\n四、其他注意事項：\n1.預防保健乳房攝影檢查為每兩年免費篩檢一次，本院預約登記後，請勿至其他醫\n療院所(包含乳攝車)重複登記或檢查。\n2.欲取消檢查或當日未執行檢查者，請持健保卡至癌篩中心重新辦理。\n3.癌症篩檢中心電話：(02)23123456 轉266455。\n服務時間：週一~週五8：30~17：00，國定假日依本院公告休診。\n(請翻閱背面)\n資\n料\n來\n源\n影像醫學部\n繪\n圖\n工務室\n說明書修訂日期\n113 年3 月5 日\n預防保健乳房攝影檢查\n東\n址\n1F\n239 號說明書\n臺大醫院預防保健乳房攝影檢查地點簡要圖示\n健康大樓B1F 示意圖\n中山南路12 號\n請至健康大樓1F 搭乘電梯或電扶梯至\nB1F 乳房攝影室"}, {"code": "240", "title": "磁振正子掃描檢查說明暨同意書", "nature": "診斷檢查", "modality": "MRI 磁振造影", "body_raw": "全身", "body_group": "全身", "unit": "東址一樓影像醫學中心磁振正子掃描室", "campuses": ["東址"], "audience": ["中文一般/成人"], "prep": ["需禁食／空腹", "使用顯影／造影劑", "含麻醉或鎮靜"], "phone": "262540", "rel_path": "pdfs/240_磁振正子掃描檢查說明暨同意書.pdf", "pdf_url": "https://www.ntuh.gov.tw/ckfinder_file/OPD/files/DOCEMENT/inst240.pdf", "pages": 5, "text": "適應症：本檢查常用於癌症診斷、分期與治療評估。\n※一般注意事項：\n★請持原預約單於排定時間提早60-80分鐘至東址新大樓一樓影像醫學中心「磁振正\n子掃描室」辦理報到候檢。\n★因本檢查所用使用藥物的時效性非常短，請受檢者務必依排定時間報到受檢，若延\n遲則可能會影響受檢權益。\n★若無法依排定時間受檢而須更改日期，請提前於預約檢查日前兩個工作日通知本\n部，連絡電話(02)23123456 轉分機 265142(星期一~五上午 8:00~下午 5:00)，否\n則視同放棄。\n★本檢查使用藥物價格昂貴，且具備短半衰期時效性之同位素藥物，需於檢查前為每\n位使用者事先訂製，並於檢查當日生產並以專車送達本院。訂製之同位素藥物效期極\n短無法轉予其他病友使用，故若無事先取消則無法退費。\n※特殊注意事項：\n一、檢查前注意事項：\n1.因糖尿病使用降血糖藥物、可能懷孕者，及過去一個月曾接受腸胃道鋇劑檢查\n時，可能影響影像品質，請主動告知診間醫師。\n2.檢查前一天請避免劇烈運動，因運動後會造成肌肉吸收葡萄糖，將影響本檢查準\n確性。\n3.嬰幼兒(6歲以下)於檢查前一晚至少減少一半以上的睡眠時間，以便於檢查當日\n較易實施簡易鎮靜入睡。\n4.檢查前需禁食4-6小時，但可飲用少許白開水。不能合作須鎮靜者，則必需完全\n禁食至少6小時。\n5.不需停服日常藥物。糖尿病友請勿於禁食期間服用/施打降血糖藥物，以避免低\n血糖造成生命危險。\n6.掃描進行時間約60-90分鐘，若無法靜躺者，請事先與診間醫師討論。\n7.檢查當日請勿化妝、勿用髮油、以免檢查中發癢及干擾影像。\n8.請勿佩戴貴重物品、金屬飾物(如：髮飾、髮夾、耳環等)、磁性物質(如：金融\n卡、遙控器等)。\n9.過去曾接受心臟或血管手術，裝置有心律調節器，動脈瘤金屬夾、氣切金屬管或\n體內有骨釘、金屬鋼片等金屬植入物者應先告知檢查室醫護人員，同時請填妥「磁振\n正子安全規範同意書」。\n10.具有過敏史或藥物不良反應史、中重度腎臟功能不全，以及拒絕使用造影劑\n時，應先告知檢查室醫護人員。\n11.依照本院規定全身磁振正子掃描-磁振掃描(健檢)自費費用為45600元、全身磁\n振正子掃描-正子掃描(健檢)自費費用為43800元、全身磁振正子掃描-綜合報告(健\n檢)自費費用為2400元。\n二、檢查進行方式與注意事項：\n1.至登記處報到，填寫基本資料，並領取檢查服。\n2.至更衣室更換檢查服，身上的金屬物要全數換下。\n3.測量身高、體重及血糖值。\n4.進入注射室等候注射放射性藥物。\n適應症及作法：（簡述）\n編號：240\n磁振正子掃描檢查說明書\n西元2025年04月14日病歷委員會修正通過電子病歷版本 MR 19-20-51\n西元2025年03月19日品質暨病人安全委員會審核通過\n版次\n01400-4-601783\n7\n文件編號\nNational Taiwan University Hospital\n國立臺灣大學醫學院附設醫院\n磁振正子掃描檢查說明暨同意書\n第1頁\n請詳細閱讀內容，待醫師向您說明後，再簽署同意書\n病歷號:\n姓名:\n生日:\n此檢查為磁振掃描和正子掃描同步進行。與單獨接受正子斷層掃描相較，磁振正子掃\n描輻射劑量較低，對於組織解析度較高。如果分別進行正子斷層掃描和磁振掃描，則\n無法達成準確的影像融合，需時也較長。\n目前健保不給付磁振正子掃描，只於適當案例中擇一給付正子斷層掃描、磁振掃描。\n其它替代方案包含電腦斷層掃描、磁振掃描、正子斷層掃描、超音波、Ga-67腫瘤掃\n描。如果您有任何問題，可與您的主治醫師討論。\n1.依據體重的不同，約需要注射5-10毫居里的放射性藥物，會對受試者產生3.5-7毫西\n弗的輻射劑量。根據文獻報告，台灣的天然背景輻射值為每年1.62毫西弗。注射後人\n體內僅帶有微量輻射，毋須特別防護，但建議避免長時間近距離接觸孕婦及嬰幼兒。\n2.文獻中有極少數個案報告，因為放射性藥物而產生發癢的暫時性皮膚疹。\n3.放射性藥物的品質為無菌、無熱源、高放射化學純度，所造成的不適反應極為罕\n見，偶有暫時性血壓過低、暫時性的低血糖或高血糖、暫時性的鹼性磷酸每增加症\n狀，如有不適請立即反應或與本單位聯絡。\n4.含釓(gadolinium)造影劑可能導致蕁麻疹、嘔吐、抽筋、頭痛、噁心等其機率約為\n萬分之二（二百萬人次之統計)。僅有極少數案例因藥物過敏而致死。\n5.含釓(gadolinium)造影劑，有極少機會導致腎源性全身纖維化 (nephrogenic\nsystemic fibrosis, NSF)，少數病人因而發生肺纖維化致死。\n6.注射藥物前，醫護人員會為您先施打靜脈軟針，並檢查注射血管之通暢性。但仍有\n少數病人，發生藥物滲漏至皮下組織或肌肉(機率約0.7%)，而致產生局部紅腫、疼痛\n之現象。皮下腫痛會在數日後隨藥物吸收而慢慢消失，但亦有少數人出現嚴重發\n炎、潰瘍、及局部神經壓迫反應，而需接受住院觀察、外科處置或植皮。\n偵測病灶，提供臨床醫師評估病程之所需。在病人可配合之情況下，失敗率小於\n1%，依照檢查部位及方式不同可能有些微差異。\n5.接受靜脈注射放射性藥物，注射後須安靜躺在燈光微亮的注射室，等待藥物均勻\n吸收。等候時盡量全身放鬆休息，避免走動、閱讀、咀嚼及談話。\n6.進行掃描前，請先如廁排空尿液，避免影響檢查結果判讀。\n7.進行全身或局部掃描(掃描時間約60-90分鐘)，檢查時請放鬆靜躺，保持自然呼\n吸。\n8.檢查結束後需稍候幾分鐘，由醫師判讀影像是否須接受延遲造影，如需延遲造影\n再由放射師與您約定時間，如不需要則可更衣後離開。\n三、檢查後注意事項：\n1.檢查後多喝水，可加速藥物由尿液排出，降低輻射劑量。\n2.注射後當天應避免長時間近距離接觸孕婦及嬰幼兒。\n3.一般建議注射後8小時內不要哺乳與懷抱嬰幼兒。\n4.請於檢查後七天，自行預約門診或依原預約門診時間看檢查結果。\n效益：\n風險：\n替代方案：\n西元2025年04月14日病歷委員會修正通過電子病歷版本 MR 19-20-51\n西元2025年03月19日品質暨病人安全委員會審核通過\n版次\n01400-4-601783\n7\n文件編號\nNational Taiwan University Hospital\n國立臺灣大學醫學院附設醫院\n磁振正子掃描檢查說明暨同意書\n第2頁\n請詳細閱讀內容，待醫師向您說明後，再簽署同意書\n病歷號:\n姓名:\n生日:\n(1.如由病人、親屬或關係人簽署本同意書，則無需見證，見證人部分得免填。2.若意識清楚，但無法親自簽具者且\n無親屬或關係人在場，得以按指印代替簽名，惟應有二名見證人。3.若病人意識不清且無親屬或關係人在場，醫療\n緊急情況得由二名合格醫師在病歷上證明需檢查或治療即可。)\n見證人1：     （簽章）見證人2：     （簽章）\n見證人1身分證字號：  見證人2身分證字號：\n日期：西元年月日時間：時分\n立同意書人姓名: (簽章)\n身分證字號/居留證或護照號碼：\n與病人之關係（請圈選）：本人、配偶、父、母、兒、女、其他：_________\n住址：\n電話：\n日期:西元年月日時間: 時分\n醫師補充說明/病人提出之疑問及解釋:(如無，請填寫無)\n西元2025年04月14日病歷委員會修正通過電子病歷版本 MR 19-20-51\n西元2025年03月19日品質暨病人安全委員會審核通過\n版次\n01400-4-601783\n7\n文件編號\nNational Taiwan University Hospital\n國立臺灣大學醫學院附設醫院\n磁振正子掃描檢查說明暨同意書\n請詳細閱讀內容，待醫師向您說明後，再簽署同意書\n第3頁\n本次檢查部位:\n□左 □右 □不分側 □全身 □腦部 □頭頸部\n□胸部 □腹部 □骨盆腔 □四肢 □脊椎\n□小部位(請以中文填寫)：\n說明醫師:\n日期:西元年月日時間: 時 22 分\n磁振正子掃描檢查同意書\n病人: ，出生於西元年月日，需接受磁振正子掃描檢\n查。立同意書人已經與醫師討論過接受這個手術或醫療處置的效益、風險及替代方\n案，對醫師的說明都已充分了解且同意由貴院施行該項術式或醫療處置。\n病歷號:\n姓名:\n生日:\n臺大醫院暨兒童醫院影像醫學部門診檢查一般說明書\n檢查\n地點\n東址一樓影像醫學中心磁振正子掃描室\n聯絡\n電話\n東址 262540\n一般注意事項\n 請務必詳閱各檢查說明書載明注意事項並填妥同意書，按照約定時間攜帶\n預約通知單、檢查同意書、健保卡或身分證明文件提前至各檢查室登記處\n辦理報到、候檢及準備工作，並請禮讓急重症病患。\n 立同意書人須年滿十八歲方具法律效力，檢查對象若未滿十八歲，請務必\n由法定代理人簽妥同意書並陪同到院檢查。\n 如需更改日期，請於預約檢查日之前持預約檢查通知單至檢查室登記處辦\n理，或與各檢查室登記處聯絡。\n 若因天災或其他因素經行政院人事行政總處發布台北市停止上班﹝災防\n假﹞，各項影像醫學部門診檢查請考量自身安全，並擇期於上班日電洽各\n檢查室登記處以利盡速安排檢查時段。\n檢查注意事項\n一、檢查前注意事項：\n1. 請詳閱各檢查說明書載名的抽血、清腸或禁食準備，若未準備妥當將\n導致當日檢查無法如期完成。\n2. 各項檢查皆可能會更換檢查服，請穿著輕便衣物以利更換。\n二、檢查中注意事項：\n檢查時請務必聽從醫護人員指示，方能維持高品質的檢查以及保護您的\n安全。\n三、檢查後注意事項：\n檢查報告預計將於七個工作天內完成，請按照門診醫師預約回診時間或\n自行預約檢查完七個工作天後回原門診查看結果。\n資\n料\n來源\n影像醫學部\n說明書修訂日期\n114 年 3 月 6 日\n磁振正子掃描檢查"}, {"code": "250", "title": "軀幹及四肢之血管攝影及止血栓塞術說明暨同意書", "nature": "介入治療／手術", "modality": "血管攝影與栓塞", "body_raw": "心臟血管", "body_group": "心臟血管", "unit": "東址一樓血管攝影室", "campuses": ["東址"], "audience": ["中文一般/成人"], "prep": ["需禁食／空腹", "使用顯影／造影劑", "需驗腎功能 (Cre)", "含麻醉或鎮靜"], "phone": "262608", "rel_path": "pdfs/250_軀幹及四肢之血管攝影及止血栓塞術說明暨同意書.pdf", "pdf_url": "https://www.ntuh.gov.tw/ckfinder_file/OPD/files/DOCEMENT/inst250.pdf", "pages": 3, "text": "國立臺灣大學醫學院附設醫院\nNational Taiwan University Hospital\n軀幹及四肢之血管攝影及止血栓塞術\n說明暨同意書\n病歷號：\n姓名：\n生日：西元年月日\n請詳細閱讀內容，待醫師向您說明後，再簽署同意書\n第 1 頁\n西元2021 年11 月26 日病歷委員會修正通過電子病歷版本 MR 19-20-56\n西元2021 年10 月28 日品質暨病人安全委員會審核通過\n文件編號\n01400-4-602049\n版次\n03 \n軀幹及四肢之血管攝影及止血栓塞術說明書\n這份說明書是有關您即將接受的手術或醫療處置的效益、風險及替代方案的書面說明，可\n做為您與醫師討論時的補充資料。最重要的是我們希望您能充分瞭解資料的內容，所以請仔細\n閱讀；如果經醫師說明後您還有對這個手術或醫療處置的任何疑問，請在簽名前再與您的醫師\n充分討論，醫師會很樂意為您解答，讓我們一起為了您的健康努力。\n手術/醫療處置之適應症及作法：（簡述）\n本術式之適應症包括四肢、胸腹部及骨盆腔出血之診斷與治療(包括創傷、腫瘤、血管異常、\n產後大出血，以及其他原因所造成之出血)。\n當軀幹、四肢出血時，可能會有伴隨之症狀，如局部腫痛、腹脹、胸腹痛、呼吸困難、生命徵\n象不穩定……等。此時需要即時給予適當治療以緩解症狀、拯救生命。開刀止血或血管攝影術\n是為可行的檢查或治療工具之一。在血管攝影時，若發現有正在出血之血管，亦可嘗試經血管\n栓塞術以幫助止血。若血管攝影當時並無立即且明顯之出血，將可能無法進行血管栓塞止血。\n術前準備：除必要之血液檢查和相關處置外，在檢查之前，需剃除兩側腹股溝處之體毛及\n更換檢查服裝，並請家屬務必在檢查當時陪同前往檢查。\n步驟：檢查當天，會有專人引導您至血管攝影室。登上檢查台後，請保持仰臥姿勢，護理\n人員會先以無菌紗布為您保護外陰部，並固定四肢以保護您的安全。在詳細消毒並舖上綠色消\n毒布單後，請您保持雙手在布單之下以維持無菌操作空間；同時影像醫學部之放射師也會與您\n溝通檢查時的配合事項。接著由影像醫學部醫師為您進行檢查及治療。檢查過程中若有任何不\n適，請口頭告知醫師，切勿任意移動身體或擺動四肢以免發生危險。術中，醫師會先在腹股溝\n施打皮下局部麻醉劑，進行血管穿刺，並置入血管鞘。其後將使用引線以及導管，由股動脈到\n達預定之動脈，並進行數次血管攝影以釐清病灶部位。攝影過程中，將注射顯影劑，此時若有\n身上灼熱感或是口中異味，乃正常現象，切勿驚慌，並仔細聽從放射師指示進行吸閉氣。若醫\n師發現正在出血之病灶，將會設法進行栓塞術以幫助止血。檢查及治療完成後，醫師會視當下\n治療效果決定是否立即拔除血管鞘。血管鞘留存時，請保持仰臥並不要彎曲同側大腿，以避免\n血管鞘滑脫出血。拔除血管鞘並適當止血後，請依照醫師指示平躺四到八小時，並保持仰臥以\n及傷口側的沙袋壓迫，切勿彎曲同側大腿，也不可翻身及坐起，以免再度出血。之後護理師將\n會為您衛教有關仰臥期間伸展活動，如廁，以及進食的方式。我們並建議術後十二小時內由家\n屬陪同照料。由於檢查過程中已施打顯影劑，術後請多攝食水分以利顯影劑由尿路排出。術後\n平躺完畢若無出血情形，即可於醫師指示後下床活動。\n注意事項：\n1. 施打顯影劑可能造成不同程度之藥物不良反應，例如皮膚疹、咽喉血管性水腫、呼吸困難、\n支氣管攣縮、休克等。建議施打前禁食四小時以上以防嘔吐造成吸入性肺炎。\n2. 腎功能不良之病人（血清肌酸酐Creatinine 大於等於2.0mg/dL）施打顯影劑將增加暫時或\n終身洗腎之風險。\n3. 使用二甲雙胍類降血糖藥物（例如Metformin）同時施打顯影劑將增加乳酸中毒的機率，\n建議注射前停用至少48 小時。\n4. 患有甲狀腺疾病、重症肌無力或嗜鉻細胞瘤等疾病，請告知臨床醫師。\n5. 本檢查之游離輻射可能影響胎兒，可能懷孕之婦女請告知臨床醫師。哺乳期婦女施打含碘\n顯影劑後，仍可繼續哺乳。\n編號： 250\n國立臺灣大學醫學院附設醫院\nNational Taiwan University Hospital\n軀幹及四肢之血管攝影及止血栓塞術\n說明暨同意書\n病歷號：\n姓名：\n生日：西元年月日\n請詳細閱讀內容，待醫師向您說明後，再簽署同意書\n第 2 頁\n西元2021 年11 月26 日病歷委員會修正通過電子病歷版本 MR 19-20-56\n西元2021 年10 月28 日品質暨病人安全委員會審核通過\n文件編號\n01400-4-602049\n版次\n03 \n（軀幹及四肢之血管攝影及止血栓塞術說明書承上頁）\n手術/醫療處置效益：（經由手術，您可能獲得以下所列的效益，但醫師並不能保證您獲得任何\n一項；且手術效益與風險性間的取捨，應由您決定。）\n本項檢查及治療，是利用血管攝影的方式來偵測出血的部位，並在發現出血點時可以嘗試\n進行止血，或其他一切可以協助治療之作為。\n手術/醫療處置成功率：據文獻統計，約有五到九成機率達成症狀緩解，惟實際成功率則\n因個體病況不同而有所差異，且據統計有一定比例之病人仍有再次出血的機率。\n手術/醫療處置風險：（沒有任何手術或醫療處置是完全沒有風險的，以下所列的風險已被認\n定，但是仍然可能有一些醫師無法預期的風險未列出。）\n血管攝影可能導致的併發症可分為：\n一、與血管損傷及穿刺有關之併發症－包含穿刺處的疼痛或不適感，程度不一的出血（局部輕\n微血腫 >5%、嚴重血腫 <0.5%），對於血管的損傷（動靜脈\n管 0.05%、動脈瘤 0.01%、\n血管阻塞 0.1%、血管破裂而出血），導致器官組織梗塞（0.47%），如脾、肺、胰、膽、胃\n腸道、脊髓及引發之症狀；可能的感染症及伴隨之發燒、菌血症或全身性感染及可能伴隨\n體內任何部位之膿瘍，如肝膿瘍（0.21%）、脊椎膿瘍……等，血塊栓塞甚至是中風癱瘓。\n如處理子宮出血者，栓塞後可能會有懷孕困難或不孕等其他併發症。除了這個術式本身外，\n對於止痛局部麻醉藥物不可預期的過敏亦有可能造成死亡。\n二、與導管有關之併發症－導管在血管內操作時，有可能產生小的血栓（尤其是有動脈硬化者），\n血栓卡在非標的血管遠端就會導致器官組織梗塞（包括中風）；其他還有動脈剝離、血管痙\n攣或阻塞等。\n因上述併發症及其後續引發之醫療問題，可能隨時需要進行適當之處置，包括輸血及其他\n必要之藥物治療、心肺復甦術急救、氣管內管插入、手術治療……等等。本科及本院醫療同仁\n會盡全力避免併發症的發生，倘若仍不幸發生意外，亦會適時做出適當的建議，以期病友可以\n得到最佳的治療效果。\n此醫療處置屬侵入性治療，如已簽署「不實施心肺復甦術或維生醫療（DNR）意願書/同意\n書」者，請慎重考慮。\n替代方案：（這個手術或醫療處置的替代方案如下，如果您決定不施行這個手術或醫療處置，\n可能會有危險，請與醫師討論您的決定）\n根據疾病的不同，可能有其他的處置可以進行，例如手術、內視鏡或是內科治療，然而並\n不一定可行。如果您對於本處置有所疑慮，請與您的醫師妥善討論其他方式的可行性及相關風\n險。\n不實施醫療處置可能的後果：因出血造成之生命徵象不穩定及相關之併發症。\n國立臺灣大學醫學院附設醫院\nNational Taiwan University Hospital\n軀幹及四肢之血管攝影及止血栓塞術\n說明暨同意書\n病歷號：\n姓名：\n生日：西元年月日\n請詳細閱讀內容，待醫師向您說明後，再簽署同意書\n第 3 頁\n西元2021 年11 月26 日病歷委員會修正通過電子病歷版本 MR 19-20-56\n西元2021 年10 月28 日品質暨病人安全委員會審核通過\n文件編號\n01400-4-602049\n版次\n03 \n（軀幹及四肢之血管攝影及止血栓塞術說明書承上頁）\n醫師補充說明/病人提出之疑問及解釋：（如無，請填寫無）\n說明醫師：（簽章）\n日期：西元年月日\n軀幹及四肢之血管攝影及止血栓塞術同意書\n病人：，出生於西元年月日，需接受軀幹及四肢之血管\n攝影及止血栓塞術。立同意書人已經與醫師討論過接受這個手術或醫療處置的效益、風險及\n替代方案，對醫師的說明都已充分了解且同意由貴院施行該項術式或醫療處置。\n立同意書人：（簽章）身分證字號：\n與病人之關係（請圈選）：本人、配偶、父、母、兒、女、其他：_________\n住址：電話：\n日期：西元年月日\n(1.如由病人、親屬或關係人簽署本同意書，則無需見證，見證人部分得免填。2.若意識清楚，但無法親自簽具者\n且無親屬或關係人在場，得以按指印代替簽名，惟應有二名見證人。3.若病人意識不清且無親屬或關係人在場，\n醫療緊急情況得由2 名合格醫師在病歷上證明需檢查或治療即可。)\n見證人1：（簽章）見證人2：（簽章）\n見證人1 身分證字號：見證人2 身分證字號：\n日期：西元年月日"}, {"code": "252", "title": "電腦斷層骨盆腔動脈血管攝影檢查說明暨同意書", "nature": "診斷檢查", "modality": "CT 電腦斷層", "body_raw": "心臟血管", "body_group": "心臟血管", "unit": "東址一樓電腦斷層掃描室", "campuses": ["東址"], "audience": ["中文一般/成人"], "prep": ["需禁食／空腹", "使用顯影／造影劑", "需驗腎功能 (Cre)"], "phone": "262301", "rel_path": "pdfs/252_電腦斷層骨盆腔動脈血管攝影檢查說明暨同意書.pdf", "pdf_url": "https://www.ntuh.gov.tw/ckfinder_file/OPD/files/DOCEMENT/inst252.pdf", "pages": 4, "text": "國立臺灣大學醫學院附設醫院\nNational Taiwan University Hospital\n電腦斷層骨盆腔動脈血管攝影檢查\n說明暨同意書\n病歷號：\n姓名：\n生日：西元年月日\n請詳細閱讀內容，待醫師向您說明後，再簽署同意書第 1 頁\n西元2023 年12 月15 日病歷委員會修正通過電子病歷版本 MR 19-20-57\n西元2021 年10 月28 日品質暨病人安全委員會審核通過\n文件編號\n01400-4-602064\n版次\n05 \n電腦斷層骨盆腔動脈血管攝影檢查說明書\n適應症及作法：\n適應症：經臨床醫師評估，認為需要接受骨盆腔動脈血管攝影檢查之病人。\n※一般注意事項：\n1.請於預約檢查日期攜帶預約通知單、檢查同意書、身分證及健保卡，到院向檢查室護理\n人員報到。\n2.如需更改檢查日期，或有其他疑問，請於預約之檢查日前於上班時間與檢查單位電話聯\n絡（02-23562301）。上班時間：星期一～星期五：上午8：00～下午5：00。\n3.如對說明書與同意書之內容有不明瞭之處，請向開單診間或檢查室醫護人員洽詢。\n4.請儘量有家屬陪伴。\n※特殊注意事項：\n一、檢查前注意事項：\n1.檢查前請禁食四小時以上，可服用平日藥物(例如高血壓及心臟病藥物)，但糖尿病藥物\n須暫停服用，糖尿病人可食糖果，避免血糖過低。\n2.孕婦或有藥物過敏、腎功能不良之病史者，應告知醫師，與醫師討論本項檢查可能引起\n之不良反應後，再決定是否接受本項檢查。\n3.須有三個月內之血清肌酸酐(Cre)值，請務必於受檢前三個月內完成抽血檢查。不便至本\n院檢驗者，可攜帶三個月內其他醫院或醫事檢驗機構之血清肌酸酐(Creatinine)正式報告\n於受檢當天供參考。\n4.請明確告知開立檢查之醫師以及電腦斷層攝影檢查之工作人員下列病史：氣喘、腎功能\n不良、甲狀腺亢進、嗜鉻細胞瘤、重症肌無力、藥物及顯影劑過敏史。\n5.受檢當日請穿無金屬之服裝，並移除金屬飾品，以減少金屬干擾影像。\n6.請於檢查後七天，自行約掛門診或依醫師原預約門診時間看檢查結果。\n二、檢查進行方式與注意事項：\n1.檢查時會給予硝化甘油舌下錠擴張小動脈，以利影像判讀。使用時可能會有燒灼感、麻\n辣感、臉色潮紅、心跳加快、頭痛或頭暈，是正常暫時反應。若服用後有身體不適，請\n告知現場醫護人員。\n2.由護理人員留置靜脈注射軟針，之後注射顯影劑進行檢查。\n3.檢查時，受檢者需要多次閉氣（每次約10 秒），請配合醫護人員指示，如未依指示配合\n閉氣將造成影像模糊，無法判讀。\n三、檢查後注意事項：\n1.如有身體不適者，請回原檢查室或至本院急診處理。\n2.檢查後請多喝水，可加速所注射顯影劑之排出。\n效益：\n無。\n風險：\n一、顯影劑之可能不良反應：(本項檢查使用的顯影劑為“非離子性低滲透壓顯影劑“）\n1.部分受檢者在注射顯影劑時會發生溫熱感覺、噁心、嘔吐、頭暈、打噴嚏，通常在短時\n間內會消退。\n2.極少數人，可能引起較嚴重的反應，如全身性蕁麻疹、寒顫、呼吸困難等症狀。\n3.對具特異體質者，可能發生極罕見之喉頭水腫、氣喘、血壓降低、心肺衰竭休克及猝死\n編號：252\n國立臺灣大學醫學院附設醫院\nNational Taiwan University Hospital\n電腦斷層骨盆腔動脈血管攝影檢查\n說明暨同意書\n病歷號：\n姓名：\n生日：西元年月日\n請詳細閱讀內容，待醫師向您說明後，再簽署同意書第 2 頁\n西元2023 年12 月15 日病歷委員會修正通過電子病歷版本 MR 19-20-57\n西元2021 年10 月28 日品質暨病人安全委員會審核通過\n文件編號\n01400-4-602064\n版次\n05 \n（發生率約十萬分之一）。\n4.曾患心臟疾病、氣喘病、曾因顯影劑引起不良反應者、腎功能不良者或其他特殊疾病之\n患者等，發生不良反應之機率較高。腎臟功能不佳者，注射顯影劑可能會使腎臟功能更\n加惡化。\n5.施打顯影劑前，會由醫護人員施行生理食鹽水注射，以檢查注射血管之通暢性。但仍有\n少數病人(如意識不清無痛覺反應，躁動，皮膚水腫，靜脈循環不佳(有開過刀或中心靜\n脈阻塞)，血管細小易破，留置針在關節或約束帶固定處，不易評估腫脹)，會於開始施\n打顯影劑後，產生顯影劑滲漏至皮下組織或肌肉 (機率約0.7%)，而致產生局部紅腫、疼\n痛之現象。皮下腫痛會在數日後隨顯影劑吸收而慢慢消失，但亦有少數人出現嚴重發\n炎、潰瘍、及局部神經壓迫反應，而需接受住院觀察、外科處置或植皮。\n二、游離輻射之可能不良作用多為機率效應，可向電腦斷層攝影檢查之工作人員索取說明\n書(KM 系統/知識館/醫療支援單位/影像醫學部/說明暨同意書/電腦斷層常見疑問說\n明.doc)\n替代方案：\n進行侵入性血管攝影。\n醫師補充說明/病人提出之疑問及解釋：（如無，請填寫無）\n如果您有任何問題，歡迎您提出來和您的主治醫師討論，並且請他寫下來供您作參\n考。\n說明醫師：（簽章）\n日期：西元年月日時間：時分\n電腦斷層骨盆腔動脈血管攝影檢查同意書\n病人：，出生於西元年月日，需接受電腦斷層骨盆腔\n動脈血管攝影檢查。立同意書人已經與醫師討論過接受這個手術或醫療處置的效益、風險\n及替代方案，對醫師的說明都已充分了解且同意由貴院施行該項術式或醫療處置。\n立同意書人姓名：（簽章）\n身分證字號/居留證或護照號碼：\n與病人之關係（請圈選）：本人、配偶、父、母、兒、女、其他：_________\n住址：\n電話：\n日期：西元年月日時間：時分\n(1.如由病人、親屬或關係人簽署本同意書，則無需見證，見證人部分得免填。2.若意識清楚，但無法親自簽\n具者且無親屬或關係人在場，得以按指印代替簽名，惟應有二名見證人。3.若病人意識不清且無親屬或關係人\n在場，醫療緊急情況得由2 名合格醫師在病歷上證明需檢查或治療即可。)\n見證人1：（簽章）見證人2：（簽章）\n見證人1 身分證字號：見證人2 身分證字號：\n日期：西元年月日時間：時分\n臺大醫院暨兒童醫院影像醫學部門診檢查一般說明書\n檢查\n地點\n東址一樓電腦斷層掃描室\n聯絡\n電話\n東址 262301\n一般注意事項\n請務必詳閱各檢查說明書載明注意事項並填妥同意書，按照約定時間攜帶\n預約通知單、檢查同意書、健保卡或身分證明文件提前至各檢查室登記處\n辦理報到、候檢及準備工作，並請禮讓急重症病患。\n立同意書人須年滿十八歲方具法律效力，檢查對象若未滿十八歲，請務必\n由法定代理人簽妥同意書並陪同到院檢查。\n如需更改日期，請於預約檢查日之前持預約檢查通知單至檢查室登記處辦\n理，或與各檢查室登記處聯絡。\n若因天災或其他因素經行政院人事行政總處發布台北市停止上班﹝災防\n假﹞，各項影像醫學部門診檢查請考量自身安全，並擇期於上班日電洽各\n檢查室登記處以利盡速安排檢查時段。\n檢查注意事項\n一、檢查前注意事項：\n1.請詳閱各檢查說明書載名的抽血、清腸或禁食準備，若未準備妥當將\n導致當日檢查無法如期完成。\n2.各項檢查皆可能會更換檢查服，請穿著輕便衣物以利更換。\n二、檢查中注意事項：\n檢查時請務必聽從醫護人員指示，方能維持高品質的檢查以及保護您的\n安全。\n三、檢查後注意事項：\n檢查報告預計將於七個工作天內完成，請按照門診醫師預約回診時間或\n自行預約檢查完七個工作天後回原門診查看結果。\n資料來源\n影像醫學部\n說明書修訂日期\n114 年2 月10 日\n電腦斷層骨盆腔動脈血管攝影檢查\n東\n址\n1F"}, {"code": "253", "title": "電腦斷層導引胸腔腫瘤冷凍治療術說明暨同意書", "nature": "介入治療／手術", "modality": "消融冷凍與微創介入", "body_raw": "呼吸(肺)", "body_group": "呼吸(肺)", "unit": "東址一樓介入診療室", "campuses": ["東址"], "audience": ["中文一般/成人"], "prep": ["含麻醉或鎮靜"], "phone": "262608", "rel_path": "pdfs/253_電腦斷層導引胸腔腫瘤冷凍治療術說明暨同意書.pdf", "pdf_url": "https://www.ntuh.gov.tw/ckfinder_file/OPD/files/DOCEMENT/inst253.pdf", "pages": 2, "text": "國立臺灣大學醫學院附設醫院\nNational Taiwan University Hospital\n電腦斷層導引胸腔腫瘤冷凍治療術說明暨同意書\n病歷號：\n姓名：\n生日：西元年月日\n請詳細閱讀內容，待醫師向您說明後，再簽署同意書\n第 1 頁\n西元2023 年12 月15 日病歷委員會修正通過電子病歷版本 MR 19-20-58\n西元2021 年09 月02 日品質暨病人安全委員會審核通過\n文件編號\n01400-4-602080\n版次\n04 \n電腦斷層導引胸腔腫瘤冷凍治療術說明書\n編號:253\n這份說明書是有關您即將接受的手術(或醫療處置)的效益、風險及替代方案的書面說明，可做\n為您與醫師討論時的補充資料。最重要的是我們希望您能充份瞭解資料的內容，所以請仔細閱\n讀；如果經醫師說明後您還有對這個手術(或醫療處置)的任何疑問，請在簽名前再與您的醫師\n充分討論，醫師會很樂意為您解答，讓我們一起為了您的健康努力。\n適應症及作法：（簡述）\n此項處置是用於胸腔腫瘤的局部治療。您必須先接受影像學檢查，評估腫瘤大小、位置及數目，\n並排除肺氣腫、出血體質以及胸腔外轉移等狀況，方可接受此項治療。在為您進行治療前，會\n先給予注射止痛藥物，然後進行局部消毒和局部麻醉。在醫師利用電腦斷層定位及導引下，將\n冷凍治療針置入腫瘤中，利用高壓液態氬氦氣體冷凍腫瘤至約攝氏零下165 度，以達到治療目\n的。整個療程自定位掃描開始至完成約需40 分鐘至數小時不等，依據腫瘤大小、位置、形狀以\n及需要治療的病灶數目而定。每次治療後需平躺4 小時。\n效益：\n冷凍治療以冷凍方式直接造成腫瘤壞死。單次治療可達腫瘤完全壞死率約六至八成(會因腫瘤\n大小、位置及型態而有所不同，腫瘤越大則完全消除率相對越低)。\n接受此項治療的病人，預後會因其原本的疾病嚴重度(如腫瘤的大小和數目)而不同。病人的整\n體存活率因腫瘤大小、數目、是否有腫瘤轉移及其他身體狀況而有所差異。\n風險：\n併發症包括最常見的有氣胸約10-40%、咳血或肺出血約6-15%、其他如血胸、癌細胞植入其他\n組織、空氣栓塞、皮下或縱膈腔氣腫、積膿、氣管肋膜\n管等極少發生(<1%)。傷口出血、感\n染、肋膜炎、肋間神經傷害、血管傷害及皮膚穿刺處凍傷等亦為可能發生之併發症。依據併發\n症狀況，給予進一步相關治療。因此所有病人在接受治療前都應審慎評估。比較容易發生的輕\n微併發症包括：發燒、疼痛、傷口發炎等，一般只需觀察數日即可自行恢復。必要時可給予適\n度相關治療。\n替代方案：（這個手術或醫療處置的替代方案如下，如果您決定不施行這個手術或醫療處置，\n可能無法有效控制腫瘤生長，請與醫師討論您的決定）\n胸腔腫瘤尚有其他治療方式。包括手術切除、放射或化學治療。需根據疾病嚴重程度和病人身\n體狀況來做選擇。若是您對本身疾病的治療方式仍有疑慮，請與負責照顧您的醫師溝通。若不\n接受治療，胸腔腫瘤可能會持續擴展，胸腔腫瘤擴展後的相關併發症請與負責照顧您的醫師討\n論。\n醫師充說明/病人提出之疑問及解釋：（如無，請填寫無）\n1.檢查後如有任何不適請告知醫護人員。\n2.檢查後續的治療計畫請您與您的診治醫師做進一步的討論。\n國立臺灣大學醫學院附設醫院\nNational Taiwan University Hospital\n電腦斷層導引胸腔腫瘤冷凍治療術說明暨同意書\n病歷號：\n姓名：\n生日：西元年月日\n請詳細閱讀內容，待醫師向您說明後，再簽署同意書\n第 2 頁\n西元2023 年12 月15 日病歷委員會修正通過電子病歷版本 MR 19-20-58\n西元2021 年09 月02 日品質暨病人安全委員會審核通過\n文件編號\n01400-4-602080\n版次\n04 \n說明醫師：（簽章）\n日期：西元年月日時間：時分\n電腦斷層導引胸腔腫瘤冷凍治療術同意書\n病人：，出生於西元年月日，需接受電腦斷層導引胸腔\n腫瘤冷凍治療術。立同意書人對於施行該項術式之原因、過程、效益、替代方案、可能發生之\n併發症及危險，業經貴院有關醫師詳細說明，均已充分了解且同意由貴院施行該項術式或醫療\n處置。\n立同意書人姓名：（簽章）\n身分證字號/居留證或護照號碼：\n與病人之關係（請圈選）：本人、配偶、父、母、兒、女、其他：_________\n住址：\n電話：\n日期：西元年月日時間：時分\n(1.如由病人、親屬或關係人簽署本同意書，則無需見證，見證人部分得免填。2.若意識清楚，但無法親自簽具者\n且無親屬或關係人在場，得以按指印代替簽名，惟應有二名見證人。3.若病人意識不清且無親屬或關係人在場，\n醫療緊急情況得由二名合格醫師在病歷上證明需檢查或治療即可。)\n見證人1：（簽章）見證人2：（簽章）\n見證人1 身分證字號：見證人2 身分證字號：\n日期：西元年月日時間：時分"}, {"code": "254", "title": "電腦斷層心臟結構血管攝影檢查說明暨同意書", "nature": "診斷檢查", "modality": "CT 電腦斷層", "body_raw": "心臟血管", "body_group": "心臟血管", "unit": "東址一樓電腦斷層掃描室", "campuses": ["東址"], "audience": ["中文一般/成人"], "prep": ["需禁食／空腹", "使用顯影／造影劑", "需驗腎功能 (Cre)"], "phone": "262301、263667", "rel_path": "pdfs/254_電腦斷層心臟結構血管攝影檢查說明暨同意書.pdf", "pdf_url": "https://www.ntuh.gov.tw/ckfinder_file/OPD/files/DOCEMENT/inst254.pdf", "pages": 5, "text": "國立臺灣大學醫學院附設醫院\nNational Taiwan University Hospital\n電腦斷層心臟結構血管攝影檢查說明暨同意書\n電腦斷層心臟結構血管攝影檢查說明書\n適應症及作法：（簡述）\n適應症: 經臨床醫師評估，認為需要接受心臟內細部結構血管攝影檢查之病人。\n※一般注意事項：\n1.請於預約檢查日期攜帶預約通知單、檢查同意書、身分證及健保卡，到院向檢查室護理人員\n報到。\n2.如需更改檢查日期，或有其他疑問，請於預約檢查日前於上班時間與檢查單位電話聯絡（02-\n23562301）。上班時間：星期一~星期五：上午8：00～下午5：00。\n3.如對說明書與同意書之內容有不明瞭之處，請向開單診間或檢查室醫護人員洽詢。\n4.請儘量有家屬陪伴。\n※特殊注意事項：\n一、檢查前注意事項：\n1.檢查前請禁食四小時以上，可服用平日藥物(例如高血壓及心臟病藥物)，但糖尿病藥物須暫\n停服用，糖尿病人可食糖果，避免血糖過低。(因心跳速率快將造成影像模糊無法判讀，檢查\n前12 小時內請勿服用含咖啡因物質（例如咖啡、茶、可樂、巧克力），以避免心跳加快。)\n2.孕婦或有藥物過敏、腎功能不良之病史者，應告知醫師，與醫師討論本項檢查可能引起之不\n良反應後，再決定是否使用本項檢查。\n3.須有三個月內之血清肌酸酐(Cre)值，請務必於受檢前三個月內完成抽血檢查。不便至本院\n檢驗者，可攜帶三個月內其他醫院或醫事檢驗機構之血清肌酸酐(Creatinine)正式報告於受檢\n當天供參考。\n4.請明確告知開立檢查之醫師以及電腦斷層攝影檢查之工作人員下列病史：氣喘、腎功能不\n良、甲狀腺功能亢進、嗜鉻細胞瘤、重症肌無力、藥物及顯影劑過敏史。\n5.受檢當日請穿無金屬之服裝，並移除金屬飾品，以減少金屬干擾影像。\n6.請於檢查後七天，自行約掛門診或依醫師原預約門診時間看檢查結果。\n二、檢查進行方式與注意事項：\n1.由護理人員留置靜脈注射軟針。\n2.心跳不規律或心跳速率太快者，可能造成影像不清晰，影響判讀之正確性。\n3.在電腦斷層檢查台上貼上心電圖導極，之後注射顯影劑進行檢查，根據心電圖訊號同步掃\n描進行檢查。\n4.檢查時，受檢者如果可以配合需要多次閉氣（每次約10 秒），請配合醫護人員指示，如\n未依指示配合閉氣將造成影像模糊，無法判讀。\n三、檢查後注意事項：\n1.如有身體不適者，請回原檢查室或至本院急診處理。\n2.檢查後請多喝水，可加速所注射顯影劑之排出。\n請詳細閱讀內容，待醫師向您說明後，再簽署同意書第 1 頁\n病歷號：\n姓名：\n生日：西元年月日\n文件編號\n01400-4-602132\n版次\n04 \n西元2023 年12 月15 日病歷委員會修正通過電子病歷版本MR 19-20-59\n西元2021 年05 月17 日品質暨病人安全委員會審核通過\n編號：254\n國立臺灣大學醫學院附設醫院\nNational Taiwan University Hospital\n電腦斷層心臟結構血管攝影檢查說明暨同意書\n（電腦斷層心臟結構血管攝影檢查說明書承上頁）\n※顯影劑之可能不良反應：(本項檢查使用的顯影劑為“非離子性低滲透壓顯影劑“）\n1.部分受檢者在注射顯影劑時會發生溫熱感覺、噁心、嘔吐、頭暈、打噴嚏，通常在短時間\n內會消退。\n2.極少數人，可能引起較嚴重的反應，如全身性蕁麻疹、寒顫、呼吸困難等症狀。\n3.對具特異體質者，可能發生極罕見之喉頭水腫、氣喘、血壓降低、心肺衰竭休克及猝死\n（發生率約十萬分之一）。\n4.曾患心臟疾病、氣喘病、曾因顯影劑引起不良反應者、腎功能不良者或其他特殊疾病之患\n者等，發生不良反應之機率較高。腎臟功能不佳者，注射顯影劑可能會使腎臟功能更加惡\n化。\n5.施打顯影劑前，會由醫護人員施行生理食鹽水注射，以檢查注射血管之通暢性。但仍有少\n數病人(如意識不清無痛覺反應，躁動，皮膚水腫，靜脈循環不佳(有開過刀或中心靜脈阻\n塞)，血管細小易破，留置針在關節或約束帶固定處，不易評估腫脹)，會於開始施打顯影劑\n後，產生顯影劑滲漏至皮下組織或肌肉 (機率約0.7%)，而致產生局部紅腫、疼痛之現象。\n皮下腫痛會在數日後隨顯影劑吸收而慢慢消失，但亦有少數人出現嚴重發炎、潰瘍、及局部\n神經壓迫反應，而需接受住院觀察、外科處置或植皮。\n接受此手術/醫療處置之效益：\n無。\n手術/醫療處置風險：\n無。\n替代方案：\n進行心臟核磁共振檢查或進行侵入性心導管血管攝影。\n醫師補充說明/病人提出之疑問及解釋：（如無，請填寫無）\n如果您有任何問題，歡迎您提出來和您的主治醫師討論，並且請他寫下來供您作參考。\n說明醫師：（簽章）(職稱)\n日期：西元年月日時間：時分\n請詳細閱讀內容，待醫師向您說明後，再簽署同意書第 2 頁\n\n西元2023 年12 月15 日病歷委員會修正通過電子病歷版本MR 19-20-59\n西元2021 年05 月17 日品質暨病人安全委員會審核通過\n文件編號\n01400-4-602132\n版次\n04\n病歷號：\n姓名：\n生日：西元年月日\n國立臺灣大學醫學院附設醫院\nNational Taiwan University Hospital\n電腦斷層心臟結構血管攝影檢查說明暨同意書\n電腦斷層心臟結構血管攝影檢查同意書\n病人：，出生於西元年月日，需接受電腦斷層心臟結構\n血管攝影檢查。立同意書人已經與醫師討論過接受這個手術或醫療處置的效益、風險及替代\n方案，對醫師的說明都已充分了解且同意由貴院施行該項術式或醫療處置。\n立同意書人姓名：（簽章）\n身分證字號/居留證或護照號碼：\n與病人之關係（請圈選）：本人、配偶、父、母、兒、女、其他：_________\n住址：\n電話：\n日期：西元年月日時間：時分\n-------------------------------------------------------------------------------\n（1.如由病人、親屬或關係人簽署本同意書，則無需見證，見證人部分得免填。2.若意識清楚，但無法親自簽\n具者且無親屬或關係人在場，得以按指印代替簽名，惟應有二名見證人。3.若病人意識不清且無親屬或關係人\n在場，醫療緊急情況得由2 名合格醫師在病歷上證明需檢查或治療即可。）\n見證人1：（簽章）見證人2：（簽章）\n見證人1 身分證字號：見證人2 身分證字號：\n日期：西元年月日時間：時分\n請詳細閱讀內容，待醫師向您說明後，再簽署同意書第 3 頁\n\n西元2023 年12 月15 日病歷委員會修正通過電子病歷版本MR 19-20-59\n西元2021 年05 月17 日品質暨病人安全委員會審核通過\n文件編號\n01400-4-602132\n版次\n04\n病歷號：\n姓名：\n生日：西元年月日\n臺大醫院暨兒童醫院影像醫學部門診檢查一般說明書\n檢查\n地點\n東址一樓電腦斷層掃描室\n聯絡\n電話\n東址 262301、\n263667\n一般注意事項\n請務必詳閱各檢查說明書載明注意事項並填妥同意書，按照約定時間攜帶\n預約通知單、檢查同意書、健保卡或身分證明文件提前至各檢查室登記處\n辦理報到、候檢及準備工作，並請禮讓急重症病患。\n立同意書人須年滿十八歲方具法律效力，檢查對象若未滿十八歲，請務必\n由法定代理人簽妥同意書並陪同到院檢查。\n如需更改日期，請於預約檢查日之前持預約檢查通知單至檢查室登記處辦\n理，或與各檢查室登記處聯絡。\n若因天災或其他因素經行政院人事行政總處發布台北市停止上班﹝災防\n假﹞，各項影像醫學部門診檢查請考量自身安全，並擇期於上班日電洽各\n檢查室登記處以利盡速安排檢查時段。\n檢查注意事項\n一、檢查前注意事項：\n1.請詳閱各檢查說明書載名的抽血、清腸或禁食準備，若未準備妥當將\n導致當日檢查無法如期完成。\n2.各項檢查皆可能會更換檢查服，請穿著輕便衣物以利更換。\n二、檢查中注意事項：\n檢查時請務必聽從醫護人員指示，方能維持高品質的檢查以及保護您的\n安全。\n三、檢查後注意事項：\n檢查報告預計將於七個工作天內完成，請按照門診醫師預約回診時間或\n自行預約檢查完七個工作天後回原門診查看結果。\n資料來源\n影像醫學部\n說明書修訂日期\n114 年2 月10 日\n電腦斷層心臟結構血管攝影檢查\n東\n址\n1F"}, {"code": "287", "title": "顱內經動脈血栓取出術或血栓溶解術", "nature": "介入治療／手術", "modality": "血管攝影與栓塞", "body_raw": "腦與神經", "body_group": "腦與神經", "unit": "東址一樓介入診療室", "campuses": ["東址"], "audience": ["中文一般/成人"], "prep": ["使用顯影／造影劑"], "phone": "262608", "rel_path": "pdfs/287_顱內經動脈血栓取出術或血栓溶解術.pdf", "pdf_url": "https://www.ntuh.gov.tw/ckfinder_file/OPD/files/DOCEMENT/inst287.pdf", "pages": 4, "text": "國立臺灣大學醫學院附設醫院\n歷\n號名日\n病姓生\nNationaI Taiwan University HospitaI\n顱內經動脈血栓取出術或血栓溶解術說明暨\n同意書\n第1頁\n顱內經動脈血栓取出術或血栓溶解術說明書\n編號: 287\n病人因疑似動脈阻塞合併中風,建議施行經動脈血栓取出術/血栓溶解術, (以下列簡\n稱取栓術及溶栓術)。取栓術及溶栓術屬腦神經血管微創手術,等同顱內手術,是一\n種精密且複雜的手術。\n這份說明書是有關您或您的親屬即將接受的手術或醫療處置的效益、風險及替代方案\n的書面說明,可做為您與醫師討論時的補充資料。最重要的是我們希望您能充分瞭解\n資料的內容,所以請仔細閱讀;如果經醫師說明後您還有對這個手術或醫療處置的任\n何疑問,請在簽名前再與您的醫師充分討論,醫師會很樂意為您解答,讓我們一起為\n了病人的健康努力\n適應症及作法: (簡述)\n基本理論:\n當發生急性腦動脈阻塞時,腦組織缺血壞死範圍將隨著時間進行而增加,最終導致阻\n塞處下游完全壞死。若能在越短時間內接受治療,壞死範圍可能減少,神經功能受損\n的嚴重度可能會降低\n適應症: (原則上要符合下列全部適用情況方可使用取栓術及溶栓術)\n1.符合使用動脈溶栓術適應症者以先使用動脈溶栓術為優先。經影像診斷為顱內大動\n脈阻塞,經神經內科醫師判定有需要進一步經動脈介入治療者,確認為前循環腦部主\n幹動脈阻塞,且在症狀發生後24小時以內\n2 · 影像檢查顯示沒有出血、且確認缺血範圍比已壞死範圍大\n3 · 動脈溶栓術的禁忌包括:在最近三個月有中風、開刀出血、或使用抗凝血藥物的病\n史。\n4 · 後循環主幹動脈阻塞目前預後結果仍不明確。使用取栓或溶栓術應根據臨床和影像\n作判定,經醫師向病人家屬解釋說明、且家屬了解風險和可能併發症後,簽署同意書\n方能進行。\n作法:\n由鼠蹊部穿刺動脈後,將導管送到頸部進行攝影,如果有合併頸部動脈阻塞或嚴重狹\n窄,則須先進行氣球擴張或頸動脈支架,才有辦法處理更遠端的動脈。為減少取栓過\n程中血栓脫落,造成中風,可能須使用近端保護氣囊導管,自費約3萬元。\n動脈血栓取出術需要使用特殊的取栓裝置(包含取栓導管、血管重建裝置、血栓切除\n裝置、取回器等)。現階段本院大部分醫師會先使用取栓導管看是否能夠成功抽出血\n栓,如果能成功,則所花費的時間會較短,長段血栓也較容易取出;若取栓導管無法\n成功取出血栓,則會再使用其他特殊的取栓裝置。手術若進行太久(通常約一個小時\n到一個半小時)卻依舊無法成功取出血栓,通常會停止手術。因為取栓術進行太\n久,就算成功其預後仍不好,而且易引發其他併發症。較小動脈內的血栓,取栓裝置\n通常無效,只能希望靜脈溶栓能發揮作用,或使用經動脈溶栓術進行溶栓。如因腦內\n血管嚴重狹窄,可能要使用腦內支架(健保不給付,全額自費約14萬元)或氣囊擴張整\n形術(健保給付)撐開狹窄處,以免狹窄的血管造成腦部血流供應不穩。但兩者效果不\n等。所有治療方式都必須按照當場檢查發現決定\n術後會將病人送回急診或加護病房觀察直到病人情形穩定。術後會在傷口以1公斤沙\n袋覆蓋傷口至少2小時,再以繃帶加壓止血至少2小時,此時宜有家屬陪伴,以觀察傷\n口是否有再滲血,如有滲血或病情惡化者,應立即通知醫護人員處理。術後12小時內\n要絕對臥\n西元2024年07月29日病歷委員會修正通過電子病歷版本 MR 19一20一63\n西元2024年07月18日品質暨病人安全委員會審核通過\n國立臺灣大學醫學院附設醫院\n歷\n號名日\n病姓生\nNationaI Taiwan University HospitaI\n顱內經動脈血栓取出術或血栓溶解術說明暨\n同意書\n第2頁\n不可\n特別醫材:\n目前健保僅部分支付取栓術所需特別醫材。簽署同意書代表您了解並願意自費支付這\n類特別醫材。(給付規定 Ⅰ 203一12 )有很高的機會下列醫材都會用到。\n1.近端保護氣囊導管:減少取栓過程中血栓脫落,造成中風的機會,須自費約3萬\n2 · 各種特殊取栓裝置(包含取栓導管、血管重建裝置、血栓切除裝置、取回器等)其健\n保給付規定應同時符合下列條件:\n( 1 )發作後24小時內。\n( 2 )影像診斷為顱內大動脈阻塞,包括內頸動脈、大腦中動脈的第1及第2段、大腦前\n動脈、基底動脈和脊椎動脈。\n( 3 )美國國衛院腦中風評估表( NIH Stroke ScaIe)評分6且30。\n如不符合上述條件,仍需全額自費使用。每個特殊裝置價格約12 ~ 16萬不等。\n3 · 如因腦內血管嚴重狹窄,可能要自費使用腦內支架併氣球擴張(健保不給付,全額\n自費約14萬元)或氣囊擴張整形術(健保給付) ,但兩者效果不等\n效益:\n目前已知結果包含下列三點:\nl.經動脈取栓術可以提高主幹動脈阻塞後打通成功率(約7一9成)。溶栓術目前只使\n用在較小的動脈分支阻塞。但最終結果仍視個別情況而定。\n2 · 如在時間內打通阻塞動脈,可能提高病人有較好預後或功能恢復的比率,約3一4成\n的病人能夠恢復到生活自理的狀態。但最終結果仍視個別情況而定。\n3 · 仍有出血、嚴重的神經功能喪失或植物人、死亡的可能性\n風險:\nI.即使嘗試各種方法,仍有兩成左右病人無法打通阻塞的動脈。\n2 · 手術過程有可能引發動脈破裂(小於5 % ) ,導致嚴重中風、腦部出血,植物人或死\n亡。\n3 · 手術過程有可能引發新的動脈阻塞,因而增加中風範圍。\n4 · 手術成功並不保證預後一定會變好,即使有改善也常常無法回到中風發生前的狀\n厶匕\n月匕。\n5 · 少數病人血管在手術打通後可能會在短時間內再次塞住。\n6 · 合併頸部動脈阻塞或嚴重狹窄,則須先進行氣球擴張或頸動脈支架。取栓支架也有\n可能必須留置在動脈內。如果合併顱內血管狹窄,可能要使用腦內支架併氣球擴張或\n氣囊擴張整形術以撐開狹窄處。若發生上述情況,則需要另外使用抗血小板藥物,以\n避免支架阻塞。但急性中風後使用抗血小板藥物,可能會增加出血的風險。\n7 · 較小動脈內的血栓,可能需經動脈施打溶栓藥物進行溶栓,但在急性中風病人使用\n溶栓藥物,會增加出血的風險。\n腦神經血管微創手術等同顱內手術是一種精密且複雜的手術。會有一定的危險性存\n在。其他可能產生的併發症包含:對顯影劑過敏、失明,失聰等等。\n一般替代的方案是藥物治療。因病灶之特性及影響範圍之不同,不實施醫療處置之可\n能後果於不同個體間,存在有極大之差異,如有任何疑問,請與您的醫師充分討\n西元2024年07月29日病歷委員會修正通過電子病歷版本 MR 19一20一63\n西元2024年07月18日品質暨病人安全委員會審核通過\n國立臺灣大學醫學院附設醫院\n歷\n號名日\n病姓生\nNationaI Taiwan University HospitaI\n顱內經動脈血栓取出術或血栓溶解術說明暨\n同意書\n第3頁\n病人。\n巾亻艮 ∕ 、\n因為急性缺血性腦中風的治療須跟時間賽跑,所以請能儘早下決定是否使用取栓術或\n溶栓術。如有任何疑慮或問題,請馬上和說明醫師或手術醫師討論,以免延遲手術。\n醫師補充說明/病人提出之疑問及解釋: (如無,請填寫無)\n您若有任何問題,請在手術開始前請您的護理師聯絡我們,或是在術前直接詢問醫\n說明醫師:張00\n住院醫師\n年09月10日\n時間: 13時14分\n日期:西元2025\n顱內經動脈血栓取出術或血栓溶解術同意書\n日,需接受顱內經動\n,出生於西元\n病人:\n脈血栓取出術或血栓溶解術。如合併腦內血管嚴重狹窄,業已選擇處理方式如下述\n勾選。立同意書人已經與醫師討論過接受這個手術或醫療處置的效益、風險及替代\n方案,對醫師的說明都已充分了解且同意由貴院施行該項術式或醫療處置。\n囗我已瞭解相關的風險,並且願意接受此項治療。\n囗我已瞭解相關的風險,不願意接受此項治療,且已了解不接受此項治療後可能的\n風險。\n如合併腦內血管嚴重狹窄,我願意:\n囗自費使用腦內支架併氣球擴張。\n囗只使用健保給付之氣囊擴張整形術。\n(簽章)\n立同意書人姓名:\n身分證字號/居留證或護照號碼:\n與病人之關係(請圈選) :本人、配偶、父、母、兒、女、其他:\n住址:\n年\n時間:\n時\n日期:西元\n月\n西元2024年07月29日病歷委員會修正通過電子病歷版本 MR 19一20一63\n西元2024年07月18日品質暨病人安全委員會審核通過\n國立臺灣大學醫學院附設醫院\n歷\n號名日\n病姓生\nNationaI Taiwan University HospitaI\n顱內經動脈血栓取出術或血栓溶解術說明暨\n同意書\n第4頁\n主 ㄠ\n( l.如由病人、親屬或關係人簽署本同意書,則無需見證,見證人部分得免填。2.若意識清楚,但無法親自簽具者且\n無親屬或關係人在場,得以按指印代替簽名,惟應有二名見證人。3.若病人意識不清且無親屬或關係人在場,醫療\n緊急情況得由二名合格醫師在病歷上證明需檢查或治療即可。)\n(簽章)見證人2 :\n(簽章)\n見證人1 :\n見證人1身分證字號:\n見證人2身分證字號:\n日時間 •\n時\n日期:西元\n西元2024年07月29日病歷委員會修正通過電子病歷版本 MR 19一20一63\n西元2024年07月18日品質暨病人安全委員會審核通過"}, {"code": "294", "title": "心電圖調控寬排體積心血管結構攝影檢查說明暨同意書", "nature": "診斷檢查", "modality": "CT 電腦斷層", "body_raw": "心臟血管", "body_group": "心臟血管", "unit": "東址一樓電腦斷層掃描室、兒醫大樓三樓影像醫學部", "campuses": ["東址", "兒醫大樓"], "audience": ["中文一般/成人"], "prep": ["需禁食／空腹", "使用顯影／造影劑", "需驗腎功能 (Cre)"], "phone": "262301、270323", "rel_path": "pdfs/294_心電圖調控寬排體積心血管結構攝影檢查說明暨同意書.pdf", "pdf_url": "https://www.ntuh.gov.tw/ckfinder_file/OPD/files/DOCEMENT/inst294.pdf", "pages": 5, "text": "國立臺灣大學醫學院附設醫院\nNational Taiwan University Hospital\n心電圖調控寬排體積心血管結構攝影檢查\n說明暨同意書\n請詳細閱讀內容，待醫師向您說明後，再簽署同意書第 1 頁\n西元2023 年12 月15 日病歷委員會修正通過電子病歷版本 MR 19-20-62\n西元2021 年04 月16 日品質暨病人安全委員會審核通過\n文件編號\n01400-4-602184\n版次\n04\n病歷號：\n姓名：\n生日：西元年月日\n\n心電圖調控寬排體積心血管結構攝影檢查說明書\n適應症及作法：（簡述）\n適應症: 經臨床醫師評估，認為需要接受心臟內細部結構血管攝影檢查之病患。\n※一般注意事項：\n1.請於預約檢查日期攜帶預約通知單、檢查同意書、身分證及健保卡，到院向檢查室護理人員\n報到。\n2.如需更改檢查日期，或有其他疑問，請於預約檢查前於上班時間與檢查單位電話聯絡\n（02-23562301）。上班時間：星期一~星期五：上午8：00～下午5：00。\n3.如對說明書與同意書之內容有不明瞭之處，請向開單診間或檢查室醫護人員洽詢。\n4.請儘量有家屬陪伴。\n※特殊注意事項：\n一、檢查前注意事項：\n1.檢查前請禁食四小時以上，可服用平日藥物(例如高血壓及心臟病藥物)，但糖尿病藥物須暫\n停服用，糖尿病人可食糖果，避免血糖過低。因心跳速率快將造成影像模糊無法判讀，檢查\n前12 小時內請勿服用含咖啡因物質（例如咖啡、茶、可樂、巧克力），以避免心跳加快。\n2.孕婦或有藥物過敏、腎功能不良之病史者，應告知醫師，與醫師討論本項檢查可能引起之不\n良反應後，再決定是否接受本項檢查。\n3.須有三個月內之血清肌酸酐(Cre)值，請務必於受檢前三個月內完成抽血檢查。不便至本院檢\n驗者，可攜帶三個月內其他醫院或醫事檢驗機構之血清肌酸酐(Creatinine)正式報告於受檢當\n天供參考。\n4.請明確告知開立檢查之醫師以及電腦斷層攝影檢查之工作人員下列病史：氣喘、腎功能不\n良、甲狀腺功能亢進、嗜鉻細胞瘤、重症肌無力、藥物及顯影劑過敏史。\n5.受檢當日請穿無金屬之服裝，並移除金屬飾品，以減少金屬干擾影像。\n6.請於檢查後七天，自行約掛門診或依醫師原預約門診時間看檢查結果。\n二、檢查進行方式與注意事項：\n1.由護理人員留置靜脈注射軟針。\n2.心跳不規律或心跳速率太快者，可能造成影像不清晰，影響判讀之正確性。\n3.在電腦斷層檢查台上貼上心電圖導極，之後注射顯影劑進行檢查，根據心電圖訊號同步掃描\n進行檢查。\n4.檢查時，受檢者如果可以配合需要多次閉氣（每次約10 秒），請配合醫護人員指示，如未依\n指示配合閉氣將造成影像模糊，無法判讀。\n三、檢查後注意事項：\n1.如有身體不適者，請回原檢查室或至本院急診處理。\n2.檢查後請多喝水，可加速所注射顯影劑之排出。\n效益：\n一、心電圖調控寬排電腦斷層掃描影像能提供較佳的時間及空間解析度，減少假影像干擾。\n二、此檢查為非侵襲性檢查中，最適合評估心臟之細小結構與三圍構造之檢查，且檢查過程\n不需要長時間鎮定，利用影像後重組技術可以立體方式呈現心臟及血管之異常或狹窄。\n風險：\n一、檢查過程會接受放射線暴露，孕婦及小兒接受此檢查須由醫師審慎評估其必要性。\n編號：294\n國立臺灣大學醫學院附設醫院\nNational Taiwan University Hospital\n心電圖調控寬排體積心血管結構攝影檢查\n說明暨同意書\n請詳細閱讀內容，待醫師向您說明後，再簽署同意書第 2 頁\n西元2023 年12 月15 日病歷委員會修正通過電子病歷版本 MR 19-20-62\n西元2021 年04 月16 日品質暨病人安全委員會審核通過\n文件編號\n01400-4-602184\n版次\n04\n病歷號：\n姓名：\n生日：西元年月日\n\n二、使用顯影劑(本項檢查使用「非離子性低滲透顯影劑」)之可能不良反應：\n1.部分受檢者在注射顯影劑時會發生溫熱感覺、噁心、嘔吐、頭暈、打噴嚏，通常在短時間\n內會消退。\n2.極少數人，可能引起較嚴重的反應，如全身性蕁麻疹、寒顫、呼吸困難等症狀。\n3.對具特異體質者，可能發生極罕見之喉頭水腫、氣喘、血壓降低、心肺衰竭休克及猝死（發\n生率約十萬分之一）。\n4.曾患心臟疾病、氣喘病、曾因顯影劑引起不良反應者、腎功能不良者或其他特殊疾病之患\n者等，發生不良反應之機率較高。腎臟功能不佳者，注射顯影劑可能會使腎臟功能更加惡\n化。\n5.施打顯影劑前，會由醫護人員施行生理食鹽水注射，以檢查注射血管之通暢性。但仍有少\n數病人(如意識不清無痛覺反應，躁動，皮膚水腫，靜脈循環不佳(有開過刀或中心靜脈阻\n塞)，血管細小易破，留置針在關節或約束帶固定處，不易評估腫脹)，會於開始施打顯影\n劑後，產生顯影劑滲漏至皮下組織或肌肉 (機率約0.7%)，而致產生局部紅腫、疼痛之現象。\n皮下腫痛會在數日後隨顯影劑吸收而慢慢消失，但亦有少數人出現嚴重發炎、潰瘍、及局\n部神經壓迫反應，而需接受住院觀察、外科處置或植皮。\n替代方案：\n進行心臟核磁共振檢查或進行侵入性心導管血管攝影。\n醫師補充說明/病人提出之疑問及解釋：（如無，請填寫無）\n如果您有任何問題，歡迎您提出來和您的主治醫師討論，並且請他寫下來供您作參考。\n說明醫師：（簽章）\n日期：西元年月日時間：時分\n心電圖調控寬排體積心血管結構攝影檢查同意書\n病人：，出生於西元年月日，需接受心電圖調控寬排體\n積心血管結構攝影檢查。立同意書人已經與醫師討論過接受這個手術或醫療處置的效益、風\n險及替代方案，對醫師的說明都已充分了解且同意由貴院施行該項術式或醫療處置。\n立同意書人姓名：（簽章）\n身分證字號/居留證或護照號碼：\n與病人之關係（請圈選）：本人、配偶、父、母、兒、女、其他：_________\n住址：\n電話：\n日期：西元年月日時間：時分\n(1.如由病人、親屬或關係人簽署本同意書，則無需見證，見證人部分得免填。2.若意識清楚，但無法親自簽具\n者且無親屬或關係人在場，得以按指印代替簽名，惟應有二名見證人。3.若病人意識不清且無親屬或關係人在\n場，醫療緊急情況得由2 名合格醫師在病歷上證明需檢查或治療即可。)\n見證人1：（簽章）見證人2：（簽章）\n見證人1 身分證字號：見證人2 身分證字號：\n日期：西元年月日時間：時分\n臺大醫院暨兒童醫院影像醫學部門診檢查一般說明書\n檢查\n地點\n東址一樓電腦斷層掃描室\n兒醫大樓三樓影像醫學部\n聯絡\n電話\n東址 262301\n兒醫 270323\n一般注意事項\n請務必詳閱各檢查說明書載明注意事項並填妥同意書，按照約定時間攜帶\n預約通知單、檢查同意書、健保卡或身分證明文件提前至各檢查室登記處\n辦理報到、候檢及準備工作，並請禮讓急重症病患。\n立同意書人須年滿十八歲方具法律效力，檢查對象若未滿十八歲，請務必\n由法定代理人簽妥同意書並陪同到院檢查。\n如需更改日期，請於預約檢查日之前持預約檢查通知單至檢查室登記處辦\n理，或與各檢查室登記處聯絡。\n若因天災或其他因素經行政院人事行政總處發布台北市停止上班﹝災防\n假﹞，各項影像醫學部門診檢查請考量自身安全，並擇期於上班日電洽各\n檢查室登記處以利盡速安排檢查時段。\n檢查注意事項\n一、檢查前注意事項：\n1.請詳閱各檢查說明書載名的抽血、清腸或禁食準備，若未準備妥當將導\n致當日檢查無法如期完成。\n2.各項檢查皆可能會更換檢查服，請穿著輕便衣物以利更換。\n二、檢查中注意事項：\n檢查時請務必聽從醫護人員指示，方能維持高品質的檢查以及保護您的\n安全。\n三、檢查後注意事項：\n檢查報告預計將於七個工作天內完成，請按照門診醫師預約回診時間或自\n行預約檢查完七個工作天後回原門診查看結果。\n資料來源\n影像醫學部\n說明書修訂日期\n114 年2 月10 日\n心電圖調控寬排體積心血管結構攝影檢查\n東\n址\n1F\n兒醫\n3F\n心電圖調控寬排體積心血管結構攝影檢查"}, {"code": "295", "title": "胸腔鏡手術前三維電腦斷層導引之肺臟細針定位術說明暨同意書", "nature": "介入治療／手術", "modality": "消融冷凍與微創介入", "body_raw": "呼吸(肺)", "body_group": "呼吸(肺)", "unit": "東址一樓介入診療室", "campuses": ["東址"], "audience": ["中文一般/成人"], "prep": ["使用顯影／造影劑", "含麻醉或鎮靜"], "phone": "262608", "rel_path": "pdfs/295_胸腔鏡手術前三維電腦斷層導引之肺臟細針定位術說明暨同意書.pdf", "pdf_url": "https://www.ntuh.gov.tw/ckfinder_file/OPD/files/DOCEMENT/inst295.pdf", "pages": 2, "text": "國立臺灣大學醫學院附設醫院\n歷\n號名日\n病姓生\nNationaI Taiwan University HospitaI\n胸腔鏡手術前三維電腦斷層導引之肺臟細針\n定位術說明暨同意書\n石音聿第1頁\n胸腔鏡手術前三維電腦斷層導引之肺臟細針定位術說明書\n編號: 295\n這份說明書是有關您即將接受的手術或醫療處置的效益、風險及替代方案的書面說\n明,可做為您與醫師討論時的補充資料。最重要的是我們希望您能充份瞭解資料的內\n容,所以請仔細閱讀;如果經醫師說明後您還有對這個手術或醫療處置的任何疑\n問,請在簽名前再與您的醫師充分討論,醫師會很樂意為您解答,讓我們一起為了您\n的健康努力。\n適應症及作法: (簡述)\n肺部內有不正常的微小病灶,需要以外科手術方式來移除病灶病確定其病因,以擬定\n正確的治療方式。胸腔鏡手術前三維電腦斷層導引之肺臟細針定位術是利用電腦斷層\n的定位與導引,透過細針經皮穿刺把定位線埋入病灶周邊,或者把染料注入病灶周\n邊,以利手術中辨識病灶,進行外科切除及病理檢查。\n效益:\n本檢查的優點是能輔助外科手術中辨識病灶,使外科手術順利進行順利移除病灶。\n定位成功並切除病灶的成功率約在78 %一95 %之間,因組織部位不同、病灶深淺大小不\n一以及病人配合程度而有差異;如未切除病灶,則可能進行第二次定位術及手術。\n風險:\n不適合做此手術的病人:\n1.無一安全可接近之路徑\n2 · 病人無法配合呼吸。本手術需要病人絕對合作,若病人意識不清,則此術不容易\n進行,危險度將提高;或是年紀小的病人,可能需要在全身麻醉的情況下,才能作本\n手術。\n3 · 病人有出血傾向或血液凝固異常的疾病,或正在使用抗凝血藥物者。\n4 · 會對麻醉藥或染料過敏的病人。\n可能副作用或可能併發症:\n最常見的有氣胸約18一47 %、胸壁肌肉出血、咳血或肺部出血約7一16 %、中度以上胸壁及\n肋膜疼痛約5 % (偶有劇烈呼吸疼痛)、定位線脫落約7一22 %、其他如過敏、血胸、癌細\n胞植入其他組織、癌細胞造成肺栓塞、空氣栓塞、皮下及/或縱隔腔氣腫、積膿、氣管\n肋膜瘻管等極少發生( < 1 % )。\n在手術過程中是否須要靜脈注射含碘對比劑則視病情需要由醫師決定,其相關的可能\n副作用或可能併發症請參考【電腦斷層說明書】\n替代方案:\n不接受肺臟定位術也可逕行肺切除手術,但缺點是對於極小的病灶可能會使手術中定\n位困難,因而需要擴大切除範圍甚至仍無法準確切除,或是於切下的肺臟組織中無法\n找到病灶。優點是避免肺臟定位術的風險。\n醫師補充說明/病人提出之問及解釋: (如無,請填寫無)\n西元2023年12月15日病歷委員會修正通過電子病歷版本 MR 19-20-45\n8 ◎\n西元2021年11月04日品質暨病人安全委員會審核通過\n國立臺灣大學醫學院附設醫院\n歷\n號名日\n病姓生\nNationaI Taiwan University HospitaI\n胸腔鏡手術前三維電腦斷層導引之肺臟細針\n定位術說明暨同意書\n音聿\n第2頁\n說明醫師:\n時間:\n時\n日期:西元\n胸腔鏡手術前三維電腦斷層導引之肺臟細針定位術同意書\n日,需接受胸腔鏡手術前三維\n,出生於西元\n電腦斷層導引之肺臟細針定位術。立同意書人已經與醫師討論過接受這個手術醫\n療處置的效益、風險及替代方案,對醫師的說明都已充分了解且同意由貴院施行該\n項術式或醫療處置。\n(簽章)\n立同意書人姓名:\n身分證字號/居留證或護照號碼:\n與病人之關係(請圈選) :本人、配偶、父、母、兒、女、其他:\n住址:\n時間:\n時\n年\n日期:西元\n月\n().如由病人、親屬或關係人簽署本同意書,則無需見證,見證人部分得免填。2 · 若意識清楚,但無法親自簽具者且\n無親屬或關係人在場,得以按指印代替簽名,惟應有二名見證人。3.若病人意識不清且無親屬或關係人在場,醫療\n緊急情況得由二名合格醫師在病歷上證明需檢查或治療即可。)\n(簽章)見證人2 :\n(簽章)\n見證人1 :\n見證人1身分證字號:\n見證人2身分證字號:\n時間:\n時\n日期:西元\n日\n西元2023年12月15日病歷委員會修正通過電子病歷版本 MR 19-20-45\n8 ◎\n西元2021年11月04日品質暨病人安全委員會審核通過"}, {"code": "314", "title": "電腦斷層心臟血流灌注併冠狀動脈血管攝影檢查說明暨同意書", "nature": "診斷檢查", "modality": "CT 電腦斷層", "body_raw": "心臟血管", "body_group": "心臟血管", "unit": "東址一樓電腦斷層掃描室", "campuses": ["東址"], "audience": ["中文一般/成人"], "prep": ["需禁食／空腹", "使用顯影／造影劑", "需驗腎功能 (Cre)"], "phone": "262299", "rel_path": "pdfs/314_電腦斷層心臟血流灌注併冠狀動脈血管攝影檢查說明暨同意書.pdf", "pdf_url": "https://www.ntuh.gov.tw/ckfinder_file/OPD/files/DOCEMENT/inst314.pdf", "pages": 3, "text": "國立臺灣大學醫學院附設醫院\nNational Taiwan University Hospital\n電腦斷層心臟血流灌注併冠狀動脈血管\n攝影檢查說明暨同意書\n請詳細閱讀內容，待醫師向您說明後，再簽署同意書第1頁\n西元2023 年12 月15 日病歷委員會修正通過電子病歷版本 MR 19-20-65\n西元2023 年06 月30 日品質暨病人安全委員會審核通過\n文件編號\n01400-4-602249\n版次\n04 \n病歷號：\n姓名：\n生日：西元年月日\n電腦斷層心臟血流灌注併冠狀動脈血管攝影檢查說明書\n※一般注意事項：\n1.請於預約檢查日期攜帶預約通知單、本說明書所附之檢查同意書及身分證，到院向檢查室護\n理人員報到。\n2.如需更改檢查日期，或有其他疑問，請於預約檢查前於上班時間與檢查單位電話聯絡\n（02-2356-2301）。上班時間：星期一～星期五：上午9：00～下午5：00。\n3.如對說明書與同意書之內容有不明瞭之處，請向開單診間或檢查室醫護人員洽詢。\n4.請儘量有家屬陪伴。\n※特殊注意事項：\n一、檢查前注意事項：\n1.因心跳速率快將造成影像模糊無法判讀，檢查前12 小時內請勿服用含咖啡因物質（例如咖啡、\n茶、可樂、巧克力），以避免心跳加快。檢查前請禁食四小時以上(可服用必要的藥物，但糖尿\n病藥物暫停服用，糖尿病患者可服用少量糖果)。\n2.孕婦或有藥物過敏、腎功能不良之病史者，應告知醫師，與醫師討論本項檢查可能引起之不良\n反應後，再決定是否接受本項檢查。\n3.如有氣喘病史或曾做過冠狀動脈繞道手術者，請務必告知檢查室醫護人員。\n二、檢查進行方式與注意事項：\n1.為提供最佳影像品質並減少輻射劑量，建議心率每分鐘超過70 次的受檢者，可以考慮使用口\n服藥物(如Propanolol，商品名為Inderal；或Verapamil，商品名為Isoptin)或靜脈注射藥物(例\n如Esmolol)來穩定心跳。若您對這些藥物過敏或有氣喘、慢性阻塞性肺疾病史者，請告知。口\n服藥物需等待半小時至一個半小時才能發揮藥效。副作用包括心跳過慢、低血壓、虛弱、倦\n怠、頭暈、噁心、呼吸急促、頭重腳輕、昏睡等。若服用後有身體不適，請告知現場醫護人\n員。\n2.留置靜脈注射帽，施打血管擴張劑〔Adenosine 或Dipyridamole〕以有效偵測心臟缺氧部位，\n受檢者可能會出現暫時性心悸(3.2%)、頭暈(12.2%)、胸部不適(20%)或腹部不適(6%)、身體發\n熱(3.4%)等情形；僅有極為少數的受試者可能出現氣喘(3%)、支氣管痙攣(0.15%)、心律不整\n(5%)等較嚴重的情形，死亡率為0.5%。\n3.根據心電圖訊號進行檢查。受檢者需要多次閉氣，請配合醫護人員指示以避免影像模糊造成判\n讀困難。\n4.因為需要施打顯影劑，因此病人必須有三個月內之血液肌酸酐(Cre)值，請務必於受檢前三個\n月內完成抽血檢查。不便至本院檢驗者，可攜帶三個月內其他醫院或醫事檢驗機構之血液肌\n酸酐(Cre)正式報告於受檢當天供參考。\n三、檢查後注意事項：\n1.如有身體不適者，請回原檢查室或至本院急診處理。\n2.檢查後請多喝水，可加速所注射顯影劑之排出。\n※顯影劑之可能不良反應：(本項檢查使用的顯影劑為〝非離子性低滲透壓顯影劑〞）\n1.部分受檢者在注射顯影劑時會有溫熱感覺、噁心、嘔吐、頭暈、打噴嚏，通常在短時間內會\n消退。極少數人可能引起較嚴重的反應，如全身性蕁麻疹、寒顫、呼吸困難等症狀。\n2.對具特異體質者，可能發生極罕見之喉頭水腫、氣喘、血壓降低、心肺衰竭休克及猝死（發生\n率約十萬分之一）。\n編號：314\n國立臺灣大學醫學院附設醫院\nNational Taiwan University Hospital\n電腦斷層心臟血流灌注併冠狀動脈血管\n攝影檢查說明暨同意書\n請詳細閱讀內容，待醫師向您說明後，再簽署同意書第2頁\n西元2023 年12 月15 日病歷委員會修正通過電子病歷版本 MR 19-20-65\n西元2023 年06 月30 日品質暨病人安全委員會審核通過\n文件編號\n01400-4-602249\n版次\n04 \n病歷號：\n姓名：\n生日：西元年月日\n3.曾患心臟疾病、氣喘病、曾因顯影劑引起不良反應者、腎功能不良者或其他特殊疾病之患者\n等，發生不良反應之機率較高。腎臟功能不佳者，注射顯影劑可能會使腎臟功能更加惡化。\n4.施打顯影劑前，會由醫護人員施行生理食鹽水注射，以檢查注射血管之通暢性。但仍有少數病\n人(如意識不清無痛覺反應，躁動，皮膚水腫，靜脈循環不佳(有開過刀或中心靜脈阻塞)，血\n管細小易破，留置針在關節或約束帶固定處，不易評估腫脹)，可能於開始施打顯影劑後，產\n生顯影劑滲漏至皮下組織或肌肉(機率約0.7%)，而致產生局部紅腫、疼痛之現象。皮下腫痛\n會在數日後隨顯影劑吸收而慢慢消失，但亦有少數人出現嚴重發炎、潰瘍及局部神經壓迫反\n應，而需接受住院觀察、外科處置或植皮。\n適應症及作法：（簡述）\n本檢查目的是偵測動脈硬化斑塊和缺血性心肌，以便早期診斷冠狀動脈血管狹窄，也可評估冠\n狀動脈支架暢通與否或繞道手術之追蹤。\n效益：\n提供臨床醫師診斷與評估。\n風險：\n替代方案：\n替代方案為心導管檢查、磁振掃描、鉈-201(Thallium -201)心臟血流灌注掃描等。\n醫師補充說明/病人提出之疑問及解釋：（如無，請填寫無）\n如果您有任何問題，歡迎您提出來和您的主治醫師討論，並請寫下來供您作參考。\n說明醫師：（簽章）\n日期:西元年月日時間: 時分\n電腦斷層心臟血流灌注併冠狀動脈血管攝影檢查同意書\n病人：，出生於西元年月日，需接受電腦斷層心臟血流灌注\n併冠狀動脈血管攝影檢查。立同意書人已經與醫師討論過接受這個手術或醫療處置的效益、風險\n及替代方案，對醫師的說明都已充分了解且同意由貴院施行該項術式或醫療處置。\n立同意書人姓名：（簽章）\n身分證字號/居留證或護照號碼：\n與病人之關係（請圈選）：本人、配偶、父、母、兒、女、其他：_________\n住址：\n電話：\n日期:西元年月日時間: 時分\n(1.如由病人、親屬或關係人簽署本同意書，則無需見證，見證人部分得免填。2.若意識清楚，但無法親自簽具者且\n無親屬或關係人在場，得以按指印代替簽名，惟應有二名見證人。3.若病人意識不清且無親屬或關係人在場，醫療\n緊急情況得由2 名合格醫師在病歷上證明需檢查或治療即可。)\n見證人1：（簽章）見證人2：（簽章）\n見證人1 身分證字號：見證人2 身分證字號：\n日期:西元年月日時間: 時分\n電腦斷層心臟血流灌注併冠狀動脈血管攝影檢查\n東\n址\n1F"}, {"code": "315", "title": "經導管微創主動脈瓣膜植入術前評估電腦斷層檢查說明暨同意書", "nature": "診斷檢查", "modality": "CT 電腦斷層", "body_raw": "心臟血管", "body_group": "心臟血管", "unit": "東址一樓電腦斷層掃描室", "campuses": ["東址"], "audience": ["中文一般/成人"], "prep": ["需禁食／空腹", "使用顯影／造影劑", "需驗腎功能 (Cre)"], "phone": "262299", "rel_path": "pdfs/315_經導管微創主動脈瓣膜植入術前評估電腦斷層檢查說明暨同意書.pdf", "pdf_url": "https://www.ntuh.gov.tw/ckfinder_file/OPD/files/DOCEMENT/inst315.pdf", "pages": 4, "text": "國立臺灣大學醫學院附設醫院\nNational Taiwan University Hospital\n經導管微創主動脈瓣膜植入術前評估\n電腦斷層檢查說明暨同意書\n病歷號：\n姓名：\n生日：西元年月日\n請詳細閱讀內容，待醫師向您說明後，再簽署同意書\n第 1 頁\n西元2023 年12 月15 日病歷委員會修正通過電子病歷版本 MR 19-20-66\n西元2021 年09 月02 日品質暨病人安全委員會審核通過\n文件編號\n01400-4-602250\n版次\n03 \n經導管微創主動脈瓣膜植入術前評估電腦斷層檢查說明書\n編號:315\n※一般注意事項：\n1.請於預約檢查日期攜帶預約通知單、本說明書所附之檢查同意書及身分證，到院向檢查室護\n理人員報到。\n2.如需更改檢查日期，或有其他疑問，請於預約檢查前於上班時間與檢查單位電話聯絡\n（02-2356-2301）。上班時間：星期一～星期五：上午9：00～下午5：00。\n3.如對說明書與同意書之內容有不明瞭之處，請向開單診間或檢查室醫護人員洽詢。\n4.請儘量有家屬陪伴。\n※特殊注意事項：\n一、檢查前注意事項：\n1.因心跳速率快將造成影像模糊無法判讀，檢查前12 小時內請勿服用含咖啡因物質（例如咖\n啡、茶、可樂、巧克力），以避免心跳加快。檢查前請禁食四小時以上(可服用必要的藥物，但\n糖尿病藥物暫停服用，糖尿病患者可服用少量糖果)。\n2.孕婦或有藥物過敏、腎功能不良之病史者，應告知醫師，與醫師討論本項檢查可能引起之不\n良反應後，再決定是否接受本項檢查。\n3.如有氣喘病史或曾做過冠狀動脈繞道手術者，請務必告知檢查室醫護人員。\n二、檢查進行方式與注意事項：\n1.為提供最佳影像品質以及降低輻射劑量，心跳速率超過每分鐘70-80 次以上者，建議使用單\n次口服藥物(Propranolol,商品名為Inderal;或Verapamil,商品名Isoptin)以穩定心跳。若對\n這些藥物過敏或有氣喘、慢性阻塞性肺疾病史者，請告知。服藥後約需耐心等待半小時至一個\n半小時。副作用包括心跳過慢、低血壓、虛弱、倦怠、頭暈、噁心、呼吸急促、頭重腳輕、昏\n睡等。若服用後有身體不適，請告知現場醫護人員。\n2.心跳不規律或服藥後仍無法減慢心跳速率者，可能造成影像不清晰，影響判讀之正確性。\n3.留置靜脈注射帽，注射顯影劑，根據心電圖訊號進行檢查。受檢者需要多次閉氣（每次約10\n秒），請配合醫護人員指示以避免影像模糊造成判讀困難。\n4.施打顯影劑之患者須有三個月內之血液肌酸酐(Cre)值,請務必於受檢前三個月內完成抽血檢\n查。不便至本院檢驗者,可攜帶三個月內其他醫院或醫事檢驗機構之血液肌酸酐(Cre)正式報告\n於受檢當天供參考。\n三、檢查後注意事項：\n1.如有身體不適者，請回原檢查室或至本院急診處理。\n2.檢查後請多喝水，可加速所注射顯影劑之排出。\n適應症及作法：（簡述）\n本檢查目的是經導管微創主動脈瓣膜植入術前評估，以精確測量瓣膜大小，降低可能併發症，\n並同時評估冠狀動脈血管狹窄。\n國立臺灣大學醫學院附設醫院\nNational Taiwan University Hospital\n經導管微創主動脈瓣膜植入術前評估\n電腦斷層檢查說明暨同意書\n病歷號：\n姓名：\n生日：西元年月日\n請詳細閱讀內容，待醫師向您說明後，再簽署同意書\n第 2 頁\n西元2023 年12 月15 日病歷委員會修正通過電子病歷版本 MR 19-20-66\n西元2021 年09 月02 日品質暨病人安全委員會審核通過\n文件編號\n01400-4-602250\n版次\n03 \n效益：\n本檢查目的是經導管微創主動脈瓣膜植入術前評估，以精確測量瓣膜大小，降低可能併發症，\n並同時評估冠狀動脈血管狹窄。\n風險：\n※顯影劑之可能不良反應：(本項檢查使用的顯影劑為“非離子性低滲透壓顯影劑“）\n1.部分受檢者在注射顯影劑時會有溫熱感覺、噁心、嘔吐、頭暈、打噴嚏，通常在短時間內會\n消退。極少數人可能引起較嚴重的反應，如全身性蕁麻疹、寒顫、呼吸困難等症狀。\n2.對具特異體質者，可能發生極罕見之喉頭水腫、氣喘、血壓降低、心肺衰竭休克及猝死（發\n生率約十萬分之一）。\n3.曾患心臟疾病、氣喘病、曾因顯影劑引起不良反應者、腎功能不良者或其他特殊疾病之患者\n等，發生不良反應之機率較高。腎臟功能不佳者，注射顯影劑可能會使腎臟功能更加惡化。\n4.施打顯影劑前，會由醫護人員施行生理食鹽水注射，以檢查注射血管之通暢性。但仍有少數\n病人(如意識不清無痛覺反應，躁動，皮膚水腫，靜脈循環不佳(有開過刀或中心靜脈阻塞)，\n血管細小易破，留置針在關節或約束帶固定處，不易評估腫脹)，可能於開始施打顯影劑後，\n產生顯影劑滲漏至皮下組織或肌肉 (機率約0.7%)，而致產生局部紅腫、疼痛之現象。皮下腫\n痛會在數日後隨顯影劑吸收而慢慢消失，但亦有少數人出現嚴重發炎、潰瘍及局部神經壓迫反\n應，而需接受住院觀察、外科處置或植皮。\n替代方案：\n替代方案為心臟超音波、磁振掃描。\n醫師充說明/病人提出之疑問及解釋：（如無，請填寫無）\n如果您有任何問題，歡迎您提出來和您的主治醫師討論，並請寫下來供您作參考。\n說明醫師：（簽章）\n日期：西元年月日時間：時分\n國立臺灣大學醫學院附設醫院\nNational Taiwan University Hospital\n經導管微創主動脈瓣膜植入術前評估\n電腦斷層檢查說明暨同意書\n病歷號：\n姓名：\n生日：西元年月日\n請詳細閱讀內容，待醫師向您說明後，再簽署同意書\n第 3 頁\n西元2023 年12 月15 日病歷委員會修正通過電子病歷版本 MR 19-20-66\n西元2021 年09 月02 日品質暨病人安全委員會審核通過\n文件編號\n01400-4-602250\n版次\n03 \n經導管微創主動脈瓣膜植入術前評估電腦斷層檢查同意書\n病人：，出生於西元年月日，需接受經導管微創主動脈\n瓣膜植入術前評估電腦斷層檢查。立同意書人已經與醫師討論過接受這個手術或醫療處置的\n效益、風險、及替代方案，對醫師的說明都已充分了解且同意由貴院施行該項術式或醫療處置。\n立同意書人姓名：（簽章）\n身分證字號/居留證或護照號碼：\n與病人之關係（請圈選）：本人、配偶、父、母、兒、女、其他：_________\n住址：\n電話：\n日期：西元年月日時間：時分\n(1.如由病人、親屬或關係人簽署本同意書，則無需見證，見證人部分得免填。2.若意識清楚，但無法親自簽具者\n且無親屬或關係人在場，得以按指印代替簽名，惟應有二名見證人。3.若病人意識不清且無親屬或關係人在場，\n醫療緊急情況得由二名合格醫師在病歷上證明需檢查或治療即可。)\n見證人1：（簽章）見證人2：（簽章）\n見證人1 身分證字號：見證人2 身分證字號：\n日期：西元年月日時間：時分\n經導管微創主動脈瓣膜植入術前評估電腦斷層檢查\n東\n址\n1F"}, {"code": "382", "title": "電腦斷層導引下肝腫瘤無線頻率燒灼治療術說明暨同意書", "nature": "介入治療／手術", "modality": "消融冷凍與微創介入", "body_raw": "消化(肝)", "body_group": "消化系統", "unit": "東址一樓介入診療室", "campuses": ["東址"], "audience": ["中文一般/成人"], "prep": ["含麻醉或鎮靜"], "phone": "262608", "rel_path": "pdfs/382_電腦斷層導引下肝腫瘤無線頻率燒灼治療術說明暨同意書.pdf", "pdf_url": "https://www.ntuh.gov.tw/ckfinder_file/OPD/files/DOCEMENT/inst382.pdf", "pages": 2, "text": "國立臺灣大學醫學院附設醫院\n歷\n號名日\n病姓生\nNationaI Taiwan University HospitaI\n電腦斷層導引下肝腫瘤無線頻率燒灼治療術\n說明暨同意書\n音聿\n第1頁\n電腦斷層導引下肝腫瘤無線頻率燒灼治療術說明書\n編號: 382\n這份說明書是有關您即將接受的手術(或醫療處置)的效益、風險及替代方案的書面說\n明,可做為您與醫師討論時的補充資料。最重要的是我們希望您能充份瞭解資料的內\n容,所以請仔細閱讀;如果經醫師說明後您還有對這個手術(或醫療處置)的任何疑\n問,請在簽名前再與您的醫師充分討論,醫師會很樂意為您解答,讓我們一起為了您\n的健康努力。\n適應症及作法: (簡述)\n此項處置主要是用在肝細胞癌的局部治療。您必須先接受影像學檢查,評估腫瘤大\n小、位置及數目,並排除肝衰竭、出血體質、門靜脈栓塞及肝外轉移等狀況,方可接\n受此項治療。在為您進行治療前,會先給予注射止痛藥物,然後進行局部消毒和局部\n麻醉。在醫師利用電腦斷層定位及導引下,將無線頻率燒灼治療針置入腫瘤中,進行\n燒灼治療。整個療程約需20分鐘至數小時不等,依據腫瘤大小、形狀而定。每次治療\n後需平躺6小時,並以砂袋加壓止血。\n效益:\n無線頻率燒灼治療以加熱方式直接造成腫瘤壞死。一般適用於單一腫瘤小於5公分或\n腫瘤少於3顆且大小小於3公分。單次腫瘤完全消除率約九成(會因腫瘤大小、位置及\n型態而有所不同,腫瘤越大則完全消除率相對越低)。\n接受此項治療的病人,預後會因其原本的肝疾病嚴重度(如肝硬化程度、腫瘤的大小\n和數目)而不同。病人的存活率一般而言與手術治療相當。但存活率則因腫瘤大小以\n及您的肝功能不同而有所差異。\n風險:\n嚴重併發症包括胸腔、腹腔、後腹腔、骨盆腔、橫膈膜或傷口之出血及感染、心肺(包\n括氣胸及血胸等)血管神經傷害、肝衰竭、膽管膽囊或附近器官(如腸胃道、胰臟、脾\n臟及腎臟)傷害以及皮膚燒燙傷等。其發生率約在3一10 %。依據併發症狀況,給予進一\n步相關治療。因此所有病人在接受治療前都應審慎評估。比較容易發生的輕微併發症\n包括:發燒、疼痛、傷口發炎、肝功能異常等,一般只需觀察數日即可自行恢復。必\n要時可給予適度相關治療。\n替代方案:\n肝細胞癌尚有其他治療方式。包括手術切除、微波凝固治療術、經動脈栓塞、放射治\n療、化學治療、肝臟移植等。需根據疾病嚴重度和病人身體狀況來做選擇。\n醫師補充說明/病人提出之疑問及解釋: (如無,請填寫無)\n(一)進行此項治療需進行中重度鎮靜止痛,請於術前完全移除身上飾物、眼鏡、假\n牙,以防遺失或干擾緊急呼吸道處理。\n(二)此項治療用於其他肝轉移癌之效果遠不如用於肝細胞癌。\n(三)檢查後如有任何不適請告知醫護人員。\n(四)檢查後續的治療計畫請您與您的診治醫師做進一步的討論\n西元2023年12月15日病歷委員會修正通過電子病歷版本 MR 19-152\n西元2021年11月04日品質暨病人安全委員會審核通過\n國立臺灣大學醫學院附設醫院\n歷\n號名日\n病姓生\nNationaI Taiwan University HospitaI\n電腦斷層導引下肝腫瘤無線頻率燒灼治療術\n說明暨同意書\n音聿\n第2頁\n說明醫師:\n時間:\n時\n日期:西元\n電腦斷層導引下肝腫瘤無線頻率燒灼治療術同意書\n日,需接受肝腫瘤無線頻率燒\n,出生於西元\n病人:\n灼治療術。立同意書人對於施行該項術式之原因、過程、效益、替代方案、可能發\n生之併發症及危險,業經貴院有關醫師詳細說明,均已充分了解且同意由貴院施行\n該項術式或醫療處置。\n立同意書人姓名:\n(簽章)\n身分證字號/居留證或護照號碼:\n與病人之關係(請圈選) :本人、配偶、父、母、兒、女、其他:\n住址:\n時間:\n時\n年\n日期:西元\n月\n( 1.如由病人、親屬或關係人簽署本同意書,則無需見證,見證人部分得免填。2 · 若意識清楚,但無法親自簽具者且\n無親屬或關係人在場,得以按指印代替簽名,惟應有二名見證人。3 · 若病人意識不清且無親屬或關係人在場,醫療\n緊急情況得由二名合格醫師在病歷上證明需檢查或治療即可。)\n(簽章)見證人2 :\n(簽章)\n見證人1 :\n見證人1身分證字號:\n見證人2身分證字號:\n時間 ·\n時\n日期:西元\n日\n西元2023年12月15日病歷委員會修正通過電子病歷版本 MR 19-152\n西元2021年11月04日品質暨病人安全委員會審核通過"}, {"code": "791", "title": "淋巴管攝影暨栓塞說明暨同意書", "nature": "介入治療／手術", "modality": "血管攝影與栓塞", "body_raw": "全身", "body_group": "全身", "unit": "影像醫學部", "campuses": ["未指明特定大樓"], "audience": ["中文一般/成人"], "prep": ["需禁食／空腹", "使用顯影／造影劑", "含麻醉或鎮靜"], "phone": "262612", "rel_path": "pdfs/791_淋巴管攝影暨栓塞說明暨同意書.pdf", "pdf_url": "https://www.ntuh.gov.tw/ckfinder_file/OPD/files/DOCEMENT/inst791.pdf", "pages": 3, "text": "西元2021年11月26日病歷委員會修正通過電子病歷版本 MR 19-916\n西元2021年10月28 日品質暨病人安全委員會審核通過\n國立臺灣大學醫學院附設醫院\nNational Taiwan University Hospital\n淋巴管攝影暨栓塞說明暨同意書\n(影像醫學部)\n第 1 頁\n\n病歷號：\n姓名：\n生日：西元年月日\n請詳細閱讀內容，待醫師向您說明後，再簽署同意書\n文件編號\n01400-4-602604\n版次\n02\n淋巴管攝影暨栓塞說明書\n這份說明書是有關您即將接受的檢查或醫療處置的效益、風險及替代方案的書面說明，\n可做為您與醫師討論時的補充資料。最重要的是我們希望您能充分瞭解資料的內容，所以請\n仔細閱讀；如果經醫師說明後您還有對這個手術或醫療處置的任何疑問，請在簽名前再與您\n的醫師充分討論，醫師會很樂意為您解答，讓我們一起為了您的健康努力。\n醫療處置之適應症及作法：（簡述）\n淋巴管為人體廣泛存在的系統，功能為將組織間液運送回靜脈系統。當病人臨床上因淋巴\n滲漏或阻塞時，會造成症狀包含淋巴水腫、淋巴囊腫、乳糜胸、乳糜狀腹水、乳糜尿、淋巴滲\n液性支氣管炎(plastic bronchitis)及其他淋巴滲液等。淋巴管攝影可以協助辨識淋巴滲漏或阻塞\n處。發現滲漏處時，部分病人可以經由影像導引微創治療或手術治療滲漏處。\n術前準備：除必要之血液檢查和相關處置外，在檢查之前，需剃除檢查處之體毛(最常見\n為腹股溝處)及更換檢查服裝，並請家屬務必在檢查當時陪同前往檢查。\n步驟：\n1.淋巴管攝影：檢查當時，會有專人引導至施行檢查的血管攝影室。消毒以及局部麻醉完成\n後，醫師會使用超音波或螢光透視攝影導引，使用極細的針穿刺淋巴結或軟組織。施打少\n量顯影劑確認針尖位置後，以顯影劑(最常見為碘化油)緩慢注射，直到顯影劑流至病灶處\n或回流至靜脈為止。當中會多次照相。過程中可能會穿刺多處增加診斷率以及檢查速度。\n檢查所需時間因人而異，平均會需要約1-2 小時。待檢查完成後，醫師會將細針拔除，剩\n下的微小傷口消毒後包紮。有需要時，這項檢查會和磁振造影或電腦斷層合併。其他可能\n的穿刺部位包含深處淋巴結以及實質器官如肝臟、腎臟及淋巴管周圍靜脈。\n2.影像導引淋巴管栓塞：若進行淋巴管攝影後有發現滲漏處，並且醫師評估可以以影像導引\n方式治療時進行。醫師會以影像導引的方式將細針穿刺至滲漏處或其周遭，或以微細導管\n及細針將白金線圈或液體栓塞物質將滲漏處栓塞。待治療完成後，醫師會將細針或微細導\n管拔除，剩下的傷口消毒後包紮。視治療位置病人可能會需要在檢查後禁食(若治療部位涉\n及腸胃道，則可能需要禁食一天)。\n醫療處置效益：(經由醫療處置，您可能獲得以下所列的效益，但醫師並不能保證您獲得任何\n一項；且醫療處置效益與風險性間的取捨，仍由您決定)\n一、利用本項檢查，可以偵測滲漏處。並可以有機會將滲漏處栓塞。\n二、手術/醫療處置成功率：\n1.淋巴管攝影：成功率接近100%，但滲漏處的偵測率依引起滲漏的原因以及位置不同而有差\n異。整體而言滲漏量越大，越接近身體中軸處滲漏，偵測率越高。淋巴攝影本身如果使用\n碘化油顯影，因碘化油本身具有部分栓塞的效果，文獻報告約有20-30%的病人在進行淋巴\n管攝影後滲漏症狀會緩解。\n2.影像導引淋巴管栓塞：成功機率會依據滲漏的原因不同而有所差異。有較大規模統計的疾\n病包含：在創傷性乳糜胸的病人上，成功緩解滲漏比率約為70-96%；淋巴滲液性支氣管炎\n(plastic bronchitis)緩解比率約為90%。\n編號：791\n西元2021年11月26日病歷委員會修正通過電子病歷版本 MR 19-916\n西元2021年10月28 日品質暨病人安全委員會審核通過\n國立臺灣大學醫學院附設醫院\nNational Taiwan University Hospital\n淋巴管攝影暨栓塞說明暨同意書\n(影像醫學部)\n第 2 頁\n\n病歷號：\n姓名：\n生日：西元年月日\n請詳細閱讀內容，待醫師向您說明後，再簽署同意書\n文件編號\n01400-4-602604\n版次\n02\n（淋巴管攝影暨栓塞說明書承上頁）\n醫療處置風險：（沒有任何醫療處置是完全沒有風險的，以下所列的風險已被認定，但是仍然\n可能有一些醫師無法預期的風險未列出。）\n1.淋巴攝影是相當安全的攝影方式，但仍有一定之風險存在。\n其相關之風險及併發症包括：穿刺處感染或血腫；油性顯影劑回流至靜脈系統造成的作用，\n如為期數天的肺功能暫時少量下降及其他相當罕見(<1%)的作用包含如中風、意識混亂、淋\n巴阻塞造成肢端水腫及新的位置產生滲液等。\n2.其他造影劑相關之一般併發症包含噁心、嘔吐、異物嗆入及吸入性肺炎、皮膚紅斑、蕁麻\n疹、腎功能受損及洗腎、支氣管攣縮及呼吸困難、血壓驟降、心跳停止、休克，甚至死亡。\n3.如果包含影像導引淋巴管栓塞：血管損傷及出血如皮下出血、瘀青、血腫、腔室症候群、\n動脈剝離、動靜脈\n管、動脈瘤；非標的血管之血管栓塞導致器官組織梗塞，如脾、肺、\n胰、膽、胃腸道、脊髓及引發之症狀如中風等；感染症及伴隨之發燒、菌血症、敗血症及\n可能伴隨體內任何部位之膿瘍，如肝膿瘍、脊椎膿瘍……等；因上述併發症及其後續引發\n之醫療問題，可能隨時需要進行適當之處置，包括輸血及其他必要之藥物治療、心肺復甦\n術急救、氣管內管插管、手術治療……等等。本部及本院醫療同仁會盡全力避免併發症的\n發生，倘若仍不幸發生意外，亦會適時做出適當的處置及建議，以期病友可以得到最佳的\n治療效果。\n替代方案：（這個醫療處置的替代方案如下，如果您決定不施行這個醫療處置，請與醫師討論\n您的決定。）\n根據疾病的不同，可能有其他的處置可以進行，包括變更飲食以減少滲液量、胸腔鏡胸管\n結紮術、引流管置放、硬化劑治療與沾粘劑治療等，然而這些治療並不一定適用你的狀況，成\n功機率也各自相異。如果您對於本處置有所疑慮，請與您的醫師妥善討論其他方式的可行性及\n相關風險。\n不實施醫療處置可能的後果：\n少量滲漏的病人可能會自行吸收並緩解，但大量滲漏的病人常常難以自行緩解，而需要長\n期引流，並可能造成營養不良。症狀本身也不一定會維持穩定，滲透量或許會增加。\n醫師補充說明/病人提出之疑問及解釋：（如無，請填寫無）\n說明醫師：（簽章）\n日期：西元年月日\n西元2021年11月26日病歷委員會修正通過電子病歷版本 MR 19-916\n西元2021年10月28 日品質暨病人安全委員會審核通過\n國立臺灣大學醫學院附設醫院\nNational Taiwan University Hospital\n淋巴管攝影暨栓塞說明暨同意書\n(影像醫學部)\n第 3 頁\n\n病歷號：\n姓名：\n生日：西元年月日\n請詳細閱讀內容，待醫師向您說明後，再簽署同意書\n文件編號\n01400-4-602604\n版次\n02\n淋巴管攝影暨栓塞同意書\n病人：，出生於西元年月日，需接受淋巴管攝影暨栓塞\n術。立同意書人已經與醫師討論過接受這個醫療處置的效益、風險及替代方案，對醫師的說明\n都已充分了解且同意由貴院施行該項醫療處置。\n立同意書人：（簽章）身分證字號：\n與病人之關係（請圈選）：本人、配偶、父、母、兒、女、其他：\n住址：電話：\n日期：西元年月日\n(1.如由病人、親屬或關係人簽署本同意書，則無需見證，見證人部分得免填。2.若意識清楚，但無法親自簽具\n者且無親屬或關係人在場，得以按指印代替簽名，惟應有二名見證人。3.若病人意識不清且無親屬或關係人在\n場，醫療緊急情況得由2 名合格醫師在病歷上證明需檢查或治療即可。)\n見證人1：（簽章）見證人2：（簽章）\n見證人1 身分證字號：見證人2 身分證字號：\n日期：西元年月日"}, {"code": "849", "title": "子宮輸卵管油性顯影劑注射助孕術說明暨同意書", "nature": "介入治療／手術", "modality": "X光與透視攝影", "body_raw": "生殖", "body_group": "生殖", "unit": "兒醫大樓三樓影像醫學部", "campuses": ["兒醫大樓"], "audience": ["中文一般/成人"], "prep": ["使用顯影／造影劑"], "phone": "270323", "rel_path": "pdfs/849_子宮輸卵管油性顯影劑注射助孕術說明暨同意書.pdf", "pdf_url": "https://www.ntuh.gov.tw/ckfinder_file/OPD/files/DOCEMENT/inst849.pdf", "pages": 3, "text": "國立臺灣大學醫學院附設醫院\nNational Taiwan University Hospital\n子宮輸卵管油性顯影劑注射助孕術\n說明暨同意書\n請詳細閱讀內容，待醫師向您說明後，再簽署同意書第 1 頁\n西元2023 年12 月15 日病歷委員會審核通過電子病歷版本 MR 19-975\n西元2021 年10 月26 日品質暨病人安全委員會審核通過\n文件編號\n01400-4-602695\n版次\n02 \n病歷號：\n姓名：\n生日：西元年月日\n子宮輸卵管油性顯影劑注射助孕術說明書\n適應症及作法：（簡述）\n1. 適應症：罹患不孕症，懷疑輸卵管阻塞或子宮腔病灶的病人。\n2. 作法：\n●進行檢查時，病人平躺在檢查檯上，由婦產科醫師將擴陰器放入陰道中，再將器械固定\n於子宮頸內，灌注油溶性含碘顯影劑(LIPIODOL)後，需要請您配合左右傾斜身體，以\n進行不同方位之攝影。\n●部份受檢者在固定器械及灌注顯影劑時會感到疼痛，請配合醫師指示完成檢查。\n3. 注意事項：\n(1) 一般注意事項：\n●請於約定時間攜帶本說明暨同意書至兒童醫院大樓三樓影像醫學部登記處辦理報到候\n檢。\n●檢查禁忌症包含懷孕、未確診之陰道出血、急性骨盆腔發炎、子宮頸內膜炎、明顯的子\n宮頸糜爛、靠近經期前後、施行子宮擴刮術或子宮頸錐狀切除術後30 日內。\n●如臨時因故不能前來檢查，或月經尚未乾淨，請回門診掛號，與主治醫師討論決定下次\n檢查時間，此項檢查須排除懷孕之可能，故無法由患者自行更改檢查時間，有所不便請\n多見諒。\n(2) 檢查後注意事項：\n●請自備衛生棉墊以便檢查後使用。口服藥物包含抗生素與止痛藥，請隨身攜帶，以便檢\n查完成後可立即服用。檢查當日晚上八點後，請自行將陰道的止血紗布取出。\n●檢查完7 天後即可至婦產科門診查詢檢查報告。對說明書內容若有疑問，請於上班時間\n(星期一至星期五，上午8:00~12:00，下午1:30~5:00)向生殖醫學中心人員(02-23123456\n分機270950 或270955)詢問。\n效益：\n檢查輸卵管是否暢通或檢查子宮腔內是否有病灶。除此之外，使用油溶性含碘顯影劑，文獻\n資料顯示，相較於使用一般水溶性顯影劑，使用油溶性含碘顯影劑進行子宮輸卵管攝影術檢\n查的女性，其懷孕率和活產率增加大約10%。\n風險：\n●本檢查經陰道注入含碘之顯影劑，可能的副作用包括：骨盆腔發炎(1-3％)、對顯影劑過\n敏等等。若檢查完後出現嚴重腹痛、發燒、呼吸或吞嚥困難、大量出血、皮膚疹、噁心\n嘔吐、四肢無力、言語障礙、意識不清等情況，請立即就醫。另使用油溶性顯影劑，有\n極罕見的機率可能發生休克、肺栓塞或中風。\n●對碘過敏、甲狀腺功能不良或肺機能不全的人，應特別小心，並請於檢查安排時主動告\n知醫師。\n編號：849\n國立臺灣大學醫學院附設醫院\nNational Taiwan University Hospital\n子宮輸卵管油性顯影劑注射助孕術\n說明暨同意書\n請詳細閱讀內容，待醫師向您說明後，再簽署同意書第 2 頁\n西元2023 年12 月15 日病歷委員會審核通過電子病歷版本 MR 19-975\n西元2021 年10 月26 日品質暨病人安全委員會審核通過\n文件編號\n01400-4-602695\n版次\n02 \n病歷號：\n姓名：\n生日：西元年月日\n(子宮輸卵管油性顯影劑注射助孕術說明書承上頁）\n替代方案：\n1. 使用一般水溶性含碘顯影劑之子宮輸卵管攝影術。\n2. 腹腔鏡或輸卵管通氣檢查：檢查輸卵管是否通暢。\n3. 子宮鏡檢查：檢查是否有子宮腔病灶。\n不實施本醫療處置可能的後果：\n●無法瞭解輸卵管是否阻塞、或子宮腔內是否出現病灶。\n醫師補充說明/病人提出之疑問及解釋：（如無，請填寫無）\n以上說明未盡詳細者，或您仍有疑問，請洽詢您的主治醫師。\n說明醫師：（簽章）\n日期：西元年月日時間：時分\n子宮輸卵管油性顯影劑注射助孕術同意書\n病人：，出生於西元年月日，需接受子宮輸卵管油性顯\n影劑注射助孕術。立同意書人對於施行該項檢查已經與醫師討論過接受這個醫療處置的效\n益、風險及替代方案，業經貴院有關醫師詳細說明，並已充份瞭解並同意施行該項檢查。\n立同意書人：（簽章）\n身分證字號/居留證或護照號碼：\n與病人之關係（請圈選）：本人、配偶、父、母、兒、女、其他：_________\n住址：\n電話：\n日期：西元年月日時間：時分\n(1.如由病人、親屬或關係人簽署本同意書，則無需見證，見證人部分得免填。2.若意識清楚，但無法親自簽具\n者且無親屬或關係人在場，得以按指印代替簽名，惟應有二名見證人。3.若病人意識不清且無親屬或關係人在\n場，醫療緊急情況得由2 名合格醫師在病歷上證明需檢查或治療即可。)\n見證人1：（簽章）見證人2：（簽章）\n見證人1 身分證字號：見證人2 身分證字號：\n日期：西元年月日時間：時分\n子宮輸卵管油性顯影劑注射助孕術\n兒醫\n3F"}, {"code": "851", "title": "困難營養維生管路透視無痛置放術說明暨同意書", "nature": "介入治療／手術", "modality": "消融冷凍與微創介入", "body_raw": "消化(胃/腸)", "body_group": "消化系統", "unit": "東址一樓介入診療室", "campuses": ["東址"], "audience": ["中文一般/成人"], "prep": ["需禁食／空腹"], "phone": "262608", "rel_path": "pdfs/851_困難營養維生管路透視無痛置放術說明暨同意書.pdf", "pdf_url": "https://www.ntuh.gov.tw/ckfinder_file/OPD/files/DOCEMENT/inst851.pdf", "pages": 3, "text": "國立臺灣大學醫學院附設醫院\nNational Taiwan University Hospital\n困難營養維生管路透視無痛置放術\n說明暨同意書\n病歷號：\n姓名：\n生日：西元年月日\n請詳細閱讀內容，待醫師向您說明後，再簽署同意書第 1 頁\n西元2023 年12 月15 日病歷委員會修正通過電子病歷版本 MR 19-947\n西元2021 年11 月15 日品質暨病人安全委員會審核通過\n文件編號\n01400-4-602658\n版次\n02 \n困難營養維生管路透視無痛置放術說明書\n這份說明書是有關您即將接受的醫療處置的效益、風險及替代方案的書面說明，可做為您與\n醫師討論時的補充資料。最重要的是我們希望您能充分瞭解資料的內容，所以請仔細閱讀；\n如果經醫師說明後您還有對這個手術或醫療處置的任何疑問，請在簽名前再與您的醫師充分\n討論，醫師會很樂意為您解答，讓我們一起為了您的健康努力。\n適應症及作法：（簡述）\n困難營養維生管路透視無痛置放術是將一條餵食管經由鼻孔進到胃部，適用於多種無法正常\n由口腔進食的疾病或生理狀況。\n術前準備：除了少量的水及必要的藥物以外，必須禁食四個小時以上。若您有對藥物過敏史\n及其他系統性疾病，請於術前先告訴醫師，以利必要的準備。\n步驟：躺上檢查台後，在X 光透視下放入導管及導線至胃部，並經由導線將營養維生管路放\n入胃部位置後手術就算完成。放置餵食管的時間一般在三十分鐘左右，根據個人解剖位置的\n差異，難易度會有不同，也可能花費更長的時間，極少數的人可能無法順利經由此方式置入\n營養維生管路。\n效益：\n經由餵食管的置入，可以將液態的食物及磨碎的藥物灌入胃中，對於無法經由口腔進食的患\n者可以由此管路攝取營養。但顆粒較大的飲食及藥物並不適合經由此餵食管灌食，灌食後也\n需要立即以開水沖洗管子，以避免管腔阻塞。\n手術/醫療處置成功率：據文獻報導有九成以上成功率，但實際成功率則因個體差異而異。\n風險：\n與此項處置相關的風險包含過程中的不適、餵食管滑脫或阻塞、胃潰瘍、吸入性肺炎(與原\n來就有的胃-食道逆流相關)、出血(極少)、腹膜炎(極少)及其他罕見的併發症。餵食管阻塞或\n脫落需要重新放置，其他罕見的併發症可能需要住院甚至外科方式處理。與營養維生管路的\n死亡案例，各國均有報告過，雖然這是一種安全的術式，仍然有其無法避免或無法預測的情\n形發生。若有任何其他問題，請與醫師充分溝通與討論。\n替代方案：\n根據疾病的不同，可能有其他的處置可以進行，包括以外科開刀或內視鏡來放置餵食管。如\n果您對於本處置有所疑慮，請與您的醫師妥善討論其他方式的可行性及相關風險。\n不實施醫療處置可能的後果：因無法正常由口腔進食所造成之各種生理變化。\n醫師補充說明/病人提出之疑問及解釋：（如無，請填寫無）\n說明醫師：（簽章）\n日期：西元年月日時間：時分\n編號： 851\n國立臺灣大學醫學院附設醫院\nNational Taiwan University Hospital\n困難營養維生管路透視無痛置放術\n說明暨同意書\n病歷號：\n姓名：\n生日：西元年月日\n請詳細閱讀內容，待醫師向您說明後，再簽署同意書第 2 頁\n西元2023 年12 月15 日病歷委員會修正通過電子病歷版本 MR 19-947\n西元2021 年11 月15 日品質暨病人安全委員會審核通過\n文件編號\n01400-4-602658\n版次\n02 \n困難營養維生管路透視無痛置放術同意書\n病人：，出生於西元年月日，需接受困難營養維生管\n路透視無痛置放術。立同意書人已經與醫師討論過接受這個手術或醫療處置的效益、風險\n及替代方案，對醫師的說明都已充分了解且同意由貴院施行該項術式或醫療處置。\n立同意書人：（簽章）\n身分證字號/居留證或護照號碼：\n與病人之關係（請圈選）：本人、配偶、父、母、兒、女、其他：_________\n住址：\n電話：\n日期：西元年月日時間：時分\n(1.如由病人、親屬或關係人簽署本同意書，則無需見證，見證人部分得免填。2.若意識清楚，但無法親自簽具\n者且無親屬或關係人在場，得以按指印代替簽名，惟應有二名見證人。3.若病人意識不清且無親屬或關係人在\n場，醫療緊急情況得由2 名合格醫師在病歷上證明需檢查或治療即可。)\n見證人1：（簽章）見證人2：（簽章）\n見證人1 身分證字號：見證人2 身分證字號：\n日期：西元年月日時間：時分\n困難營養維生管路透視無痛置放術\n東\n址\n1F"}, {"code": "866", "title": "電腦斷層導引腹腔腫瘤冷凍治療術說明暨同意書", "nature": "介入治療／手術", "modality": "消融冷凍與微創介入", "body_raw": "泌尿(腎、膀胱、尿路)", "body_group": "泌尿(腎、膀胱、尿路)", "unit": "東址一樓介入診療室", "campuses": ["東址"], "audience": ["中文一般/成人"], "prep": ["含麻醉或鎮靜"], "phone": "262608", "rel_path": "pdfs/866_電腦斷層導引腹腔腫瘤冷凍治療術說明暨同意書.pdf", "pdf_url": "https://www.ntuh.gov.tw/ckfinder_file/OPD/files/DOCEMENT/inst866.pdf", "pages": 2, "text": "國立臺灣大學醫學院附設醫院\n歷\n號名日\n病姓生\nNationaI Taiwan University HospitaI\n電腦斷層導引腹腔腫瘤冷凍治療術說明暨同\n意書\n第1頁\n電腦斷層導引腹腔腫瘤冷凍治療術說明書\n編號: 866\n這份說明書是有關您即將接受的手術(或醫療處置)的效益、風險及替代方案的書面說\n明,可做為您與醫師討論時的補充資料。最重要的是我們希望您能充份瞭解資料的內\n容,所以請仔細閱讀;如果經醫師說明後您還有對這個手術(或醫療處置)的任何疑\n問,請在簽名前再與您的醫師充分討論,醫師會很樂意為您解答,讓我們一起為了您\n的健康努力。\n適應症及作法: (簡述)\n此項處置是用於腹腔腫瘤的局部治療。您必須先接受影像學檢查,評估腫瘤大小、位\n置及數目,並排除出血體質等狀況,方可接受此項治療。在為您進行治療前,會先給\n予注射止痛藥物,然後進行局部消毒和局部麻醉。在醫師利用電腦斷層定位及導引\n下,將冷凍治療針置入腫瘤中,利用高壓液態氬氦氣體冷凍腫瘤至約攝氏零下165\n度,以達到治療目的。整個療程自定位掃描開始至完成約需40分鐘至數小時不等,依\n據腫瘤大小、位置、形狀以及需要治療的病灶數目而定。每次治療後需平躺4小\n時。如果冷凍治療的位置較難入針,或較疼痛,施作主治醫師會依照病情狀況安排照\n會麻醉科醫師進行全身麻醉。全身麻醉具有額外之麻醉風險及自費費用,會由專科醫\n師審慎評估。\n数益:\n(經由手術或醫療處置,您可能獲得以下所列的效益,但醫師並不能保證您獲得任何\n一項;且手術或醫療處置效益與風險性間的取捨,應由您決定。)\n冷凍治療以冷凍方式直接造成腫瘤壞死。單次治療達腫瘤完全壞死率約六至八成(會因\n腫瘤大小、位置及型態而有所不同,腫瘤越大則完全消除率相對越低)。\n接受此項治療的病人,預後會因其原本的疾病嚴重度(如腫瘤的大小和數目)而不\n同。病人的存活率因腫瘤大小、數目、是否有腫瘤轉移及其他身體狀況而有所差異。\n(沒有任何手術或醫療處置是完全沒有風險的,以下所列的風險已被認定,但是仍然\n可能有一些醫師無法預期的風險未列出。)\n併發症包括最常見的有治療部位臟器功能減退、腹腔內出血( < 5 % )、尿液滲漏\n( < 5 % )、血尿。其他如癌細胞植入其他組織、積膿、石基管、氣胸、血胸、心肌梗塞、中\n風,靜脈血栓等極少發生( < 1 % )。傷口出血、感染、腹膜炎、治療範圍神經傷害、血管\n傷害及皮膚穿刺處凍傷等亦為可能發生之併發症。依據併發症狀況,給予進一步相關\n治療。因此所有病人在接受治療前都應審慎評估。比較容易發生的輕微併發症包括:發\n燒、疼痛、傷口發炎等,一般只需觀察數日即可自行恢復。必要時可給予適度相關治\n療。\n(這個手術或醫療處置的替代方案如下,如果您決定不施行這個手術或醫療處置,可\n能無法有效控制腫瘤生長,請與醫師討論您的決定)\n腹腔腫瘤尚有其他治療方式。包括手術切除、放射或化學治療。需根據疾病嚴重程度\n和病人身體狀況來做選擇。若是您對本身疾病的治療方式仍有疑慮,請與負責照顧您\n的醫師溝通。若不接受治療,腹腔腫瘤可能會持續擴展,腹腔腫瘤擴展後的相關併發\n西元2023年12月15日病歷委員會修正通過電子病歷版本 MR 19一1004\n西元2022年03月17日品質暨病人安全委員會審核通過\n國立臺灣大學醫學院附設醫院\n歷\n號名日\n病姓生\nNationaI Taiwan University HospitaI\n電腦斷層導引腹腔腫瘤冷凍治療術說明暨同\n意書\n第2頁\n症\n只、頁,G 白、酉币訁、\n醫師補充說明/病人提出之問及解釋: (如無,請填寫無)\n1.檢查後如有任何不適請告知醫護人員。\n2 · 檢查後續的治療計畫請您與您的診治醫師做進一步的討論\n3 · 如不符合冷凍治療之健保適應症,或未通過健保事前審核,則冷凍治療之針具以及\n技術費用需自費。詳請請參閱全民健康保險病人使用自費醫材說明書。\n說明醫師:\n時間:時\n日期:西元\n日\n電腦斷層導引腹腔腫瘤冷凍治療術同意書\n,出生於西元\n日,需接受腹腔腫瘤冷\n病人:\n凍治療術。立同意書人對於施行該項術式之原因、過程、效益、替代方案、可能發生\n之併發症及危險,業經貴院有關醫師詳細說明,均已充分了解且同意由貴院施行該項\n術式或醫療處置\n(簽章)\n立同咅人姓名:\n身分證字號/居留證或護照號碼:\n與病人之關係(請圈選) :本人、配偶、父、母、兒、女、其他:\n住址:\n電話:\n年\n日期:西元\n月\n日\n( l.如由病人、親屬或關係人簽署本同意書,則無需見證,見證人部分得免填。2.若意識清楚,但無法親自簽具者且\n無親屬或關係人在場,得以按指印代替簽名,惟應有二名見證人。3.若病人意識不清且無親屬或關係人在場,醫療\n緊急情況得由二名合格醫師在病歷上證明需檢查或治療即可。)\n(簽章)見證人2 :\n(簽章)\n見證人1 :\n見證人1身分證字號:\n見證人2身分證字號:\n日時間 •\n時\n日期:西元\n西元2023年12月15日病歷委員會修正通過電子病歷版本 MR 19一1004\n西元2022年03月17日品質暨病人安全委員會審核通過"}, {"code": "877", "title": "腦部磁振造影精準導引高強度聚焦超音波能量手術說明暨同意書", "nature": "介入治療／手術", "modality": "神波刀 (MRgFUS)", "body_raw": "腦與神經", "body_group": "腦與神經", "unit": "兒醫大樓三樓影像醫學部", "campuses": ["兒醫大樓"], "audience": ["中文一般/成人"], "prep": ["需禁食／空腹", "含麻醉或鎮靜"], "phone": "270335", "rel_path": "pdfs/877_腦部磁振造影精準導引高強度聚焦超音波能量手術說明暨同意書.pdf", "pdf_url": "https://www.ntuh.gov.tw/ckfinder_file/OPD/files/DOCEMENT/inst877.pdf", "pages": 4, "text": "國立臺灣大學醫學院附設醫院\nNational Taiwan University Hospital\n腦部磁振造影精準導引\n高強度聚焦超音波能量手術說明暨同意書\n病歷號：\n姓名：\n生日：西元年月日\n請詳細閱讀內容，待醫師向您說明後，再簽署同意書第 1頁\n西元2023 年12 月15 日病歷委員會修正通過電子病歷版本 MR 19-1025\n西元2023 年07 月12 日品質暨病人安全委員會審核通過\n\n文件編號\n01400-4-602772\n版次\n03\n腦部磁振造影精準導引高強度聚焦超音波能量手術說明書\n編號：877\n這份說明書是有關您即將接受的手術的效益、風險及替代方案的書面說明，可做為您與\n醫師討論時的補充資料，更重要的是我們希望您能充分瞭解資料的內容，所以請仔細閱讀如\n果經醫師說明後您還有對這個手術的任何疑問，請在簽名前再與您的醫師充分討論，醫師會\n很樂意為您解答，讓我們一起為了您的健康努力。\n適應症及作法：（簡述）\n適應症：\n臨床證實為嚴重顫抖症或帕金森氏症病人，且服用藥物後效果不佳或出現嚴重副作用。\n作法：\n腦部磁振造影精準導引高強度聚焦超音波能量手術是使用磁振造影做精準定位，並即時\n監測腦組織中的溫度變化，並以高強度聚焦超音波治療儀之超音波能量進行治療的手術。\n1.首先，會在局部麻醉及適當的止痛下為您安裝頭架，安裝過程中請您頭部需盡量保持不動以\n確保頭架搭在理想的位置上。\n2.進入磁振造影室後，會使用能量手術專用的頭盔並採集一系列的磁振造影影像，以進行精準\n定位並規劃治療方式。\n3.開始治療時，為了確保手術的安全性，會先由低能量開始治療，再逐漸增強聚焦超音波之能\n量；醫師會在現場即時觀察影像上之溫度及組織形變並配合您的臨床表徵，決定並調整適合\n您的能量強度與間隔時間，整個療程大約需要3 個小時，並且治療過程中治療床可能會進出\n磁振造影儀。\n4.在接受較高能量的治療時，可能會有些許疼痛，如果您在術中感到不適或疼痛，可以隨時按\n下手中的按鈕，此時您的醫療團隊會即時協助處理您的症狀後再評估是否繼續治療。\n5.術後，將採集一系列的磁振造影影像，以觀察組織之型態變化及確保療效。\n手術前後需注意事項：\n1.術前四小時需絕對禁食，禁食的那一餐也停用糖尿病藥物(但其它必要的藥物：如抗高血壓、\n抗氣喘、抗癲癇……等必須藥物，請依照醫師指示服用)。\n2.必須事先放置導尿管(以避免您手術過程中需要去洗手間)及放置靜脈留置針。\n3.須有家屬陪伴且填妥同意書。\n4.術前須剃光頭髮，以仔細檢查您的頭部是否有疤痕，並使得頭部表面得以與治療專用頭盔密\n切接合。\n5.治療結束後，預期您會返回一般病房，觀察病情並等待恢復。\n國立臺灣大學醫學院附設醫院\nNational Taiwan University Hospital\n腦部磁振造影精準導引\n高強度聚焦超音波能量手術說明暨同意書\n病歷號：\n姓名：\n生日：西元年月日\n請詳細閱讀內容，待醫師向您說明後，再簽署同意書第 2頁\n西元2023 年12 月15 日病歷委員會修正通過電子病歷版本 MR 19-1025\n西元2023 年07 月12 日品質暨病人安全委員會審核通過\n\n文件編號\n01400-4-602772\n版次\n03\n（腦部磁振造影精準導引高強度聚焦超音波能量手術說明書承上頁）\n效益：（經由手術或醫療處置，您可能獲得以下所列的效益，但醫師並不能保證您獲得任何一\n項；且手術或醫療處置效益與風險性間的取捨，應由您決定。）\n改善因腦組織病變所引起之神經學臨床症狀，以增進生活的品質。此項術式治療成功的機率\n相當高，絕大多數病人在治療後症狀可以得到不同程度的緩解，而且根據目前的研究顯示，\n四年的追蹤大部分病人仍然能夠維持臨床治療效果。(參考文獻 Park, Y. S., Jung, N. Y., Na,Y.\nC., & Chang, J. W. (2019). Four-year follow-up results of magnetic resonance-guided focused\nultrasound thalamotomy for essential tremor. Movement Disorders, 34(5), 727-734.) 由於會接受這\n個術式的病人都是藥物難以治癒的顫抖或是以顫抖為主要表現型的巴金森氏症，不接受治療\n而持續用藥物的話，大多難以達成滿意的療效。\n風險：\n沒有任何手術或醫療處置是完全沒有風險的，以下所列的風險已被認定，但是仍然可能有一\n些醫師無法預期的風險未被列出：\n1.可能因為組織灼熱而引起頭部不適，聚焦超音波治療能精確的控制脈衝熱能致使小部分組織\n凝固（一般為55-65℃，持續幾秒），距離聚焦中心點以外的能量強度很低，會盡量避開容\n易吸收超音波能量之疤痕組織，您可能會從墊圈同時感受到主動冷卻循環水的冰冷，以及頭\n骨因超音波溫度升高時的熱，但因為超音波束的焦點與含有痛覺感受器的硬腦膜（覆蓋和保\n護大腦的厚纖維組織）距離甚遠，並且在大腦中沒有痛覺感受器，因此在手術過程中，腦組\n織病灶被消融或分解時不會造成疼痛。\n2.皮膚燒傷是一種潛在的風險，可能由意外的音波耦合所致。預防的方法包括治療前須將超音\n波探頭和顱骨之間的間隙用水袋填充，以提供合適的超音波穿越窗口；若皮膚上有殘留小氣\n泡，將導致超音波聚焦形成一個局部熱點，因此可能會引起局部的疼痛或溫熱；到目前為止，\n尚未有任何案例因使用此一能量手術造成皮膚嚴重燒傷。\n3.手術前後您可能因頭部固定器導致頭痛，此一現象是暫時性的。\n4.您可能有輕微不良反應，包括定向障礙、頭暈目眩、身體不穩(約2%)、無法平衡(約5%)、\n步態障礙 (約2%)、噁心或嘔吐，基於目前資料顯示，這些現象屬於暫時性的，大約一天內\n即可消退。\n5.術後可能會有頭皮、顏面和上肢出現暫時性麻木或麻刺感(約12%)、眼部抽搐、感覺過於敏\n感或感覺異常麻木，這些症狀通常是暫時性的，大約數分鐘或一天內即可恢復，但過去報導\n仍有少數案例出現感覺異常持續數天。\n替代方案：（這個手術的替代方案如下，如果您決定不接受此手術，其對病情演變的影響，請\n與您的主治醫師討論您的決定。）\n1. 藥物治療。\n2. 開顱深腦刺激術。\n國立臺灣大學醫學院附設醫院\nNational Taiwan University Hospital\n腦部磁振造影精準導引\n高強度聚焦超音波能量手術說明暨同意書\n病歷號：\n姓名：\n生日：西元年月日\n請詳細閱讀內容，待醫師向您說明後，再簽署同意書第 3頁\n西元2023 年12 月15 日病歷委員會修正通過電子病歷版本 MR 19-1025\n西元2023 年07 月12 日品質暨病人安全委員會審核通過\n\n文件編號\n01400-4-602772\n版次\n03\n（腦部磁振造影精準導引高強度聚焦超音波能量手術說明書承上頁）\n3. 開顱視丘燒灼術。\n醫師補充說明/病人提出之疑問及解釋：(如無，請填寫無)\n目前腦部磁振造影精準導引高強度聚焦超音波能量手術未納入健保給付，檢查與治療儀\n器、相關耗材以及技術費用，將完全依照衛生局核可通過之自費項目約新台幣六十五萬元。\n詳情請參閱全民健康保險病人使用自費醫材說明書。\n一、此項手術為自費項目，但醫師並不保證您一定能獲得上述的手術效益；且手術效益與風\n險的取捨，應由您充分瞭解上述重要事項後自行決定是否同意進行手術。\n二、上述所列的手術相關風險為已知且常見的狀況，但仍有部份少數罕見或無法預期或情況\n可能發生。\n三、簽名前請再次詳閱本說明書、手術同意書及其補充說明。\n說明醫師：（簽章）\n日期：西元年月日時間：時分\n腦部磁振造影精準導引高強度聚焦超音波能量手術同意書\n病人：，出生於西元年月日，需接受本能量手術治療。立\n同意書人已經與醫師討論過接受這個醫療處置的效益、風險及替代方案，對醫師的說明都已\n充分了解且同意由貴院施行本項醫療處置。\n立同意書人姓名：（簽章）\n身分證字號/居留證或護照號碼：\n與病人之關係（請圈選）：本人、配偶、父、母、兒、女、其他：_________\n住址：\n電話：\n日期：西元年月日時間：時分\n(1.如由病人、親屬或關係人簽署本同意書，則無需見證，見證人部分得免填。2.若意識清楚，但無法親自簽具者\n且無親屬或關係人在場，得以按指印代替簽名，惟應有二名見證人。3.若病人意識不清且無親屬或關係人在場，\n醫療緊急情況得由2 名合格醫師在病歷上證明需檢查或治療即可。)\n見證人1：（簽章）見證人2：（簽章）\n見證人1 身分證字號：見證人2 身分證字號：\n日期：西元年月日時間：時分\n西元2020 年08 月19 日病歷委員會修正通過電子病歷版本 MR19-184\n文件編號\n01400-4-600050\n版次\n03 \n國立臺灣大學醫學院附設醫院\nNational Taiwan University Hospital\n磁振掃描攝影檢查安全規範聲明書\n我充分明瞭在磁振造影檢查室內嚴禁任何金屬或磁性物質\n請逐項檢查自己或家人身上是否有下列物品，並勾選。如果不確定身上有無下列物品、\n或其他未列出的人工物品，請向管理者詢問。\n體內裝置人工物件\n□心律調節器/調節器導線(要事先與廠商聯絡，當天可能需要設定體內裝置)\n□植入式神經刺激器或導線(要事先與廠商聯絡，當天可能需要設定體內裝置)\n□動脈止血夾 □顱內動脈瘤血管夾\n□人工心臟瓣膜 □電極\n□胰島素幫浦、注射器 □分流導管\n□人工關節 □以金屬棒、金屬盤針、螺絲、釘子、或夾子等修補的骨折\n□骨針或關節針 □義肢、護腰、止血沙袋\n□義肢、護腰、止血沙袋 □縫合線\n□槍彈碎片 □假牙\n□眼睛有金屬碎屑 □人工電子耳\n□助聽器 □其他(請列出)\n金屬或磁性物質\n□眼鏡 □可取下之牙套\n□刺青、眼線 □珠寶首飾(耳環、項鍊、戒指等)\n□手錶 □錢包、皮夾\n□筆、隨身碟 □鑰匙\n□錢幣 □小刀、剪刀、打火機、暖暖包、肚環\n□金屬拉鍊或鈕釦 □皮帶扣\n□鞋子 □磁卡(信用卡、提款卡等)\n□髮夾、髮飾 □金屬胸罩扣環\n□有金屬內襯的胸罩或內衣 □別針\n□其他(請列出)\n立同意書人姓名：（簽章）\n身分證字號/居留證或護照號碼：\n與病人之關係（請圈選）：本人、配偶、父、母、兒、女、其他：_________\n住址：\n電話：\n日期：西元年月日時間：時分\n(1.如由病人、親屬或關係人簽署本同意書，則無需見證，見證人部分得免填。2.若意識清楚，但無法親自簽具者\n且無親屬或關係人在場，得以按指印代替簽名，惟應有二名見證人。3.若病人意識不清且無親屬或關係人在場，\n醫療緊急情況得由2 名合格醫師在病歷上證明需檢查或治療即可。)\n見證人1：（簽章）見證人2：（簽章）\n見證人1 身分證字號：見證人2 身分證字號：\n日期：西元年月日時間：時分\n病歷號：\n姓名：\n生日：西元年月日\n請詳細閱讀內容，待醫師向您說明後，再簽署同意書"}, {"code": "891", "title": "磁振導引高強度聚焦超音波(神波刀)治療子宮疾病手術說明暨同意書", "nature": "介入治療／手術", "modality": "神波刀 (MRgFUS)", "body_raw": "其他", "body_group": "其他", "unit": "西址一樓磁振造影室", "campuses": ["西址"], "audience": ["中文一般/成人"], "prep": ["需禁食／空腹", "需清腸／低渣", "使用顯影／造影劑", "含麻醉或鎮靜"], "phone": "262636", "rel_path": "pdfs/891_磁振導引高強度聚焦超音波(神波刀)治療子宮疾病手術說明暨同意書.pdf", "pdf_url": "https://www.ntuh.gov.tw/ckfinder_file/OPD/files/DOCEMENT/inst891.pdf", "pages": 4, "text": "國立臺灣大學醫學院附設醫院\nNational Taiwan University Hospital\n磁振導引高強度聚焦超音波（神波刀）治療\n子宮疾病手術說明暨同意書\n請詳細閱讀內容，待醫師向您說明後，再簽署同意書第 1 頁\n文件編號\n01400-4-602782\n版次\n03\n病歷號：\n姓名：\n生日：西元年月日\n\n西元2024 年06 月11 日病歷委員會修正通過電子病歷版本 MR 19-1033\n西元2024 年05 月24 日品質病人安全委員會審核通過\n磁振導引高強度聚焦超音波（神波刀）治療子宮疾病手術說明書\n這份說明書是有關您即將接受的手術的效益、風險及替代方案的書面說明，可做為您\n與醫師討論時的補充資料，更重要的是我們希望您能充分瞭解資料的內容，所以請仔細閱\n讀，如果經醫師說明後您還有對這個手術的任何疑問，請在簽名前再與您的醫師充分討論，\n醫師會很樂意為您解答，讓我們一起為了您的健康努力。\n適應症及作法：（簡述）\n適應症：子宮肌瘤、子宮肌腺症或相關病灶。\n磁振導引高強度聚焦超音波(MRgFUS, Magnetic resonance-guided focused ultrasound)又稱神\n波刀，以非侵入性(免開刀)無創治療方式治療子宮肌瘤，利用超聲波具有的組織穿透性和可\n聚焦性等物理特徵，從體外將超音波聚焦在體內子宮肌瘤、子宮肌腺症或相關病灶處，使焦\n點區域產生60- 80°C 高溫，而蛋白質在56°C 便壞死，其後藉由身體的吞噬細胞將被破壞的\n腫瘤或病灶吸收代謝掉，因此腫瘤或病灶的體積會逐漸變小，達到無創消融子宮肌瘤、子宮\n肌腺症或相關病灶的目的。\n作法：\n1. 首先，進入磁振造影室後會進行擺位，護理師會為您放置直腸導管，灌注凝膠，以保護\n薦骨神經。調整好位置後，會進行術前磁振造影掃描，以進行精準定位並規劃治療方式。\n2. 治療時需使用鎮靜鎮痛類麻醉藥物，以減緩手術中的不舒服症狀，例如:下腹悶痛、腰酸\n及臀部痛等。但鎮靜鎮痛藥可能出現藥物不良反應及麻醉相關的風險，例如:頭暈、噁心、\n嘔吐及呼吸抑制等，多數經由適當的治療及休息會獲得緩解。\n3. 為了確保手術的安全性，會先由低能量開始治療，再逐漸增強聚焦超音波之能量；醫師\n會在現場即時觀察影像上之溫度及組織形變並配合您的臨床表徵，決定並調整適合您的\n能量強度與間隔時間，整個療程大約需要3 個小時。\n4. 在接受較高能量的治療時，可能會有些許疼痛，如果您在術中感到不適或疼痛，可以隨\n時按下手中的按鈕，此時您的醫療團隊會即時協助處理您的症狀後再評估是否繼續治療。\n5. 術後，將再次掃描一系列的磁振造影影像，並且施打含釓(Gadolinium) 顯影劑，以觀察\n組織之型態及訊號變化來確保療效。\n手術前後需注意事項：\n1. 術前一日之晚餐採低渣飲食（如粥，避免易產氣之豆類製品以及有纖維的蔬果類)。術前\n一晚使用Bisacodyl 栓劑，進行清腸。清腸後至術前4 小時以上可飲食喝水，仍需維持低\n渣飲食。術前4 小時起需絕對禁食同時停用糖尿病藥物，但其它必要的藥物：如抗高血\n壓、抗氣喘、抗癲癇……等必須藥物，請依照醫師指示服用。\n2. 治療當日請避免在腹部使用爽身粉或者乳液。報到後，會請您服用門診所開立的口服止\n痛藥。接著，會由護理師為您進行皮膚準備(剃除會陰部毛髮)、放置導尿管(手術中用以\n控制膀胱位置)及放置靜脈留置針。\n3. 須有家屬陪伴且填妥同意書。\n4. 治療結束後，您會在觀察室稍作休息，以密切觀察治療後之狀況，若恢復良好，即可返\n家休養，並且依約定日期回診。\n編號：891\n國立臺灣大學醫學院附設醫院\nNational Taiwan University Hospital\n磁振導引高強度聚焦超音波（神波刀）治療\n子宮疾病手術說明暨同意書\n請詳細閱讀內容，待醫師向您說明後，再簽署同意書第 2 頁\n文件編號\n01400-4-602782\n版次\n03\n病歷號：\n姓名：\n生日：西元年月日\n\n西元2024 年06 月11 日病歷委員會修正通過電子病歷版本 MR 19-1033\n西元2024 年05 月24 日品質病人安全委員會審核通過\n(磁振導引高強度聚焦超音波（神波刀）治療子宮疾病手術說明書承上頁）\n效益：\n（經由手術，您極可能獲得以下所列的效益，但醫師並不能100%保證您獲得任何一項，\n且手術效益與風險性間的取捨，應由您決定。）\n經神波刀消融治療所產生的壞死組織可被正常組織逐漸吸收，使子宮肌瘤變小或病灶消失，\n研究顯示子宮肌瘤體積在術後大約可以減少30-40%。針對月經期出血量大、經期過長、頻\n尿、經痛等症狀，大約85%的病人在治療後3 個月內便顯著改善。即使因病灶巨大，一次\n性的超音波消融治療子宮肌瘤、子宮肌腺症或相關病灶後無法全面性的根除，殘餘部分還\n可以再次接受超音波消融術，也不會影響後續改用其它的治療方式。\n風險：\n沒有任何手術或醫療處置是完全沒有風險的，以下所列的風險已被認定，但是仍然可能有\n一些醫師無法預期的風險未被列出：\n(1)腹部腹痛及悶痛：神波刀治療後，會有輕微的腹痛或悶痛，是因為神波刀利用聚焦後所\n產生的高熱能破壞病灶組織的血流供應，讓組織產生凝固性壞死後的常見反應，一般可先觀\n察，服用醫師開立之止痛藥物。若是感覺到腹痛未緩解持續加重，可先連絡您的醫師或是提\n前返診。\n(2)皮膚燒傷(0.15%)：皮膚上若有小的傷疤，治療前會使用疤痕貼片避免皮膚灼傷。治療過\n程中，由磁振造影影像中確認超音波探頭和皮膚之間沒有間隙，以預防皮膚燒傷的風險。治\n療過程中，若有皮膚燙的感覺，請按下手中的停止按鈕，由團隊進行治療的調整。\n(3)暫時性月經週期改變：通常在治療後的3 個月左右，會重新恢復規律的月經週期。期間\n若出血量比平時月經量還要多，有可能需要輸血治療。\n(4)其他罕見風險包含腿部疼痛(0.06%)、尿滯留(0.04%)、高燒(0.03%)、靜脈栓塞、腸穿孔、\n坐骨神經損傷等。\n替代方案：（這個手術的替代方案如下，如果您決定不接受此手術，其對病情演變的影響，\n請與您的主治醫師討論您的決定。）\n1. 藥物治療\n2. 手術治療：傳統、腹腔鏡或達文西手術\n醫師補充說明/病人提出之疑問及解釋：（如無，請填寫無）\n目前以磁振導引神波刀治療子宮疾病未納入健保給付，檢查與治療儀器、相關耗材以及技\n術費用，將完全依照衛生局核可通過之自費項目，單次治療自費費用約為22 萬元，實際收\n費以電腦計價為準，詳情請參閱全民健康保險病人使用自費醫材說明書。\n說明醫師：（簽章）\n日期：西元年月日時間：時分\n國立臺灣大學醫學院附設醫院\nNational Taiwan University Hospital\n磁振導引高強度聚焦超音波（神波刀）治療\n子宮疾病手術說明暨同意書\n請詳細閱讀內容，待醫師向您說明後，再簽署同意書第 3 頁\n文件編號\n01400-4-602782\n版次\n03\n病歷號：\n姓名：\n生日：西元年月日\n\n西元2024 年06 月11 日病歷委員會修正通過電子病歷版本 MR 19-1033\n西元2024 年05 月24 日品質病人安全委員會審核通過\n磁振導引高強度聚焦超音波（神波刀）治療子宮疾病手術同意書\n病人：，出生於西元年月日，需接受高強度聚焦超音波\n手術治療。立同意書人已經與醫師討論過接受這個醫療處置的效益、風險、替代方案及自費\n費用，對醫師的說明都已充分了解且同意由貴院施行本項醫療處置。\n我充分明瞭在磁振造影檢查室內嚴禁任何金屬或磁性物質。\n請逐項檢查自己身上物品，如果不確定身上有無下列物品、或其他未列出的人工物品，請詢\n問檢查室人員。\n□無下列體內裝置人工物件。\n有下列不可去除之體內裝置人工物件：\n□心律調節器/調節器導線(要事先與廠商聯絡，當天可能需要設定體內裝置)\n□植入式神經刺激器或導線(要事先與廠商聯絡，當天可能需要設定體內裝置)\n□顱內動脈瘤血管夾\n□動脈止血夾\n□人工電子耳\n□電極\n立同意書人姓名：（簽章）\n身分證字號/居留證或護照號碼：\n與病人之關係（請圈選）：本人、配偶、父、母、兒、女、其他：_________\n住址：\n電話：\n日期：西元年月日時間：時分\n(1.如由病人、親屬或關係人簽署本同意書，則無需見證，見證人部分得免填。2.若意識清楚，但無法親自簽\n具者且無親屬或關係人在場，得以按指印代替簽名，惟應有二名見證人。3.若病人意識不清且無親屬或關係\n人在場，醫療緊急情況得由2 名合格醫師在病歷上證明需檢查或治療即可。)\n見證人1：（簽章）見證人2：（簽章）\n見證人1 身分證字號：見證人2 身分證字號：\n日期：西元年月日時間：時分\n磁振導引高強度聚焦超音波(神波刀)治療子宮疾病手術\n西址1F"}, {"code": "892", "title": "磁振導引高強度聚焦超音波(神波刀)治療後腹腔腫瘤手術說明暨同意書", "nature": "介入治療／手術", "modality": "神波刀 (MRgFUS)", "body_raw": "其他", "body_group": "其他", "unit": "影像醫學部", "campuses": ["未指明特定大樓"], "audience": ["中文一般/成人"], "prep": ["需禁食／空腹", "含麻醉或鎮靜"], "phone": "251397", "rel_path": "pdfs/892_磁振導引高強度聚焦超音波(神波刀)治療後腹腔腫瘤手術說明暨同意書.pdf", "pdf_url": "https://www.ntuh.gov.tw/ckfinder_file/OPD/files/DOCEMENT/inst892.pdf", "pages": 3, "text": "國立臺灣大學醫學院附設醫院\nNational Taiwan University Hospital\n磁振導引高強度聚焦超音波（神波刀）治療\n後腹腔腫瘤手術說明暨同意書\n病歷號：\n姓名：\n生日：西元年月日\n\n西元2022 年11 月04 日病歷委員會修正通過 MR 19-1032\n西元2022 年10 月31 日品質暨病人安全委員會審核通過\n文件編號\n01400-4-602781\n版次\n1\n請詳細閱讀內容，待醫師向您說明後，再簽署同意書\n第 1 頁\n磁振導引高強度聚焦超音波（神波刀）治療後腹腔腫瘤手術說明書\n這份說明書是有關您即將接受的手術的效益、風險及替代方案的書面說明，可做為您與醫師\n討論時的補充資料，更重要的是我們希望您能充分瞭解資料的內容，所以請仔細閱讀，如果\n經醫師說明後您還有對這個手術的任何疑問，請在簽名前再與您的醫師充分討論，醫師會很\n樂意為您解答，讓我們一起為了您的健康努力。\n手術/醫療處置之適應症及作法：（簡述）\n磁振導引高強度聚焦超音波(MRgFUS, Magnetic resonance-guided focused ultrasound)又稱神波\n刀，以非侵入性(免開刀)無創治療方式治療後腹腔腫瘤(包含胰臟腫瘤、腎腫瘤及其它後腹腔\n腫瘤)，利用磁振造影精確定位後腹腔腫瘤，且能監測溫度的變化，搭配非侵入性超音波聚焦\n技術，將超音波能量集中在腫瘤病灶處，使焦點區域產生60-80°C 高溫，以熱消融破壞目標\n腫瘤。\n適應症：\n1.胰臟腫瘤：\n(1).對於早期胰腺癌來說，神波刀可以對病灶進行大範圍的熱消融，達到外科手術切除的效\n果，並且損傷小、恢復快，同時又避免了因手術引起腫瘤醫源性播散的危險。\n(2).對於中晚期胰腺癌目前缺乏有效的治療手段，而胰腺癌腫瘤對溫度比較敏感，神波刀治\n療能夠有效地殺滅腫瘤組織，減輕腫瘤負荷。\n2.腎腫瘤：\n(1).早期腎癌：對於早期腎癌患者，神波刀治療可以達到外科手術根除的效果。\n(2).晚期腎癌：對於晚期的腎癌患者，因腫瘤有局部浸潤、淋巴結轉移、遠處轉移，喪失了\n手術治療的機會，而神波刀作為一種非侵入性的治療手段，可以進行姑息性的治療，殺滅\n大部份腫瘤，減輕腫瘤負荷。\n3.其它後腹腔腫瘤：其它後腹腔腫瘤將依照腫瘤的位置、大小、腫瘤的供血情況、與周圍組織\n器官（胃、腸道等）的毗鄰關係、超音波通道內的腹主動脈有無鈣化，腫瘤周圍的腸道能否\n被超音波探頭推移以及腫瘤區有無醫用置入物等因素，由醫師謹慎評估是否可執行。\n作法：\n1.首先，進入磁振造影室後會掃描一系列的磁振造影影像，以進行精準定位並規劃治療方式。\n2.一般情況下不需要全身麻醉，在鎮痛條件下就可以完成治療。但鎮靜鎮痛藥可能出現藥物\n不良反應及麻醉相關的風險，例如:頭暈、噁心、嘔吐及呼吸抑制等，經由適當的治療及休息\n會獲得緩解。\n3.開始治療後，為了確保手術的安全性，會先由低能量開始治療，再逐漸增強聚焦超音波之\n能量；醫師會在現場即時觀察影像上之溫度及組織形變並配合您的臨床表徵，決定並調整適\n合您的能量強度與間隔時間，整個療程大約需要3 個小時。\n4.在接受較高能量的治療時，可能會有些許疼痛，如果您在術中感到不適或疼痛，可以隨時\n按下手中的按鈕，此時您的醫療團隊會即時協助處理您的症狀後再評估是否繼續治療。\n編號：892\n國立臺灣大學醫學院附設醫院\nNational Taiwan University Hospital\n磁振導引高強度聚焦超音波（神波刀）治療\n後腹腔腫瘤手術說明暨同意書\n病歷號：\n姓名：\n生日：西元年月日\n\n西元2022 年11 月04 日病歷委員會修正通過 MR 19-1032\n西元2022 年10 月31 日品質暨病人安全委員會審核通過\n文件編號\n01400-4-602781\n版次\n1\n請詳細閱讀內容，待醫師向您說明後，再簽署同意書\n第 2 頁\n（磁振導引高強度聚焦超音波（神波刀）治療後腹腔腫瘤手術說明書承上頁）\n手術前後需注意事項：\n1.治療前3 天需無渣、不產氣、易消化飲食；術前8 小時需絕對禁食同時停用糖尿病藥物，但\n其它必要的藥物：如抗高血壓、抗氣喘、抗癲癇……等必須藥物，請依照醫師指示服用。\n2.事先皮膚準備(治療區域剃毛)、放置導尿管(以避免您手術過程中需要去洗手間)及放置靜脈\n留置針。治療特定位置的後腹腔腫瘤(如胰腺癌)需放置鼻胃管(治療過程中可經鼻胃管注入涼\n的生理鹽水)，以避免熱能對胃造成損傷。\n3.以神波刀治療結束後，需常規禁食、留置胃管48～72 小時，待胃腸功能逐漸恢復(正常排氣)，\n無腹痛症狀後，從流食逐漸恢復到正常飲食。\n接受此手術/醫療處置之效益：\n神波刀最大的優點就是非侵入性的治療，具有不開刀、不流血、損傷小、術後恢復快等\n優點。同時也可以分別多次治療體積更大的腫瘤，並且不受腫瘤的大小、形狀、位置的限制。\n臨床研究證明神波刀治療胰臟腫瘤、腎腫瘤及其它後腹腔腫瘤是安全、有效和可行的。\n手術/醫療處置風險：\n（經由手術，您極可能獲得以下所列的效益，但醫師並不能100%保證您獲得任何一項，且手\n術效益與風險性間的取捨，應由您決定。）\n只有少數的病人可能因能量熱治療引起危險及副作用，不過這些情況在治療過程中即可發\n現，且立即處理。以下所列的風險已被認定，但是仍然可能有一些醫師無法預期的風險未被\n列出：\n(1)治療過程中定位或加熱引起之疼痛。\n(2)皮膚燒傷：在治療中會將超音波探頭和皮膚之間的間隙用水袋填充以預防皮膚燒傷的風\n險。\n(3)腸道黏膜損傷：由於後腹腔腫瘤常毗鄰腸道，而腸道是空腔臟器，在超音波傳導過程中是\n一個反射界面，容易造成損傷，因此需要進行嚴格的腸道準備，使腸道內容物排空，避免治\n療過程中損傷。\n(4)其它罕見風險包含周圍血管及神經傷害、靜脈血栓、高燒等。\n替代方案：\n（這個手術的替代方案如下，如果您決定不接受此手術，其對病情演變的影響，請與您的主\n治醫師討論您的決定。）\n(1)胰腺癌：手術切除、化學與放射治療。\n(2)腎腫瘤：手術切除、動脈栓塞術、局部消融治療、化學與放射治療。\n(3)其它後腹腔腫瘤：手術切除、化學與放射治療。\n醫師補充說明/病人提出之疑問及解釋：(如無，請填寫無)\n目前以磁振造影導引神波刀治療後腹腔腫瘤未納入健保給付，檢查與治療儀器、相關耗材以\n及技術費用，將完全依照衛生局核可通過之自費項目。詳情請參閱全民健康保險病人使用自\n費醫材說明書。\n國立臺灣大學醫學院附設醫院\nNational Taiwan University Hospital\n磁振導引高強度聚焦超音波（神波刀）治療\n後腹腔腫瘤手術說明暨同意書\n病歷號：\n姓名：\n生日：西元年月日\n\n西元2022 年11 月04 日病歷委員會修正通過 MR 19-1032\n西元2022 年10 月31 日品質暨病人安全委員會審核通過\n文件編號\n01400-4-602781\n版次\n1\n請詳細閱讀內容，待醫師向您說明後，再簽署同意書\n第 3 頁\n（磁振導引高強度聚焦超音波（神波刀）治療後腹腔腫瘤手術說明書承上頁）\n說明醫師：（簽章）\n日期：西元年月日時間：時分\n磁振導引高強度聚焦超音波（神波刀）治療後腹腔腫瘤手術同意書\n病人：，出生於西元年月日，因患，\n需接受高強度聚焦超音波治療後腹腔腫瘤手術。立同意書人已經與醫師討論過接受這個醫療\n處置的效益、風險、替代方案及自費費用，對醫師的說明都已充分了解且同意由貴院施行本\n項醫療處置。\n立同意書人：（簽章）\n身分證字號/居留證或護照號碼：\n與病人之關
